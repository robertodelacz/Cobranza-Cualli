<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   COBRANZA CUALLI · Front
   Hoy · Reportes · Avisos · Hoja de trabajo · Cartera · Historial de envíos ·
   Ajustes de saldo · Datos de clientes · Configuración
   ═══════════════════════════════════════════════════════════════════════════ */

const S = {
  estado: null, cola: null, cartera: null, resumen: null, hoja: null, saldosV: null, cortes: null, bitacora: null, ajustes: null, datos: null, config: null,
  vista: 'hoy', carga: { rep1: null, rep9: null }, cargaSeq: 0, excl: new Set(), busqueda: '',
  filtroCartera: 'todos', mostrarCartera: 80, filtroHist: { status: '', texto: '' }, listaDatos: 'sinTasa',
  hojaTab: 'hoja', hojaFiltro: 'todos', hojaMoneda: '', hojaBusqueda: '', resaltar: null
};

const DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const DOW_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const REP = {
  rep1: { n: 'Rep1', sello: 'R1', sub: 'Próximos vencimientos', unidad: ['cuota', 'cuotas'] },
  rep9: { n: 'Rep9', sello: 'R9', sub: 'Saldos e intereses por línea', unidad: ['línea', 'líneas'] }
};

/* ─── Utilidades ───────────────────────────────────────────────────────── */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const pl = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);
const can = p => !!(S.estado && S.estado.permisos && S.estado.permisos.indexOf(p) >= 0);
const ico = (id, cls) => '<svg class="' + (cls || '') + '" width="20" height="20" aria-hidden="true"><use href="#g-' + id + '"/></svg>';
const icoI = id => '<svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-' + id + '"/></svg>';

function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(resolve => {
    google.script.run
      .withSuccessHandler(r => resolve(r))
      .withFailureHandler(e => resolve({ ok: false, error: (e && e.message) || String(e) }))[fn].apply(null, args);
  });
}

function pk(k) { const p = k.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
function dCorta(k) { const d = pk(k); return DOW[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MES[d.getUTCMonth()]; }
function dLarga(k) { const d = pk(k); return DOW_L[d.getUTCDay()] + ' ' + d.getUTCDate() + ' de ' + MES_L[d.getUTCMonth()]; }
function dLargaAnio(k) { return dLarga(k) + ' de ' + k.slice(0, 4); }
function dma(k) { return k ? k.slice(8, 10) + '/' + k.slice(5, 7) + '/' + k.slice(0, 4) : ''; }
function dm(k) { return k ? k.slice(8, 10) + '/' + k.slice(5, 7) : ''; }
const miles = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
function n2(v) { const x = Number(v) || 0, p = Math.abs(x).toFixed(2).split('.'); return (x < 0 ? '-' : '') + miles(p[0]) + '.' + p[1]; }
function dinero(n, mon) { const v = Number(n) || 0; return (v < 0 ? '-' : '') + (mon === 'USD' ? 'US$' : '$') + n2(Math.abs(v)); }
function dineroC(n, mon) { const v = Math.round(Number(n) || 0); return (v < 0 ? '-' : '') + (mon === 'USD' ? 'US$' : '$') + miles(Math.abs(v)); }
const pct = v => Number(((Number(v) || 0) * 100).toFixed(2)) + '%';
function horaDe(ts) { const m = String(ts || '').match(/(\d{2}):(\d{2})/); return m ? m[1] + ':' + m[2] : ''; }
function fechaDe(ts) { const m = String(ts || '').match(/^(\d{4}-\d{2}-\d{2})/); return m ? m[1] : ''; }
function cuandoTxt(ts) {
  const f = fechaDe(ts), h = horaDe(ts), hoy = S.estado && S.estado.tanda ? S.estado.tanda.hoy : '';
  return (f === hoy ? 'hoy' : (f ? dCorta(f) : '')) + (h ? ' a las ' + h : '');
}
function sumaMon(items, fn) { const m = {}; items.forEach(i => { m[i.moneda] = (m[i.moneda] || 0) + fn(i); }); return m; }
function montosTxt(items, fn) {
  const m = sumaMon(items, fn || (i => i.total));
  return Object.keys(m).sort().map(k => dineroC(m[k], k) + (k === 'MXN' ? ' MXN' : '')).join(' y ');
}
function montoPrincipal(items, fn) {   // {v: "$1,234", extra: "y US$500"}
  const m = sumaMon(items, fn), ks = Object.keys(m).sort();
  if (!ks.length) return { v: '$0', extra: '' };
  const p = ks.indexOf('MXN') >= 0 ? 'MXN' : ks[0];
  const otros = ks.filter(k => k !== p && Math.round(m[k]) !== 0).map(k => dineroC(m[k], k));
  return { v: dineroC(m[p], p), extra: otros.length ? 'y ' + otros.join(' y ') : '' };
}

function toast(msg, tipo) {
  const el = document.createElement('div');
  el.className = 'toast' + (tipo === 'error' ? ' error' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), tipo === 'error' ? 7000 : 3800);
}
function copiar(texto) {
  const ok = () => toast('Copiado: ' + texto);
  const viejo = () => { const t = document.createElement('textarea'); t.value = texto; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Copia a mano: ' + texto, 'error'); } t.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok, viejo); else viejo();
}

/* ─── Modales y panel lateral ──────────────────────────────────────────── */
function abrirModal(o) {
  cerrarModal();
  const velo = document.createElement('div');
  velo.className = 'velo centro';
  velo.innerHTML = '<div class="modal ' + (o.ancho ? 'ancho' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(o.titulo) + '"><div class="modal-cab"><h2>' + esc(o.titulo) + '</h2>' +
    (o.fijo ? '' : '<button class="cerrar" aria-label="Cerrar">×</button>') + '</div><div class="modal-cuerpo">' + o.cuerpo + '</div><div class="modal-pie">' + (o.pie || '') + '</div></div>';
  if (!o.fijo) {
    velo.addEventListener('mousedown', e => { if (e.target === velo) cerrarModal(); });
    $('.cerrar', velo).addEventListener('click', cerrarModal);
  }
  $('#modal-root').appendChild(velo);
  const foco = $('textarea, input:not([type=checkbox]), .btn.principal', velo); if (foco && !o.sinFoco) foco.focus();
  return velo;
}
function cerrarModal() { $('#modal-root').innerHTML = ''; }

function abrirLateral(titulo, sub) {
  cerrarLateral();
  const velo = document.createElement('div');
  velo.className = 'velo lado-der';
  velo.innerHTML = '<aside class="lateral" role="dialog" aria-modal="true" aria-label="' + esc(titulo) + '"><div class="lateral-cab"><div><h2>' + esc(titulo) + '</h2><p>' + esc(sub || '') + '</p></div><button class="cerrar" aria-label="Cerrar">×</button></div>' +
    '<div class="lateral-cuerpo"><div class="cargando"><span class="giro"></span>Cargando…</div></div><div class="lateral-pie oculto"></div></aside>';
  velo.addEventListener('mousedown', e => { if (e.target === velo) cerrarLateral(); });
  $('.cerrar', velo).addEventListener('click', cerrarLateral);
  $('#lateral-root').appendChild(velo);
  return velo;
}
function cerrarLateral() { $('#lateral-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal-root').firstChild) cerrarModal(); else cerrarLateral(); } });

/* ─── Arranque y navegación ────────────────────────────────────────────── */
const VISTAS = ['hoy', 'reportes', 'avisos', 'hoja', 'cartera', 'historial', 'ajustes', 'datos', 'config'];
const RENDER = {
  hoy: () => pintarHoy(), reportes: () => cargarReportes(), avisos: () => pintarAvisos(), hoja: () => cargarHoja(),
  cartera: () => cargarCartera(), historial: () => cargarHistorial(), ajustes: () => cargarAjustes(), datos: () => cargarDatos(), config: () => cargarConfig()
};

async function arrancar() {
  if (S.arrancado) return; S.arrancado = true;
  $('#v-hoy').innerHTML = '<div class="cargando"><span class="giro"></span>Cargando…</div>';
  const e = await api('getEstadoInicial');
  if (!e.ok) { $('#v-hoy').innerHTML = '<div class="panel"><div class="vacio"><b>No se pudo abrir la plataforma</b>' + esc(e.error) + '</div></div>'; return; }
  S.estado = e;
  $('#yo-correo').textContent = e.usuario.email;
  $('#yo-inicial').textContent = (e.usuario.email || '?').charAt(0).toUpperCase();
  $('#yo-rol').textContent = ({ ADMIN: 'Administración', COORDINADORA: 'Coordinación', GERENTE: 'Gerencia', AUDITORIA: 'Consulta', SIN_ACCESO: 'Sin acceso' })[e.usuario.rol] || e.usuario.rol;
  pintarBanners(); pintarCtx();
  if (e.inicializado && e.cortes.rep1.cargado && e.cortes.rep9.cargado) await cargarCola(true);
  api('getResumenInicio').then(r => { S.resumen = r; if (S.vista === 'hoy') pintarHoy(); });
  irA('hoy');
}

function pintarCtx() {
  const e = S.estado; if (!e) return;
  const t = e.tanda;
  $('#ctx-fecha').textContent = dLargaAnio(t.hoy);
  $('#ctx-tanda').textContent = t.esHabil ? 'Esta tanda cubre vencimientos del ' + dma(t.ventana.nominalDesde) + ' al ' + dma(t.ventana.nominalHasta) : 'Hoy es ' + t.motivoInhabil.toLowerCase() + ': no sale ningún aviso';
  $('#ctx-reportes').innerHTML = ['rep1', 'rep9'].map(tp => {
    const c = e.cortes[tp], st = estadoReporte(tp);
    const txt = st === 'falta' ? 'sin cargar' : (st === 'vencido' ? 'vencido, ' : '') + cuandoTxt(c.fechaHora);
    return '<button class="ctx-rep" data-ctx-rep title="Ir a Reportes">' + ico(st === 'ok' ? 'ok' : st === 'vencido' ? 'warn' : 'vacio') + '<b>' + REP[tp].n + '</b><span>' + esc(txt) + '</span></button>';
  }).join('');
  $$('[data-ctx-rep]').forEach(b => b.addEventListener('click', () => irA('reportes')));
}

function pintarBanners() {
  const e = S.estado, b = [];
  if (!e.inicializado) b.push('<div class="banner error">' + ico('error') + '<span>Falta preparar el libro Maestro. En Apps Script ejecuta <b>inicializarV2</b> una vez y recarga esta página.</span></div>');
  if (e.modoPrueba) b.push('<div class="banner prueba"><span>Modo prueba: los correos llegan a un buzón interno y no cuentan como avisos reales.' + (e.fechaSimulada ? ' Fecha simulada: ' + dLargaAnio(e.fechaSimulada) + '.' : '') + '</span></div>');
  if (e.usuario.rol === 'SIN_ACCESO') b.push('<div class="banner error"><span>Tu cuenta (' + esc(e.usuario.email) + ') no está en la hoja Usuarios. Pide acceso al administrador.</span></div>');
  else if (e.usuario.abierto) b.push('<div class="banner">' + ico('warn') + '<span>La hoja Usuarios está vacía, así que todas las cuentas del dominio son administradoras. Agrega usuarios con su rol para limitar el acceso.</span></div>');
  if (e.usuario.rol === 'AUDITORIA') b.push('<div class="banner"><span>Tienes acceso de solo consulta.</span></div>');
  $('#banners').innerHTML = b.join('');
}

function irA(v) {
  S.vista = v; S.busqueda = '';
  cerrarLateral();
  $$('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.nav === v ? 'page' : 'false'));
  VISTAS.forEach(id => $('#v-' + id).classList.toggle('oculto', id !== v));
  window.scrollTo(0, 0);
  RENDER[v]();
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('button[data-nav]'); if (b) irA(b.dataset.nav); });

async function refrescarEstado() {
  const e = await api('getEstadoInicial');
  if (e.ok) { S.estado = e; pintarBanners(); pintarCtx(); }
}

function contadores() {
  const set = (id, n) => { const el = $('#' + id); el.textContent = n; el.classList.toggle('oculto', !(n > 0)); };
  set('cuenta-avisos', S.cola && S.cola.ok ? S.cola.stats.porEnviar : 0);
  set('cuenta-ajustes', S.ajustes && S.ajustes.ok ? S.ajustes.ajustes.filter(a => a.estado === 'PENDIENTE').length : 0);
  const a = S.datos && S.datos.ok ? S.datos.auditoria : null;
  set('cuenta-datos', a && a.cartera ? a.sinCorreo.length + a.sinStp.length + a.correoInvalido.length : 0);
}

function grupos() {
  const it = S.cola && S.cola.ok ? S.cola.items : [];
  return {
    listos: it.filter(i => i.estado === 'LISTA'),
    revisar: it.filter(i => i.estado === 'REVISAR'),
    bloqueadas: it.filter(i => i.estado === 'BLOQUEADA'),
    luego: it.filter(i => i.estado === 'PROGRAMADA' || i.estado === 'ESPERA_VISPERA'),
    atendidas: it.filter(i => i.estado === 'COMPLETA' || i.estado === 'VENCE_HOY' || i.estado === 'VENCIDA')
  };
}
function estadoReporte(t) { const c = S.estado.cortes[t]; if (!c || !c.cargado) return 'falta'; return c.ok === false ? 'vencido' : 'ok'; }

async function cargarCola(silencioso) {
  const c = await api('getCola');
  S.cola = c;
  if (!c.ok && !silencioso) toast(c.error, 'error');
  contadores();
  if (S.vista === 'avisos') pintarAvisos();
  if (S.vista === 'hoy') pintarHoy();
}

/* ═══════════════════════ HOY ═══════════════════════════════════════════════ */
function textoHeroe() {
  const e = S.estado, t = e.tanda, v = t.ventana;
  const r1 = estadoReporte('rep1'), r9 = estadoReporte('rep9');
  if (!t.esHabil) return { h: 'Hoy es ' + t.motivoInhabil.toLowerCase() + '. No sale ningún aviso.', s: 'La siguiente tanda empieza el ' + dLarga(t.d0) + '.' };
  const rango = 'vencimientos del ' + dma(v.nominalDesde) + ' al ' + dma(v.nominalHasta);
  if (r1 === 'ok' && r9 === 'ok' && S.cola && S.cola.ok) {
    const g = grupos(), n = g.listos.length, aten = g.revisar.length + g.bloqueadas.length;
    if (n > 0) {
      const a1 = g.listos.filter(i => i.accion === 'PREVENTIVO').length, a2 = n - a1;
      const partes = [a1 ? pl(a1, 'primer aviso', 'primeros avisos') : '', a2 ? pl(a2, 'segundo aviso', 'segundos avisos') : ''].filter(Boolean).join(' y ');
      return { h: n === 1 ? 'Hay 1 aviso listo para enviar.' : 'Hay ' + n + ' avisos listos para enviar.', s: partes + ', por ' + montosTxt(g.listos) + '.' + (aten ? ' Otros ' + aten + ' necesitan tu revisión antes.' : '') };
    }
    if (aten > 0) return { h: aten === 1 ? 'Hay 1 aviso que necesita tu atención.' : 'Hay ' + aten + ' avisos que necesitan tu atención.', s: 'Completa lo que falta y podrás enviarlos.' };
    const prox = S.cola.items.map(i => i.programadaPara).filter(Boolean).sort()[0];
    return { h: 'Hoy no hay avisos por enviar.', s: prox ? 'El siguiente aviso sale el ' + dLarga(prox) + '.' : 'No hay cuotas pendientes de aviso con los reportes cargados.' };
  }
  if (r1 === 'falta' && r9 === 'falta') return { h: 'Hoy toca descargar el Rep1 y el Rep9.', s: 'Rep1 con ' + rango + '. Rep9 con corte de hoy. Súbelos en las dos tarjetas de abajo y la plataforma calcula los avisos.' };
  if (r1 === 'vencido' || r9 === 'vencido') return { h: 'Los reportes ya no están al día.', s: 'Descarga unos nuevos: Rep1 con ' + rango + ' y Rep9 con corte de hoy.' };
  return { h: r1 === 'falta' ? 'Falta subir el Rep1.' : 'Falta subir el Rep9.', s: r1 === 'falta' ? 'Descárgalo con ' + rango + '.' : 'Descárgalo con corte de hoy.' };
}

function avisoHoyTxt(t) {
  if (!t.esHabil) return '';
  const a2 = t.linea.find(d => d.aviso2), a1 = t.linea.find(d => d.aviso1), p = [];
  if (a2) p.push('el segundo aviso a quienes pagan el ' + dLarga(a2.fecha));
  if (a1) p.push('el primero a quienes pagan el ' + dLarga(a1.fecha));
  return p.length ? '<p class="nota" style="margin-top:12px;font-size:14.5px;color:var(--g700)">Hoy sale ' + p.join(' y ') + '.</p>' : '';
}

function reglaHTML(t) {
  let prevMes = -1;
  const celdas = t.linea.map(d => {
    const m = Number(d.fecha.slice(5, 7)) - 1, mes = m !== prevMes ? MES[m] : ''; prevMes = m;
    let marca = '';
    if (d.esHoy) marca = '<span class="marca-dia">Hoy</span>';
    else if (d.aviso1) marca = '<span class="marca-dia a1">1.er aviso</span>';
    else if (d.aviso2) marca = '<span class="marca-dia">2.º aviso</span>';
    const pie = !d.habil ? '<span class="etq" title="' + esc(d.motivo) + '">' + esc(d.motivo) + '</span>' : (d.idx > 0 ? '<span class="etq">día ' + d.idx + '</span>' : '<span class="etq"></span>');
    return '<div class="dia ' + (d.habil ? '' : 'inhabil ') + (d.enRep1 ? 'cubre ' : '') + (d.esHoy ? 'hoy' : '') + '">' + marca + '<span class="dow">' + DOW[d.dow] + '</span><span class="dnum">' + Number(d.fecha.slice(8)) + '</span><span class="mes">' + mes + '</span>' + pie + '</div>';
  }).join('');
  return '<div class="regla" style="--n:' + t.linea.length + '" role="img" aria-label="Próximos días hábiles">' + celdas + '</div>' +
    '<div class="leyenda"><span><i class="h"></i>Hoy</span><span><i></i>Vencimientos que cubre el Rep1 de esta tanda</span><span><i class="raya"></i>Fin de semana o inhábil: no cuenta</span></div>' +
    '<p class="nota" style="margin-top:6px">Un pago que cae en día inhábil se avisa y se cobra el siguiente día hábil.</p>';
}

function kpisHoyHTML() {
  if (!(S.cola && S.cola.ok)) return '';
  const it = S.cola.items, hoyList = it.filter(i => i.accion), g = grupos();
  const tot = montoPrincipal(it, i => i.total), cap = montoPrincipal(it, i => i.desglose.capVencido), mor = montoPrincipal(it, i => i.desglose.moratoriosAcum + i.desglose.moratoriosProy);
  const conVenc = it.filter(i => i.desglose.capVencido > 0.005).length;
  return '<div class="kpis">' +
    '<div class="kpi dest"><div class="t">Por cobrar en la tanda</div><div class="v">' + tot.v + '</div><div class="m">' + pl(it.length, 'cuota', 'cuotas') + (tot.extra ? ', ' + esc(tot.extra) : '') + '</div></div>' +
    '<div class="kpi"><div class="t">Capital vencido incluido</div><div class="v ' + (conVenc ? 'rojo' : '') + '">' + cap.v + '</div><div class="m">' + pl(conVenc, 'cliente', 'clientes') + ' con atraso' + (cap.extra ? ', ' + esc(cap.extra) : '') + '</div></div>' +
    '<div class="kpi"><div class="t">Moratorios incluidos</div><div class="v">' + mor.v + '</div><div class="m">Acumulados más los del periodo</div></div>' +
    '<div class="kpi"><div class="t">Avisos por enviar hoy</div><div class="v">' + hoyList.length + '</div><div class="m">' + (g.revisar.length + g.bloqueadas.length ? pl(g.revisar.length + g.bloqueadas.length, 'necesita atención', 'necesitan atención') : 'Ninguno con observaciones') + '</div></div></div>';
}

function pendientesHTML() {
  if (!(S.cola && S.cola.ok)) return '';
  const g = grupos(), lista = g.bloqueadas.concat(g.revisar);
  const cab = '<div class="panel-cab"><div><h3>Necesita tu atención</h3><p>' + (lista.length ? pl(lista.length, 'aviso', 'avisos') + ' con un dato faltante u observación' : 'Nada pendiente por ahora') + '</p></div>' + (lista.length ? '<button class="btn chico" data-ir="avisos">Ver en Avisos</button>' : '') + '</div>';
  if (!lista.length) return '<div class="panel">' + cab + '<div class="vacio" style="padding:30px"><b>Todo en orden</b>Los avisos de hoy no tienen observaciones.</div></div>';
  return '<div class="panel">' + cab + '<div class="tabla-wrap" style="border:0;border-radius:0"><table class="tabla"><tbody>' + lista.slice(0, 6).map(i =>
    '<tr class="clic" data-cuota="' + esc(i.key) + '"><td>' + (i.estado === 'BLOQUEADA' ? ico('error') : ico('warn')) + '</td><td><div class="quien"><b>' + esc(i.cliente) + '</b><small>Línea ' + esc(i.linea) + '</small></div></td><td class="motivo">' + esc(motivos(i)[0] || '') + '</td></tr>').join('') +
    '</tbody></table></div>' + (lista.length > 6 ? '<div class="panel-cuerpo nota">Y ' + (lista.length - 6) + ' más en Avisos.</div>' : '') + '</div>';
}

function carteraResumenHTML() {
  const R = S.resumen && S.resumen.ok && S.resumen.hayRep9 ? S.resumen : null;
  const cab = '<div class="panel-cab"><div><h3>Cartera</h3><p>Según el Rep9 cargado</p></div><button class="btn chico" data-ir="cartera">Ver cartera</button></div>';
  if (!R) return '<div class="panel">' + cab + '<div class="vacio" style="padding:30px">Sube el Rep9 para ver la cartera.</div></div>';
  const monedas = Object.keys(R.cartera).sort();
  return '<div class="panel">' + cab + '<div class="panel-cuerpo"><div class="cc-datos">' + monedas.map(m =>

function enlazarCargas(raiz) {

    input.addEventListener('change', () => { if (input.files.length) procesarArchivo(tp, input.files[0]); input.value = ''; });
  });
  $$('[data-guardar-carga]', raiz).forEach(b => b.addEventListener('click', () => guardarCarga(b.dataset.guardarCarga)));

function norm(s) { return String(s === null || s === undefined ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
function detectarTipo(rows) {
  for (let i = 0; i < Math.min(10, rows.length); i++) {
    const c = (rows[i] || []).map(norm);
    if (c.some(x => x.indexOf('fecha vencimiento') >= 0)) return 'rep1';
    if (c.indexOf('linea de credito') >= 0 && c.some(x => x.indexOf('saldo total') >= 0)) return 'rep9';
  }
  return null;
}

function parseXlsx(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: true });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false });
        const iso = (y, m, d) => y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0') + 'T12:00:00';
        resolve(rows.map(row => row.map(cell => {
          if (cell instanceof Date) { const c = new Date(cell.getTime() + 12 * 3600 * 1000); return iso(c.getFullYear(), c.getMonth() + 1, c.getDate()); }
          if (typeof cell === 'string') {
            const m = cell.trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
            if (m) { let y = parseInt(m[3], 10); if (y < 100) y += 2000; return iso(y, parseInt(m[1], 10), parseInt(m[2], 10)); }   // el reporte trae mes/día/año
          }
          return cell;
        })));
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('No se pudo leer el archivo.'));
    reader.readAsArrayBuffer(file);
  });
}

async function procesarArchivo(tp, file) {
  const it = { id: ++S.cargaSeq, archivo: file.name, estado: 'leyendo' };
  S.carga[tp] = it; repintarCargas();
  try {
    if (!/\.(xlsx|xls)$/i.test(file.name)) throw new Error('Usa un archivo de Excel (.xlsx o .xls).');
    const rows = await parseXlsx(file);
    const detectado = detectarTipo(rows);
    if (!detectado) throw new Error('No reconozco este archivo. El Rep1 debe tener la columna "Fecha Vencimiento" y el Rep9 las columnas "Línea de crédito" y "*SALDO TOTAL".');
    if (detectado !== tp) {
      it.estado = 'error'; it.rows = rows; it.otroTipo = detectado;
      it.error = 'Este archivo parece ser el ' + REP[detectado].n + ', no el ' + REP[tp].n + '.';
      repintarCargas(); return;
    }
    await procesarFilas(tp, file.name, rows);
  } catch (err) { it.estado = 'error'; it.error = err.message || String(err); repintarCargas(); }
}

async function procesarFilas(tp, archivo, rows) {
  const it = { id: ++S.cargaSeq, archivo: archivo, rows: rows, estado: 'validando' };
  S.carga[tp] = it; repintarCargas();
  const val = await api('validarReporte', tp, rows, { archivo: archivo });
  if (!val.ok) { it.estado = 'error'; it.error = val.error; it.detalles = (val.mismatches || []).slice(0, 5); repintarCargas(); return; }
  it.val = val;
  if ((val.avisos || []).some(a => a.nivel === 'warn')) { it.estado = 'revisar'; repintarCargas(); }
  else await guardarCarga(tp);
}

async function guardarCarga(tp) {
  const it = S.carga[tp]; if (!it) return;
  it.estado = 'guardando'; repintarCargas();
  const meta = { archivo: it.archivo };
  if (tp === 'rep1' && it.val.requerido) { meta.rangoDesde = it.val.requerido.desde; meta.rangoHasta = it.val.requerido.hasta; }
  const r = await api('guardarReporte', tp, it.rows, meta);
  if (!r.ok) { it.estado = 'error'; it.error = r.error; repintarCargas(); return; }
  S.carga[tp] = null;
  toast(REP[tp].n + ' guardado: ' + pl(r.filas, REP[tp].unidad[0], REP[tp].unidad[1]) + '.');
  await terminarCarga();
}

async function terminarCarga() {
  await refrescarEstado();
  S.excl.clear(); S.cartera = null; S.hoja = null; S.saldosV = null; S.cortes = null; S.datos = null;
  if (S.estado.cortes.rep1.cargado && S.estado.cortes.rep9.cargado) await cargarCola(true);
  api('getResumenInicio').then(r => { S.resumen = r; if (S.vista === 'hoy') pintarHoy(); });
  if (S.vista === 'hoy') pintarHoy(); else if (S.vista === 'reportes') cargarReportes(); else if (S.vista === 'hoja') cargarHoja(); else repintarCargas();
}

async function verReporte(tp) {
  const velo = abrirModal({ titulo: REP[tp].n + ' cargado', ancho: true, sinFoco: true, cuerpo: '<div class="cargando"><span class="giro"></span>Leyendo el reporte…</div>', pie: '' });
  const r = await api('getReporteCargado', tp);
  const cuerpo = $('.modal-cuerpo', velo);
  if (!r.ok) { cuerpo.innerHTML = '<div class="vacio"><b>No se pudo abrir</b>' + esc(r.error) + '</div>'; return; }
  const esFecha = v => /^\d{4}-\d{2}-\d{2}/.test(String(v));
  const fmt = (v, c) => { if (v === '' || v === null) return ''; if (esFecha(v)) return dma(String(v).slice(0, 10)); if (typeof v === 'number') { const dinero = tp === 'rep1' ? (c >= 3 && c <= 7) : (c >= 6 && c <= 28 && c !== 2); return dinero ? n2(v) : String(v); } return esc(v); };
  const pintar = q => {
    const t = (q || '').toLowerCase();
    const filas = r.filas.filter(f => !t || f.join(' ').toLowerCase().indexOf(t) >= 0);
    $('#rep-cuerpo', cuerpo).innerHTML = filas.slice(0, 400).map(f => '<tr>' + f.map((v, c) => '<td class="' + (typeof v === 'number' ? 'der' : '') + '" style="white-space:nowrap">' + fmt(v, c) + '</td>').join('') + '</tr>').join('') || '<tr><td colspan="' + r.encabezados.length + '"><div class="vacio">Sin coincidencias.</div></td></tr>';
    $('#rep-cuenta', cuerpo).textContent = filas.length > 400 ? 'Mostrando 400 de ' + filas.length + '. Usa la búsqueda o descarga el archivo.' : pl(filas.length, 'fila', 'filas');
  };
  cuerpo.innerHTML = '<div class="herramientas"><div><b>' + esc(r.corte.archivo || REP[tp].n) + '</b><div class="nota">Cargado ' + esc(cuandoTxt(r.corte.fechaHora)) + ' por ' + esc((r.corte.usuario || '').split('@')[0]) + '. <span id="rep-cuenta"></span></div></div>' +
    '<div style="display:flex;gap:8px"><input class="buscar" id="rep-buscar" type="search" placeholder="Buscar en el reporte"><button class="btn" id="rep-xls">' + icoI('descarga') + 'Descargar Excel</button></div></div>' +
    '<div class="tabla-wrap" style="max-height:60vh"><table class="tabla"><thead><tr>' + r.encabezados.map(h => '<th style="white-space:nowrap">' + esc(h) + '</th>').join('') + '</tr></thead><tbody id="rep-cuerpo"></tbody></table></div>';
  pintar('');
  $('#rep-buscar', cuerpo).addEventListener('input', ev => pintar(ev.target.value));
  $('#rep-xls', cuerpo).addEventListener('click', () => descargarExcel(REP[tp].n + '_cargado_' + S.estado.tanda.hoy + '.xlsx', [{ nombre: REP[tp].n, filas: [r.encabezados].concat(r.filas.map(f => f.map(v => esFecha(v) ? dma(String(v).slice(0, 10)) : v))) }]));
}

function descargarExcel(nombre, hojas) {
  try {
    const wb = XLSX.utils.book_new();
    hojas.forEach(h => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(h.filas), h.nombre));
    XLSX.writeFile(wb, nombre);
    toast('Archivo descargado: ' + nombre);
  } catch (e) { toast('No se pudo generar el archivo: ' + e.message, 'error'); }
}

  MONEDA_DISTINTA: 'El Rep1 y el Rep9 traen monedas distintas.',
  AJUSTE_PENDIENTE: 'Hay un ajuste de saldo esperando aprobación.'
};
function motivos(i) { return i.bloqueos.concat(i.alertas.filter(a => a.nivel === 'warn')).map(x => MOTIVO[x.codigo] || x.texto); }
function codigos(i) { return i.bloqueos.concat(i.alertas.filter(a => a.nivel === 'warn')).map(x => x.codigo); }
function coincide(i) { const q = S.busqueda.trim().toLowerCase(); return !q || (i.linea + ' ' + i.cliente).toLowerCase().indexOf(q) >= 0; }
function quienHTML(i) { return '<div class="quien"><b title="' + esc(i.cliente) + '">' + esc(i.cliente) + '</b><small>Línea ' + esc(i.linea) + '</small></div>'; }
function pagaHTML(i) { return '<div class="cuando">Paga ' + dCorta(i.fechaPago) + (i.fechaPago !== i.fechaNominal ? '<small>vence ' + dCorta(i.fechaNominal) + ', día inhábil</small>' : '') + '</div>'; }
function chipAviso(i) { return i.accion === 'PREVENTIVO' ? '<span class="chip suave">Primer aviso</span>' : i.accion === 'VISPERA' ? '<span class="chip amarillo">Segundo aviso</span>' : ''; }
function grupoCab(icono, titulo, cuantos, extra) { return '<div class="grupo-cab">' + ico(icono) + '<h3>' + titulo + '</h3><span class="cuantos">' + cuantos + '</span><span class="espacio"></span>' + (extra || '') + '</div>'; }
function vacioSinReportes(msg) { return '<div class="titulo-pag"><div><h2>Avisos de hoy</h2></div></div><div class="panel"><div class="vacio"><b>Todavía no hay avisos</b>' + esc(msg || 'Sube el Rep1 y el Rep9 para que la plataforma calcule los avisos de hoy.') + '<div style="margin-top:16px"><button class="btn principal" data-ir="reportes">Ir a subir los reportes</button></div></div></div>'; }

function pintarAvisos() {
  const raiz = $('#v-avisos');
  if (!S.estado) return;
  if (!S.cola) {
    if (S.estado.inicializado && S.estado.cortes.rep1.cargado && S.estado.cortes.rep9.cargado) { raiz.innerHTML = '<div class="cargando"><span class="giro"></span>Preparando los avisos…</div>'; cargarCola(true); }
    else { raiz.innerHTML = vacioSinReportes(); enlazarGeneral(raiz); }
    return;
  }
  if (!S.cola.ok) { raiz.innerHTML = vacioSinReportes(S.cola.error); enlazarGeneral(raiz); return; }
  const c = S.cola, g = grupos(), f = x => x.filter(coincide);
  const listos = f(g.listos), revisar = f(g.revisar), bloq = f(g.bloqueadas), luego = f(g.luego), atend = f(g.atendidas);
  const caducos = !c.frescura.rep1.ok || !c.frescura.rep9.ok;
  const selec = g.listos.filter(i => !S.excl.has(i.key));
  const puedeEnviar = can('enviar');

  let h = '<div class="titulo-pag"><div><h2>Avisos de hoy</h2><p class="lead">Calculados con el Rep1 de ' + esc(cuandoTxt(c.frescura.rep1.corte.fechaHora)) + ' y el Rep9 de ' + esc(cuandoTxt(c.frescura.rep9.corte.fechaHora)) + '. Toca una fila para ver cómo se construyó su monto.</p></div>' +
    '<div class="acciones-pag"><input class="buscar" type="search" placeholder="Buscar cliente o línea" value="' + esc(S.busqueda) + '" aria-label="Buscar"></div></div>';
  if (caducos) h += '<div class="banner" style="margin-bottom:6px">' + ico('warn') + '<span>Los reportes ya no están al día, por eso no se puede enviar nada.</span><button class="btn chico" data-ir="reportes">Subir reportes</button></div>';

  h += '<div class="grupo" style="margin-top:6px">' + grupoCab('listo', 'Listos para enviar', g.listos.length ? pl(g.listos.length, 'aviso', 'avisos') + ', ' + montosTxt(g.listos) : '0 avisos',
    g.listos.length && puedeEnviar ? '<button class="btn texto chico" data-todos="' + (selec.length === g.listos.length ? 'no' : 'si') + '">' + (selec.length === g.listos.length ? 'Quitar todos' : 'Seleccionar todos') + '</button>' : '');
  if (listos.length) {
    h += '<p class="grupo-nota">Ya están marcados. Quita la marca de los que no quieras enviar ahora y usa el botón de abajo.</p><div class="tabla-wrap"><table class="tabla"><thead><tr><th class="col-tilde"></th><th>Cliente</th><th>Paga</th><th class="oculta-m">Aviso</th><th class="der">Total</th><th></th></tr></thead><tbody>' + listos.map(i =>
      '<tr class="clic" data-key="' + esc(i.key) + '"><td class="col-tilde"><input type="checkbox" class="tilde" data-sel ' + (S.excl.has(i.key) ? '' : 'checked') + (puedeEnviar ? '' : ' disabled') + ' aria-label="Incluir ' + esc(i.cliente) + ' en el envío"></td><td>' + quienHTML(i) + '</td><td>' + pagaHTML(i) + '</td><td class="oculta-m">' + chipAviso(i) + '</td><td class="der monto num">' + dinero(i.total, i.moneda) + '</td><td class="der">' + '<svg width="18" height="18" aria-hidden="true" style="color:var(--g400)"><use href="#g-der"/></svg>' + '</td></tr>').join('') + '</tbody></table></div>';
  } else h += '<div class="panel"><div class="vacio">' + (g.listos.length ? '<b>Sin resultados</b>Prueba con otro nombre o número de línea.' : '<b>No hay avisos listos por ahora</b>' + (g.revisar.length + g.bloqueadas.length ? 'Revisa los que necesitan atención.' : 'Cuando haya cuotas por avisar aparecerán aquí.')) + '</div></div>';
  h += '</div>';

  if (revisar.length) {
    h += '<div class="grupo">' + grupoCab('warn', 'Revisa antes de enviar', pl(revisar.length, 'aviso', 'avisos')) + '<p class="grupo-nota">Se pueden enviar, pero tienen una observación. Completa el dato o envíalos tal como están.</p><div class="tabla-wrap"><table class="tabla"><tbody>' +
      revisar.map(i => '<tr><td>' + quienHTML(i) + '</td><td class="motivo"><b>Paga ' + dCorta(i.fechaPago) + ', ' + dinero(i.total, i.moneda) + '.</b> ' + motivos(i).map(esc).join(' ') + '</td><td><div class="celda-acc">' +
        (codigos(i).some(k => k === 'SIN_TASA' || k === 'TASA_DUPLICADA' || k === 'CONTACTO_DUPLICADO') && can('catalogo') ? '<button class="btn chico" data-datos="' + esc(i.linea) + '">Completar datos</button>' : '') +
        '<button class="btn chico" data-ver="' + esc(i.key) + '">Ver cálculo</button>' + (puedeEnviar ? '<button class="btn chico principal" data-asi="' + esc(i.key) + '">Enviar así</button>' : '') + '</div></td></tr>').join('') + '</tbody></table></div></div>';
  }
  if (bloq.length) {
    h += '<div class="grupo">' + grupoCab('error', 'No se pueden enviar todavía', pl(bloq.length, 'aviso', 'avisos')) + '<p class="grupo-nota">Les falta algo indispensable. En cuanto lo completes pasan a la lista de arriba.</p><div class="tabla-wrap"><table class="tabla"><tbody>' +
      bloq.map(i => {
        const k = codigos(i);
        const boton = k.some(x => x === 'SIN_CORREO' || x === 'SIN_STP') ? '<button class="btn chico principal" data-datos="' + esc(i.linea) + '">Completar datos</button>'
          : k.some(x => x === 'REP1_VENCIDO' || x === 'REP9_VENCIDO') ? '<button class="btn chico principal" data-ir="reportes">Subir reportes</button>'
          : k.indexOf('AJUSTE_PENDIENTE') >= 0 ? '<button class="btn chico principal" data-ir="ajustes">Ver ajustes</button>' : '<button class="btn chico" data-ficha="' + esc(i.linea) + '">Ver cliente</button>';
        return '<tr><td>' + quienHTML(i) + '</td><td class="motivo"><b>Paga ' + dCorta(i.fechaPago) + '.</b> ' + motivos(i).map(esc).join(' ') + '</td><td><div class="celda-acc">' + boton + '</div></td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }
  const filaSimple = (i, col2) => '<tr class="clic" data-key="' + esc(i.key) + '"><td>' + quienHTML(i) + '</td><td><div class="cuando">' + col2 + '</div></td><td class="der monto num">' + dinero(i.total, i.moneda) + '</td><td class="der">' + '<svg width="18" height="18" aria-hidden="true" style="color:var(--g400)"><use href="#g-der"/></svg>' + '</td></tr>';
  if (luego.length) {
    h += '<details class="plegable"><summary>' + ico('reloj') + '<h3>Más adelante</h3><span class="cuantos">' + pl(luego.length, 'aviso', 'avisos') + '</span><span class="mas">Ver ' + ico('abajo') + '</span></summary><div class="tabla-wrap"><table class="tabla"><tbody>' +
      luego.map(i => filaSimple(i, (i.estado === 'ESPERA_VISPERA' ? 'Segundo aviso el ' : 'Primer aviso el ') + dCorta(i.programadaPara) + '<small>Paga ' + dCorta(i.fechaPago) + '</small>')).join('') + '</tbody></table></div></details>';
  }
  if (atend.length) {
    h += '<details class="plegable"><summary>' + ico('ok') + '<h3>Ya atendidos</h3><span class="cuantos">' + pl(atend.length, 'aviso', 'avisos') + '</span><span class="mas">Ver ' + ico('abajo') + '</span></summary><div class="tabla-wrap"><table class="tabla"><tbody>' +
      atend.map(i => filaSimple(i, ({ COMPLETA: 'Avisos enviados', VENCE_HOY: 'Vence hoy', VENCIDA: 'Ya venció' })[i.estado] + '<small>Pago ' + dCorta(i.fechaPago) + (i.nota ? ', ' + esc(i.nota) : '') + '</small>')).join('') + '</tbody></table></div></details>';
  }
  if (selec.length && puedeEnviar) {
    h += '<div class="barra-envio"><div class="resumen-envio">' + pl(selec.length, 'aviso seleccionado', 'avisos seleccionados') + '<small>' + esc(montosTxt(selec)) + '</small></div>' +
      '<button class="btn principal grande" data-enviar-sel>' + icoI('enviar') + 'Enviar ' + pl(selec.length, 'aviso', 'avisos') + '</button></div>';
  }
  raiz.innerHTML = h;
  enlazarAvisos(raiz, selec);
  contadores();
}

function enlazarAvisos(raiz, selec) {
  enlazarGeneral(raiz);
  const buscar = $('.buscar', raiz);
  if (buscar) buscar.addEventListener('input', () => { S.busqueda = buscar.value; const p = buscar.selectionStart; pintarAvisos(); const n = $('.buscar', $('#v-avisos')); n.focus(); n.setSelectionRange(p, p); });
  $$('tr.clic', raiz).forEach(fila => fila.addEventListener('click', ev => { if (ev.target.closest('.col-tilde')) return; abrirCuota(fila.dataset.key); }));
  $$('[data-sel]', raiz).forEach(ch => ch.addEventListener('change', () => { const k = ch.closest('tr').dataset.key; ch.checked ? S.excl.delete(k) : S.excl.add(k); pintarAvisos(); }));
  const t = $('[data-todos]', raiz);
  if (t) t.addEventListener('click', () => { const g = grupos().listos; if (t.dataset.todos === 'si') S.excl.clear(); else g.forEach(i => S.excl.add(i.key)); pintarAvisos(); });
  $$('[data-ficha]', raiz).forEach(b => b.addEventListener('click', () => abrirCliente(b.dataset.ficha)));
  $$('[data-datos]', raiz).forEach(b => b.addEventListener('click', () => abrirCliente(b.dataset.datos, 'datos')));
  $$('[data-ver]', raiz).forEach(b => b.addEventListener('click', () => abrirCuota(b.dataset.ver)));
  $$('[data-asi]', raiz).forEach(b => b.addEventListener('click', () => confirmarEnvio([b.dataset.asi])));
  const en = $('[data-enviar-sel]', raiz); if (en) en.addEventListener('click', () => confirmarEnvio(selec.map(i => i.key)));
}

/* ─── La cinta: cómo se construyó un monto, con su fuente ──────────────── */
function cintaHTML(i) {
  const t = i.traza, d = i.desglose, m = i.moneda;
  let k = 0;
  const lin = (op, nom, fuente, formula, imp, o) => {
    o = o || {};
    return '<div class="cinta-lin ' + (o.cero ? 'cero ' : '') + (o.sub ? 'sub' : '') + '" style="--i:' + (k++) + '"><span class="op">' + op + '</span><span class="txt"><span class="nom">' + nom + '</span>' +
      (fuente ? '<span class="fuente ' + (o.cal ? 'cal' : '') + '">' + fuente + '</span>' : '') + (formula ? '<span class="formula">' + formula + '</span>' : '') + '</span><span class="pts"></span><span class="imp num">' + n2(imp) + '</span></div>';
  };
  const sec = txt => '<div class="cinta-sec">' + txt + '</div>';
  let h = '<div class="cinta-enc"><b>Línea ' + esc(i.linea) + '</b><span>Vence el ' + dLarga(i.fechaNominal) + (i.fechaPago !== i.fechaNominal ? ' y se cobra el ' + dLarga(i.fechaPago) : '') + '</span></div>';

  h += sec('Cuota del Rep1') +
    lin('', 'Capital', 'Rep1 col. D', '', t.rep1.capital) + lin('+', 'Interés', 'Rep1 col. E', '', t.rep1.intereses) + lin('+', 'Otros', 'Rep1 col. F', '', t.rep1.otros) + lin('+', 'IVA', 'Rep1 col. G', '', t.rep1.iva) +
    lin('=', 'Cuota', 'D + E + F + G', (Math.abs(d.cuota - t.rep1.importe) <= 0.01 ? 'Coincide con el Importe del Rep1 (col. H).' : '<b style="color:var(--ladrillo)">No coincide con el Importe del Rep1 (col. H): ' + n2(t.rep1.importe) + '.</b>'), d.cuota, { sub: true });

  h += sec('Saldo vencido de la línea en el Rep9');
  if (!t.rep9) h += lin('', 'La línea no aparece en el Rep9', '', 'No se pudo sumar saldo vencido.', 0, { cero: true });
  else if (!t.aplicaVencido) h += lin('', 'Ya va en la primera cuota de esta línea', '', 'El saldo vencido se cobra una sola vez.', 0, { cero: true });
  else {
    const r = t.rep9;
    h += lin('+', 'Capital vencido', 'Rep9 col. K', '', d.capVencido, { cero: !d.capVencido }) +
      lin('+', 'Intereses vencidos con IVA', 'Rep9 col. P y Q', 'P ' + n2(r.intVencido) + ' + Q ' + n2(r.ivaIntVencido), d.intVencidos, { cero: !d.intVencidos }) +
      lin('+', 'Moratorios acumulados con IVA', 'Rep9 col. R, S, T y U', 'R ' + n2(r.moratorios) + ' + S ' + n2(r.ivaMoratorios) + ' + T ' + n2(r.morCont) + ' + U ' + n2(r.ivaMorCont), d.moratoriosAcum, { cero: !d.moratoriosAcum });
  }

  let formula = '';
  if (d.moratoriosProy > 0) formula = n2(d.capVencido) + ' × ' + pct(i.tasaMoratoria) + ' ÷ ' + t.baseDias + ' × ' + i.diasProy + (i.diasProy === 1 ? ' día' : ' días');
  else if (!t.aplicaVencido || d.capVencido <= 0) formula = 'No hay capital vencido, así que no se proyectan moratorios.';
  else if (!t.tasaEnCatalogo) formula = 'Falta la tasa del cliente en el catálogo, por eso queda en cero.';
  else if (t.diasCrudos <= 0) formula = 'El vencimiento no es posterior al corte del Rep9: no hay días que proyectar.';
  h += sec('Moratorios del periodo') + lin('+', 'Moratorios proyectados', 'calculado', formula, d.moratoriosProy, { cal: true, cero: !d.moratoriosProy });

  if (i.ajustes && i.ajustes.length) {
    h += sec('Ajustes de saldo') + i.ajustes.map(a => lin('+', esc(({ PAGO_APLICADO: 'Pago que llegó', DISPOSICION: 'Disposición', CORRECCION: 'Corrección' })[a.tipo] || a.tipo), 'registrado en la plataforma', esc(a.motivo), a.monto)).join('');
  }
  h += '<div class="cinta-total" style="--i:' + (k++) + '"><span class="nom">Total a pagar</span><span class="imp num">' + dinero(d.total, m).replace(/^(-?)([^0-9-]+)/, '$1$2') + '<small>' + m + '</small></span></div>';

  let nota = '';
  if (d.capVencido > 0 && t.aplicaVencido) {
    nota = '<b>Tasa moratoria</b> = tasa del contrato ' + (t.tasaEnCatalogo ? pct(t.tasaContrato) : '(sin registrar)') + ' × ' + t.factor + ' = ' + pct(i.tasaMoratoria) + '. <b>Días</b> = del corte del Rep9 (' + dma(t.corte9) + ') al ' + (t.base === 'EFECTIVA' ? 'día de pago' : 'vencimiento original') + ' (' + dma(t.fechaBase) + ').';
  }
  return '<div class="cinta-fondo"><div class="cinta">' + h + '</div></div>' + (nota ? '<p class="cinta-nota">' + nota + '</p>' : '') +
    '<p class="cinta-nota">Este es el monto que lleva el correo del aviso.</p>';
}

/* ─── Panel de un aviso ────────────────────────────────────────────────── */
async function abrirCuota(key) {
  if (!S.cola || !S.cola.ok) await cargarCola(true);
  const i = S.cola && S.cola.ok ? S.cola.items.find(x => x.key === key) : null;
  if (!i) { toast('Esa cuota ya no está en los reportes cargados.', 'error'); return; }
  const velo = abrirLateral(i.cliente, 'Línea ' + i.linea);
  const cuerpo = $('.lateral-cuerpo', velo), pie = $('.lateral-pie', velo);
  const estadoTxt = { LISTA: 'Lista para enviar', REVISAR: 'Se puede enviar, con observaciones', BLOQUEADA: 'No se puede enviar todavía', PROGRAMADA: 'Su primer aviso sale el ' + (i.programadaPara ? dLarga(i.programadaPara) : ''), ESPERA_VISPERA: 'Su segundo aviso sale el ' + (i.programadaPara ? dLarga(i.programadaPara) : ''), COMPLETA: 'Sus avisos ya salieron', VENCE_HOY: 'Vence hoy', VENCIDA: 'Ya venció' }[i.estado];
  const hist = [];
  if (i.previo) hist.push('Primer aviso enviado el ' + dCorta(i.previo.fechaKey) + ' por ' + dinero(i.previo.total, i.moneda) + '.');
  if (i.vispera) hist.push('Segundo aviso enviado el ' + dCorta(i.vispera.fechaKey) + '.');
  if (i.reenvios) hist.push(pl(i.reenvios, 'reenvío', 'reenvíos') + '.');
  if (i.nota) hist.push(i.nota);
  const avs = i.bloqueos.map(b => ico('error') + '<span>' + esc(MOTIVO[b.codigo] || b.texto) + '</span>')
    .concat(i.alertas.filter(a => a.nivel === 'warn').map(a => ico('warn') + '<span>' + esc(MOTIVO[a.codigo] || a.texto) + '</span>'))
    .concat(i.alertas.filter(a => a.nivel !== 'warn').map(a => ico('info') + '<span>' + esc(a.texto) + '</span>'))
    .concat(hist.map(x => ico('info') + '<span>' + esc(x) + '</span>'));
  cuerpo.innerHTML =
    '<div class="bloque"><div class="grande-num num">' + dinero(i.total, i.moneda) + '<small>' + i.moneda + '</small></div><p style="margin-top:8px">Paga el <b>' + dLarga(i.fechaPago) + '</b>.</p><p style="margin-top:8px">' + chipAviso(i) + ' <span style="color:var(--g600);font-size:14px">' + esc(estadoTxt) + '</span></p></div>' +
    (avs.length ? '<div class="bloque"><h3>Qué hay que saber</h3><ul class="avisos-lista">' + avs.map(x => '<li>' + x + '</li>').join('') + '</ul></div>' : '') +
    '<div class="bloque"><h3>Cómo se construyó este monto</h3>' + cintaHTML(i) + '</div>' +
    '<div class="bloque"><h3>Correo</h3><div id="ap-correo"><button class="btn" data-ver-correo>' + icoI('ojo') + 'Ver el correo tal como llegará</button></div></div>';
  const puedeEnviar = can('enviar') && i.accion && i.estado !== 'BLOQUEADA';
  pie.classList.remove('oculto');
  pie.innerHTML = '<button class="btn" data-cliente>Ver cliente</button><button class="btn" data-hoja>Ver en la hoja de trabajo</button>' + (can('ajustar') ? '<button class="btn" data-ajustar>Ajustar saldo</button>' : '') +
    (can('enviar') && (i.previo || i.vispera) && i.bloqueos.length === 0 && i.diasHabiles >= 0 ? '<button class="btn" data-reenviar>Reenviar</button>' : '') + (puedeEnviar ? '<button class="btn principal" data-enviar>' + icoI('enviar') + 'Enviar ahora</button>' : '');
  $('[data-cliente]', pie).addEventListener('click', () => abrirCliente(i.linea));
  $('[data-hoja]', pie).addEventListener('click', () => { S.resaltar = i.key; S.hojaTab = 'hoja'; S.hojaBusqueda = i.linea; irA('hoja'); });
  const aj = $('[data-ajustar]', pie); if (aj) aj.addEventListener('click', () => { irA('ajustes'); setTimeout(() => { const l = $('#aj-linea'); if (l) { l.value = i.linea; l.dispatchEvent(new Event('input')); $('#aj-venc').value = i.fechaNominal; $('#aj-monto').focus(); } }, 500); });
  const re = $('[data-reenviar]', pie); if (re) re.addEventListener('click', () => abrirReenvio(i.key));
  const en = $('[data-enviar]', pie); if (en) en.addEventListener('click', () => confirmarEnvio([i.key]));
  $('[data-ver-correo]', cuerpo).addEventListener('click', async () => {
    const dest = $('#ap-correo', cuerpo); dest.innerHTML = '<div class="cargando" style="padding:24px"><span class="giro"></span>Armando el correo…</div>';
    const p = await api('previsualizarAviso', key);
    if (!p.ok) { dest.innerHTML = '<p>' + esc(p.error) + '</p>'; return; }
    dest.innerHTML = '<dl class="meta-correo"><dt>Asunto</dt><dd>' + esc(p.asunto) + '</dd><dt>Para</dt><dd>' + esc((p.para || []).join(', ') || 'Sin correo registrado') + '</dd>' + (p.cc ? '<dt>Con copia</dt><dd>' + esc(p.cc) + '</dd>' : '') +
      '<dt>Responder a</dt><dd>' + esc(p.responderA) + '</dd>' + (p.pruebaDestino ? '<dt>Modo prueba</dt><dd>Llegará a ' + esc(p.pruebaDestino) + ', no al cliente.</dd>' : '') + '</dl><iframe class="marco-correo" sandbox title="Vista previa del correo"></iframe>';
    $('.marco-correo', dest).srcdoc = p.html;
  });
}

/* ─── Envío ────────────────────────────────────────────────────────────── */
function confirmarEnvio(keys) {
  const items = keys.map(k => S.cola.items.find(i => i.key === k)).filter(Boolean);
  if (!items.length) return;
  const rev = items.filter(i => i.estado === 'REVISAR');
  const a1 = items.filter(i => i.accion === 'PREVENTIVO').length, a2 = items.filter(i => i.accion === 'VISPERA').length;
  const partes = [a1 ? pl(a1, 'primer aviso', 'primeros avisos') : '', a2 ? pl(a2, 'segundo aviso', 'segundos avisos') : ''].filter(Boolean).join(' y ');
  const velo = abrirModal({
    titulo: items.length === 1 ? 'Enviar este aviso' : 'Enviar ' + items.length + ' avisos',
    cuerpo: '<p>' + partes + ', por <b class="num">' + esc(montosTxt(items)) + '</b>.</p>' +
      '<p style="margin-top:8px;color:var(--g600)">' + (S.estado.modoPrueba ? 'Estás en modo prueba: los correos llegan a un buzón interno, no a los clientes.' : 'Los correos saldrán a los clientes y a la copia fija configurada.') + '</p>' +
      (rev.length ? '<div class="banner" style="margin:14px 0 0">' + ico('warn') + '<span>' + (rev.length === 1 ? 'Este aviso tiene una observación: ' : rev.length + ' avisos tienen observaciones: ') + esc(motivos(rev[0]).join(' ')) + (rev.length > 1 ? ' Y otras similares.' : '') + ' Se enviarán así.</span></div>' : '') +
      '<ul class="resumen-lista">' + items.slice(0, 8).map(i => '<li><span>' + esc(i.cliente) + '</span><span class="num">' + dinero(i.total, i.moneda) + '</span></li>').join('') + (items.length > 8 ? '<li><span>y ' + (items.length - 8) + ' más</span><span></span></li>' : '') + '</ul>',
    pie: '<button class="btn" data-cerrar>Cancelar</button><button class="btn principal grande" data-ir-envio>' + icoI('enviar') + 'Enviar ' + (items.length === 1 ? 'aviso' : items.length + ' avisos') + '</button>'
  });
  $('[data-cerrar]', velo).addEventListener('click', cerrarModal);
  $('[data-ir-envio]', velo).addEventListener('click', () => enviarLote(keys, rev.length > 0));
}

async function enviarLote(keys, confirmarRevision) {
  const TAM = 12, total = keys.length;
  const velo = abrirModal({ titulo: 'Enviando avisos', fijo: true, cuerpo: '<p id="env-txt">Preparando…</p><div class="progreso"><i id="env-barra" style="width:0%"></i></div>', pie: '' });
  const acum = { enviados: 0, errores: 0, omitidos: 0, resultados: [], pendientes: [] };
  let fallo = '';
  for (let i = 0; i < keys.length; i += TAM) {
    const bloque = keys.slice(i, i + TAM);
    $('#env-txt', velo).textContent = 'Enviando ' + Math.min(i + TAM, total) + ' de ' + total + '…';
    const r = await api('enviarAvisos', bloque, { confirmarRevision: confirmarRevision });
    if (!r.ok) { fallo = r.error; acum.pendientes = acum.pendientes.concat(keys.slice(i)); break; }
    acum.enviados += r.enviados; acum.errores += r.errores; acum.omitidos += r.omitidos;
    acum.resultados = acum.resultados.concat(r.resultados); acum.pendientes = acum.pendientes.concat(r.pendientes || []);
    if (r.pendientes && r.pendientes.length) { acum.pendientes = acum.pendientes.concat(keys.slice(i + TAM)); break; }
    $('#env-barra', velo).style.width = (Math.min(i + TAM, total) / total * 100) + '%';
  }
  cerrarLateral();
  if (S.estado.chatConfigurado && acum.enviados + acum.errores > 0) { const g = grupos(); api('resumenEnChat', acum, g.revisar.length + g.bloqueadas.length); }
  await cargarCola(true);
  api('getResumenInicio').then(r => { S.resumen = r; });
  const problemas = acum.resultados.filter(x => !x.ok);
  const v2 = abrirModal({
    titulo: acum.errores || fallo || acum.pendientes.length ? 'Se enviaron algunos avisos' : 'Avisos enviados',
    cuerpo: '<div class="conteos"><div><b class="num">' + acum.enviados + '</b><span>enviados</span></div>' + (acum.errores ? '<div><b class="num" style="color:var(--ladrillo)">' + acum.errores + '</b><span>con error</span></div>' : '') + (acum.omitidos ? '<div><b class="num">' + acum.omitidos + '</b><span>omitidos</span></div>' : '') + (acum.pendientes.length ? '<div><b class="num">' + acum.pendientes.length + '</b><span>sin enviar</span></div>' : '') + '</div>' +
      (fallo ? '<p style="margin-top:12px;color:var(--ladrillo)">' + esc(fallo) + '</p>' : '') +
      (acum.pendientes.length && !fallo ? '<p style="margin-top:12px">Se acabó el tiempo o la cuota diaria de Google. Vuelve a enviar: lo que ya salió no se repite.</p>' : '') +
      (problemas.length ? '<ul class="resumen-lista">' + problemas.map(x => '<li><span><b>' + esc(x.cliente || x.key) + '</b></span><span style="text-align:right">' + esc(x.error) + '</span></li>').join('') + '</ul>' : ''),
    pie: '<button class="btn" data-historial>Ver en el historial</button><button class="btn principal" data-cerrar>Listo</button>'
  });
  $('[data-cerrar]', v2).addEventListener('click', cerrarModal);
  $('[data-historial]', v2).addEventListener('click', () => { cerrarModal(); irA('historial'); });
}

function abrirReenvio(key) {
  const i = S.cola.items.find(x => x.key === key);
  const velo = abrirModal({
    titulo: 'Reenviar aviso',
    cuerpo: '<p>Se vuelve a mandar el aviso de <b>' + esc(i.cliente) + '</b> con el monto de hoy (' + dinero(i.total, i.moneda) + '). No cambia el calendario de avisos.</p><div class="campo" style="margin-top:14px"><label for="motivo-re">¿Por qué lo reenvías?</label><textarea id="motivo-re" placeholder="Por ejemplo: el cliente pidió el correo otra vez o cambió su dirección."></textarea></div>',
    pie: '<button class="btn" data-cerrar>Cancelar</button><button class="btn principal" data-ir-envio>Reenviar</button>'
  });
  $('[data-cerrar]', velo).addEventListener('click', cerrarModal);
  $('[data-ir-envio]', velo).addEventListener('click', async () => {
    const motivo = $('#motivo-re', velo).value.trim();
    if (motivo.length < 5) { toast('Cuéntanos en pocas palabras por qué lo reenvías.', 'error'); return; }
    $('[data-ir-envio]', velo).disabled = true;
    const r = await api('reenviarAviso', key, motivo);
    cerrarModal();
    if (r.ok && r.enviados === 1) toast('Aviso reenviado.'); else toast((r.resultados && r.resultados[0] && r.resultados[0].error) || r.error || 'No se pudo reenviar.', 'error');
    cargarCola(true);
  });
}

/* ═══════════════════════ HOJA DE TRABAJO ═══════════════════════════════════ */
/* Réplica de la hoja de cálculo de la v1: una fila por cuota del Rep1, con las
   columnas calculadas a partir del Rep9. Tocar una fila abre "la cinta". */
const HOJA_COLS = [
  ['A', 'Vencimiento', f => dma(f.fechaNominal), 's1', false],
  ['B', 'Línea', f => esc(f.linea), 's2', false],
  ['C', 'Cliente', f => esc(f.cliente), 's3', false],
  ['D', 'Capital', f => n2(f.capital), 'm', false, 'capital'],
  ['E', 'Intereses', f => n2(f.intereses), 'm', false, 'intereses'],
  ['F', 'Otros', f => n2(f.otros), 'm', false, 'otros'],
  ['G', 'IVA', f => n2(f.iva), 'm', false, 'iva'],
  ['H', 'Importe del Rep1', f => n2(f.importeRep1), 'm', false, 'importeRep1'],
  ['I', 'Moneda', f => f.moneda, 'c', false],
  ['J', 'Capital vencido', f => n2(f.capVencido), 'm', true, 'capVencido'],
  ['K', 'Intereses vencidos', f => n2(f.intVencidos), 'm', true, 'intVencidos'],
  ['L', 'Moratorios acumulados', f => n2(f.sumaMoratorios), 'm', true, 'sumaMoratorios'],
  ['M', 'Moratorios del periodo', f => n2(f.moratoriosPeriodo), 'm', true, 'moratoriosPeriodo'],
  ['N', 'Días', f => String(f.dias), 'c', true],
  ['O', 'Tasa moratoria', f => f.tasaMoratoria ? pct(f.tasaMoratoria) : '—', 'c', true],
  ['P', 'Ajustes', f => n2(f.ajustes), 'm', false, 'ajustes'],
  ['Q', 'Total a pagar', f => n2(f.total), 'm', true, 'total']
];
const SALDOS_COLS = [
  ['Línea', f => esc(f.linea), 's', false], ['Cliente', f => esc(f.cliente), 's', false], ['Moneda', f => f.moneda, 'c', false],
  ['Capital vigente', f => n2(f.capVigente), 'm', false, 'capVigente'], ['Capital vencido', f => n2(f.capVencido), 'm', false, 'capVencido'],
  ['Interés vencido', f => n2(f.intVencido), 'm', false, 'intVencido'], ['IVA interés vencido', f => n2(f.ivaIntVencido), 'm', false, 'ivaIntVencido'],
  ['Moratorios', f => n2(f.moratorios), 'm', false, 'moratorios'], ['IVA moratorios', f => n2(f.ivaMoratorios), 'm', false, 'ivaMoratorios'],
  ['Moratorios contingentes', f => n2(f.morCont), 'm', false, 'morCont'], ['IVA mor. contingentes', f => n2(f.ivaMorCont), 'm', false, 'ivaMorCont'],
  ['Intereses vencidos con IVA', f => n2(f.interesesVencidos), 'm', true, 'interesesVencidos'], ['Moratorios con IVA', f => n2(f.sumaMoratorios), 'm', true, 'sumaMoratorios'],
  ['Saldo vencido', f => n2(f.saldoVencido), 'm', false, 'saldoVencido'], ['Saldo total', f => n2(f.saldoTotal), 'm', false, 'saldoTotal']
];

async function cargarHoja() {
  const raiz = $('#v-hoja');
  if (!(S.estado.cortes.rep1.cargado && S.estado.cortes.rep9.cargado)) { raiz.innerHTML = '<div class="titulo-pag"><div><h2>Hoja de trabajo</h2></div></div><div class="panel"><div class="vacio"><b>Falta cargar los reportes</b>La hoja se arma con el Rep1 y el Rep9.<div style="margin-top:16px"><button class="btn principal" data-ir="reportes">Ir a Reportes</button></div></div></div>'; enlazarGeneral(raiz); return; }
  if (S.hojaTab === 'saldos') {
    if (!S.saldosV) { raiz.innerHTML = '<div class="cargando"><span class="giro"></span>Armando la hoja…</div>'; S.saldosV = await api('getSaldosVencidos'); }
  } else if (!S.hoja) { raiz.innerHTML = '<div class="cargando"><span class="giro"></span>Armando la hoja…</div>'; S.hoja = await api('getHojaTrabajo'); }
  pintarHoja();
}

function sumaCol(filas, k) { return Math.round(filas.reduce((a, f) => a + (Number(f[k]) || 0), 0) * 100) / 100; }

function pintarHoja() {
  const raiz = $('#v-hoja'), tab = S.hojaTab;
  const cab = '<div class="titulo-pag"><div><h2>Hoja de trabajo</h2><p class="lead">Aquí se ve cómo se construye cada monto: la cuota sale del Rep1, el saldo vencido del Rep9 y las columnas amarillas se calculan. Toca una fila para ver su cinta paso a paso.</p></div></div>' +
    '<div class="pestanas" role="tablist">' + [['hoja', 'Cuotas del Rep1'], ['saldos', 'Saldos vencidos del Rep9'], ['formulas', 'Cómo se calcula']].map(t => '<button role="tab" aria-selected="' + (tab === t[0]) + '" data-tab="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>';
  let cuerpo = '';
  if (tab === 'hoja') cuerpo = hojaCuotasHTML();
  else if (tab === 'saldos') cuerpo = hojaSaldosHTML();
  else cuerpo = hojaFormulasHTML();
  raiz.innerHTML = cab + cuerpo;
  $$('[data-tab]', raiz).forEach(b => b.addEventListener('click', () => { S.hojaTab = b.dataset.tab; S.hojaBusqueda = ''; S.hojaFiltro = 'todos'; cargarHoja(); }));
  enlazarGeneral(raiz);
  const buscar = $('.buscar', raiz);
  if (buscar) buscar.addEventListener('input', () => { S.hojaBusqueda = buscar.value; const p = buscar.selectionStart; pintarHoja(); const n = $('.buscar', $('#v-hoja')); n.focus(); n.setSelectionRange(p, p); });
  $$('[data-hf]', raiz).forEach(b => b.addEventListener('click', () => { S.hojaFiltro = b.dataset.hf; pintarHoja(); }));
  $$('[data-hm]', raiz).forEach(b => b.addEventListener('click', () => { S.hojaMoneda = b.dataset.hm; pintarHoja(); }));
  $$('tr[data-key]', raiz).forEach(f => f.addEventListener('click', () => abrirCuota(f.dataset.key)));
  $$('tr[data-linea]', raiz).forEach(f => f.addEventListener('click', () => abrirCliente(f.dataset.linea)));
  const xl = $('[data-xls]', raiz); if (xl) xl.addEventListener('click', exportarHoja);
  const r = $('tr.resaltada', raiz); if (r) { r.scrollIntoView({ block: 'center' }); S.resaltar = null; }
}

function monedaActiva(monedas) {
  if (monedas.length <= 1) return monedas[0] || '';
  return monedas.indexOf(S.hojaMoneda) >= 0 ? S.hojaMoneda : (monedas.indexOf('MXN') >= 0 ? 'MXN' : monedas[0]);
}
function pildorasMoneda(monedas, activa) {
  if (monedas.length <= 1) return '';
  return '<div class="pildoras">' + monedas.map(m => '<button aria-pressed="' + (m === activa) + '" data-hm="' + m + '">' + m + '</button>').join('') + '</div>';
}

function hojaCuotasHTML() {
  const h = S.hoja;
  if (!h || !h.ok) return '<div class="panel"><div class="vacio"><b>No se pudo armar la hoja</b>' + esc(h && h.error) + '</div></div>';
  const monedas = Object.keys(h.totales).sort(), mon = monedaActiva(monedas), q = S.hojaBusqueda.trim().toLowerCase();
  const base = h.filas.filter(f => f.moneda === mon && (!q || (f.linea + ' ' + f.cliente).toLowerCase().indexOf(q) >= 0));
  const F = {
    todos: ['Todas', () => true], venc: ['Con saldo vencido', f => f.capVencido > 0.005 || f.intVencidos > 0.005 || f.sumaMoratorios > 0.005],
    mor: ['Con moratorios del periodo', f => f.moratoriosPeriodo > 0.005], obs: ['Con observaciones', f => f.estado === 'REVISAR' || f.estado === 'BLOQUEADA' || !f.cuadra]
  };
  if (!F[S.hojaFiltro]) S.hojaFiltro = 'todos';
  const filas = base.filter(F[S.hojaFiltro][1]);
  const tot = {}; HOJA_COLS.forEach(c => { if (c[5]) tot[c[5]] = sumaCol(filas, c[5]); });
  const encabezado = '<thead><tr class="letras"><th class="s0"></th>' + HOJA_COLS.map((c, i) => '<th class="' + (c[3].charAt(0) === 's' ? c[3] : '') + '">' + c[0] + '</th>').join('') + '</tr>' +
    '<tr class="titulos"><th class="s0"></th>' + HOJA_COLS.map(c => '<th class="' + (c[4] ? 'calc ' : '') + (c[3].charAt(0) === 's' ? c[3] : '') + '">' + c[1] + '</th>').join('') + '</tr></thead>';
  const MAX = 600;
  const cuerpo = filas.slice(0, MAX).map((f, n) => '<tr class="clic ' + (S.resaltar === f.key ? 'resaltada' : '') + '" data-key="' + esc(f.key) + '"><td class="rn s0">' + (n + 1) + '</td>' +
    HOJA_COLS.map(c => {
      const cls = (c[3].charAt(0) === 's' ? c[3] + ' ' : '') + (c[3] === 'm' ? 'der num ' : c[3] === 'c' ? 'centro ' : '') + (c[0] === 'Q' ? 'total ' : '') + (c[3] === 'm' && c[5] && !f[c[5]] ? 'cero ' : '');
      return '<td class="' + cls + '">' + c[2](f) + '</td>';
    }).join('') + '</tr>').join('');
  const pie = '<tfoot><tr><td class="s0"></td><td class="s1">Total</td><td class="s2"></td><td class="s3">' + pl(filas.length, 'cuota', 'cuotas') + ' en ' + mon + '</td>' +
    HOJA_COLS.slice(3).map(c => '<td class="' + (c[3] === 'm' ? 'der num' : '') + '">' + (c[5] ? n2(tot[c[5]]) : '') + '</td>').join('') + '</tr></tfoot>';
  const cuadre = h.filas.filter(f => !f.cuadra).length;
  return '<div class="herramientas"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">' + pildorasMoneda(monedas, mon) +
    '<div class="pildoras">' + Object.keys(F).map(k => '<button aria-pressed="' + (S.hojaFiltro === k) + '" data-hf="' + k + '">' + F[k][0] + '<b>' + base.filter(F[k][1]).length + '</b></button>').join('') + '</div></div>' +
    '<div style="display:flex;gap:8px"><input class="buscar" type="search" placeholder="Buscar cliente o línea" value="' + esc(S.hojaBusqueda) + '" aria-label="Buscar"><button class="btn" data-xls>' + icoI('descarga') + 'Descargar Excel</button></div></div>' +
    '<p class="nota" style="margin:-4px 0 10px">Rep1 del ' + esc(cuandoTxt(h.corte1.fechaHora)) + ' y Rep9 del ' + esc(cuandoTxt(h.corte9.fechaHora)) + '. Las columnas amarillas se calculan con el Rep9; la tasa moratoria es la del contrato por ' + h.factor + ', sobre ' + h.baseDias + ' días, hasta el ' + (h.base === 'EFECTIVA' ? 'día de pago' : 'vencimiento original') + '.' + (cuadre ? ' <b style="color:var(--ladrillo)">' + pl(cuadre, 'cuota no coincide', 'cuotas no coinciden') + ' con el Importe del Rep1.</b>' : '') + '</p>' +
    '<div class="tabla-wrap hoja-wrap"><table class="tabla hoja">' + encabezado + '<tbody>' + (cuerpo || '<tr><td colspan="' + (HOJA_COLS.length + 1) + '"><div class="vacio">Sin resultados.</div></td></tr>') + '</tbody>' + (filas.length ? pie : '') + '</table></div>' +
    (filas.length > MAX ? '<p class="nota" style="margin-top:8px">Se muestran las primeras ' + MAX + ' filas. Usa la búsqueda o descarga el Excel completo.</p>' : '');
}

function pintarHistorial() {
  const raiz = $('#v-historial'), b = S.bitacora;
  if (!b || !b.ok) { raiz.innerHTML = '<div class="titulo-pag"><div><h2>Historial de envíos</h2></div></div><div class="panel"><div class="vacio"><b>No se pudo leer</b>' + esc(b && b.error) + '</div></div>'; return; }
  const f = S.filtroHist;
  let regs = b.registros;
  if (f.status) regs = regs.filter(r => r.status === f.status);
  if (f.texto) { const q = f.texto.toLowerCase(); regs = regs.filter(r => (r.linea + ' ' + r.cliente + ' ' + r.correos).toLowerCase().indexOf(q) >= 0); }
  const sts = [['', 'Todos'], ['ENVIADO', 'Enviados'], ['ENVIADO_PRUEBA', 'Pruebas'], ['ERROR', 'Con error'], ['OMITIDO', 'Omitidos']];
  const tipo = { PREVENTIVO: 'Primer aviso', VISPERA: 'Segundo aviso', REENVIO: 'Reenvío', 'T-5': 'Primer aviso', 'T-1': 'Segundo aviso', 'T+0': 'Segundo aviso' };
  const chip = s => ({ ENVIADO: '<span class="chip oscuro">Enviado</span>', ENVIADO_PRUEBA: '<span class="chip suave">Prueba</span>', ERROR: '<span class="chip rojo">Error</span>', OMITIDO: '<span class="chip">Omitido</span>' })[s] || '<span class="chip">' + esc(s) + '</span>';
  let h = '<div class="titulo-pag"><div><h2>Historial de envíos</h2><p class="lead">Cada intento queda registrado con el corte de los reportes que se usó. Se muestran los últimos ' + b.registros.length + ' movimientos.</p></div></div>' +
    '<div class="herramientas"><div class="pildoras">' + sts.map(s => '<button aria-pressed="' + (f.status === s[0]) + '" data-st="' + s[0] + '">' + s[1] + '</button>').join('') + '</div><input class="buscar" type="search" placeholder="Buscar cliente, línea o correo" value="' + esc(f.texto) + '" aria-label="Buscar"></div>';
  if (!regs.length) h += '<div class="panel"><div class="vacio"><b>Sin movimientos</b>Aquí aparecerán los envíos.</div></div>';
  let dia = '', abierto = false;
  const cierra = () => { if (abierto) h += '</tbody></table></div>'; };
  regs.forEach(r => {
    const d = fechaDe(r.timestamp);
    if (d !== dia) { cierra(); dia = d; abierto = true; h += '<p class="dia-cab">' + (d ? dLargaAnio(d) : 'Sin fecha') + '</p><div class="tabla-wrap"><table class="tabla"><tbody>'; }
    h += '<tr><td class="num" style="color:var(--g500);width:64px">' + horaDe(r.timestamp) + '</td><td>' + quienHTML({ cliente: r.cliente, linea: r.linea }) + '</td>' +
      '<td><div class="cuando">' + (tipo[r.tipo] || esc(r.tipo)) + '<small>Pago ' + (r.pagoEfectivo ? dCorta(r.pagoEfectivo) : (r.fechaVenc ? dCorta(r.fechaVenc) : '')) + '</small></div></td><td class="der monto num">' + dinero(r.total, r.moneda) + '</td>' +
      '<td><div class="cuando">' + chip(r.status) + '<small>' + esc(r.status === 'ENVIADO' || r.status === 'ENVIADO_PRUEBA' ? (r.usuario || '').split('@')[0] : r.mensaje) + '</small></div></td>' +
      '<td class="der">' + (r.status === 'ENVIADO' && can('enviar') ? '<button class="btn chico" data-reenv="' + esc(r.linea + '|' + r.fechaVenc) + '">Reenviar</button>' : '') + '</td></tr>';
  });

function controlParam(clave, valor, tipo, dis) {
  const d = dis ? ' disabled' : '';
  if (tipo === 'bool') return '<label class="conmutador"><input type="checkbox" data-clave="' + esc(clave) + '" data-bool ' + (String(valor).toUpperCase() === 'TRUE' ? 'checked' : '') + d + '><span></span></label>';
  if (tipo.indexOf('sel:') === 0) return '<select data-clave="' + esc(clave) + '"' + d + '>' + tipo.slice(4).split(',').map(o => '<option ' + (o === valor ? 'selected' : '') + '>' + o + '</option>').join('') + '</select>';
  return '<input data-clave="' + esc(clave) + '" value="' + esc(valor) + '"' + (tipo === 'num' ? ' inputmode="decimal" style="max-width:140px"' : '') + d + '>';
}

function pintarConfig() {
  const raiz = $('#v-config'), c = S.config;
  if (!c || !c.ok) { raiz.innerHTML = '<div class="titulo-pag"><div><h2>Configuración</h2></div></div><div class="panel"><div class="vacio"><b>No se pudo leer</b>' + esc(c && c.error) + '</div></div>'; return; }
  const admin = c.puedeConfig, val = {}; c.params.forEach(p => val[p.clave] = p.valor);
  const usadas = new Set();
  const panel = (t, n, cuerpo) => '<div class="panel"><div class="panel-cab"><div><h3>' + t + '</h3>' + (n ? '<p>' + n + '</p>' : '') + '</div></div><div class="panel-cuerpo">' + cuerpo + '</div></div>';

  CONFIG_GRUPOS.forEach(gr => {
    let cu = '';

      cu += '<div class="ajuste-param"><label>Conexión con Chat<small>' + (c.chatConfigurado ? 'Conectado.' : 'Todavía no está conectado.') + ' El enlace (webhook) se guarda en las propiedades del script, no en la hoja ni en el código.</small></label><div class="control" style="gap:8px;flex-wrap:wrap">' +
        (admin ? '<input id="cfg-hook" type="password" placeholder="https://chat.googleapis.com/v1/spaces/…" autocomplete="off" style="max-width:280px"><button class="btn chico principal" id="cfg-guardar-hook">Guardar</button><button class="btn chico" id="cfg-probar">Enviar mensaje de prueba</button>' : '') + '</div></div>' +
        '<div class="ajuste-param"><label>Recordatorios programados<small>' + (c.triggers.length ? 'Activos: ' + esc(c.triggers.join(', ')) + '.' : 'No hay ninguno instalado.') + '</small></label><div class="control">' + (admin ? '<button class="btn chico" id="cfg-triggers">Instalar o reinstalar</button>' : '') + '</div></div>';
    }

    if (gr.prueba && admin && String(val.MODO_PRUEBA).toUpperCase() === 'TRUE')
      cu += '<div class="ajuste-param"><label>Fecha simulada<small>Para ensayar un día distinto de hoy. Solo funciona en modo prueba. Vacío usa la fecha real.</small></label><div class="control" style="gap:8px"><input type="date" id="cfg-fecha" value="' + esc(S.estado.fechaSimulada || '') + '" style="max-width:180px"><button class="btn chico" id="cfg-fecha-g">Aplicar</button></div></div>';
    h += panel(gr.t, gr.n, cu);
  });
  h += panel('Días inhábiles', 'Sábados y domingos nunca cuentan. 2026 coincide con el calendario publicado por la CNBV; los años siguientes se calculan por regla y conviene validarlos cuando la CNBV publique el suyo.',

  const resto = c.params.filter(p => !usadas.has(p.clave));

  raiz.innerHTML = h;

    const q = id => $(id, raiz);
    if (q('#cfg-guardar-hook')) {
      q('#cfg-guardar-hook').addEventListener('click', async () => { const r = await api('guardarWebhookChat', q('#cfg-hook').value); if (!r.ok) toast(r.error, 'error'); else { toast(r.configurado ? 'Chat conectado.' : 'Chat desconectado.'); S.estado.chatConfigurado = r.configurado; cargarConfig(); } });
      q('#cfg-probar').addEventListener('click', async () => { const r = await api('probarChat'); toast(r.ok ? 'Mensaje enviado al espacio.' : (r.error || 'No se pudo enviar.'), r.ok ? undefined : 'error'); });

    }
    $$('[data-clave]', raiz).forEach(inp => inp.addEventListener('change', async () => {
      const valor = inp.dataset.bool !== undefined ? (inp.checked ? 'TRUE' : 'FALSE') : inp.value;
      const r = await api('setConfig', inp.dataset.clave, valor);
      if (!r.ok) { toast(r.error, 'error'); cargarConfig(); return; }
      toast('Guardado.'); S.hoja = null; await refrescarEstado(); if (inp.dataset.clave === 'MODO_PRUEBA') cargarConfig(); if (S.cola) cargarCola(true);
    }));
    if (q('#cfg-fecha-g')) q('#cfg-fecha-g').addEventListener('click', async () => { const r = await api('setFechaSimulada', q('#cfg-fecha').value); if (!r.ok) toast(r.error, 'error'); else { toast('Fecha simulada aplicada.'); S.hoja = null; await refrescarEstado(); if (S.cola) cargarCola(true); } });

  }
