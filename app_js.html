<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   COBRANZA CUALLI · Front
   Hoy (día guiado) · Avisos · Cartera · Historial · Ajustes de saldo ·
   Datos de clientes · Configuración
   ═══════════════════════════════════════════════════════════════════════════ */

const S = {
  estado: null, cola: null, cartera: null, resumen: null, bitacora: null, ajustes: null, datos: null, config: null,
  vista: 'hoy', cargasLista: [], cargaSeq: 0, excl: new Set(), busqueda: '',
  filtroCartera: 'todos', mostrarCartera: 80, filtroHist: { status: '', texto: '' }, listaDatos: 'sinTasa'
};

const DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const DOW_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

/* ─── Utilidades ───────────────────────────────────────────────────────── */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const pl = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);
const can = p => !!(S.estado && S.estado.permisos && S.estado.permisos.indexOf(p) >= 0);
const ico = (id, cls) => '<svg class="' + (cls || '') + '" width="20" height="20" aria-hidden="true"><use href="#g-' + id + '"/></svg>';

function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(resolve => {
    google.script.run
      .withSuccessHandler(r => resolve(r))
      .withFailureHandler(e => resolve({ ok: false, error: (e && e.message) || String(e) }))[fn].apply(null, args);
  });
}

function pk(k) { const p = k.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
function dCorta(k) { const d = pk(k); return DOW[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MES[d.getUTCMonth()]; }
function dLarga(k) { const d = pk(k); return DOW_L[d.getUTCDay()] + ' ' + d.getUTCDate() + ' de ' + MES_L[d.getUTCMonth()]; }
function dLargaAnio(k) { return dLarga(k) + ' de ' + k.slice(0, 4); }
function dma(k) { return k ? k.slice(8, 10) + '/' + k.slice(5, 7) + '/' + k.slice(0, 4) : ''; }
function dinero(n, mon) {
  const v = Number(n) || 0, p = Math.abs(v).toFixed(2).split('.');
  return (v < 0 ? '-' : '') + (mon === 'USD' ? 'US$' : '$') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + p[1];
}
function dineroC(n, mon) {   // sin centavos, para resúmenes
  const v = Math.round(Number(n) || 0);
  return (v < 0 ? '-' : '') + (mon === 'USD' ? 'US$' : '$') + Math.abs(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function horaDe(ts) { const m = String(ts || '').match(/(\d{2}):(\d{2})/); return m ? m[1] + ':' + m[2] : ''; }
function fechaDe(ts) { const m = String(ts || '').match(/^(\d{4}-\d{2}-\d{2})/); return m ? m[1] : ''; }
function cuandoTxt(ts) {   // "hoy a las 11:00" / "mié 26 ago a las 11:00"
  const f = fechaDe(ts), h = horaDe(ts), hoy = S.estado && S.estado.tanda ? S.estado.tanda.hoy : '';
  return (f === hoy ? 'hoy' : (f ? dCorta(f) : '')) + (h ? ' a las ' + h : '');
}
function montosTxt(items) {
  const m = {}; items.forEach(i => { m[i.moneda] = (m[i.moneda] || 0) + i.total; });
  const t = Object.keys(m).sort().map(k => dineroC(m[k], k) + ' ' + k);
  return t.join(' y ');
}

function toast(msg, tipo) {
  const el = document.createElement('div');
  el.className = 'toast' + (tipo === 'error' ? ' error' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), tipo === 'error' ? 7000 : 3800);
}
function copiar(texto) {
  const ok = () => toast('Copiado: ' + texto);
  const viejo = () => { const t = document.createElement('textarea'); t.value = texto; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Copia a mano: ' + texto, 'error'); } t.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok, viejo); else viejo();
}

/* ─── Modales y panel lateral ──────────────────────────────────────────── */
function abrirModal(o) {
  cerrarModal();
  const velo = document.createElement('div');
  velo.className = 'velo centro';
  velo.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(o.titulo) + '"><div class="modal-cab"><h2>' + esc(o.titulo) + '</h2>' +
    (o.fijo ? '' : '<button class="cerrar" aria-label="Cerrar">×</button>') + '</div><div class="modal-cuerpo">' + o.cuerpo + '</div><div class="modal-pie">' + (o.pie || '') + '</div></div>';
  if (!o.fijo) {
    velo.addEventListener('mousedown', e => { if (e.target === velo) cerrarModal(); });
    $('.cerrar', velo).addEventListener('click', cerrarModal);
  }
  $('#modal-root').appendChild(velo);
  const foco = $('textarea, input, .btn.principal', velo); if (foco) foco.focus();
  return velo;
}
function cerrarModal() { $('#modal-root').innerHTML = ''; }

function abrirLateral(titulo, sub) {
  cerrarLateral();
  const velo = document.createElement('div');
  velo.className = 'velo lado';
  velo.innerHTML = '<aside class="lateral" role="dialog" aria-modal="true" aria-label="' + esc(titulo) + '"><div class="lateral-cab"><div><h2>' + esc(titulo) + '</h2><p>' + esc(sub || '') + '</p></div><button class="cerrar" aria-label="Cerrar">×</button></div>' +
    '<div class="lateral-cuerpo"><div class="cargando"><span class="giro"></span>Cargando…</div></div><div class="lateral-pie oculto"></div></aside>';
  velo.addEventListener('mousedown', e => { if (e.target === velo) cerrarLateral(); });
  $('.cerrar', velo).addEventListener('click', cerrarLateral);
  $('#lateral-root').appendChild(velo);
  return velo;
}
function cerrarLateral() { $('#lateral-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal-root').firstChild) cerrarModal(); else cerrarLateral(); } });

/* ─── Arranque y navegación ────────────────────────────────────────────── */
const VISTAS = ['hoy', 'avisos', 'cartera', 'historial', 'ajustes', 'datos', 'config'];

async function arrancar() {
  if (S.arrancado) return; S.arrancado = true;
  $('#v-hoy').innerHTML = '<div class="pagina"><div class="cargando"><span class="giro"></span>Cargando…</div></div>';
  const e = await api('getEstadoInicial');
  if (!e.ok) { $('#v-hoy').innerHTML = '<div class="pagina"><div class="vacio"><b>No se pudo abrir la plataforma</b>' + esc(e.error) + '</div></div>'; return; }
  S.estado = e;
  $('#yo-correo').textContent = e.usuario.email;
  $('#yo-rol').textContent = ({ ADMIN: 'Administración', COORDINADORA: 'Coordinación', GERENTE: 'Gerencia', AUDITORIA: 'Consulta', SIN_ACCESO: 'Sin acceso' })[e.usuario.rol] || e.usuario.rol;
  pintarBanners();
  if (e.inicializado && e.cortes.rep1.cargado && e.cortes.rep9.cargado) await cargarCola(true);
  api('getResumenInicio').then(r => { S.resumen = r; if (S.vista === 'hoy') pintarHoy(); });
  irA('hoy');
}

function pintarBanners() {
  const e = S.estado, b = [];
  if (!e.inicializado) b.push('<div class="banner error">' + ico('error') + '<span>Falta preparar el libro Maestro. En Apps Script ejecuta <b>inicializarV2</b> una vez y recarga esta página.</span></div>');
  if (e.modoPrueba) b.push('<div class="banner prueba"><span>Modo prueba: los correos llegan a un buzón interno y no cuentan como avisos reales.' + (e.fechaSimulada ? ' Fecha simulada: ' + dLargaAnio(e.fechaSimulada) + '.' : '') + '</span></div>');
  if (e.usuario.rol === 'SIN_ACCESO') b.push('<div class="banner error"><span>Tu cuenta (' + esc(e.usuario.email) + ') no está en la hoja Usuarios. Pide acceso al administrador.</span></div>');
  else if (e.usuario.abierto) b.push('<div class="banner">' + ico('warn') + '<span>La hoja Usuarios está vacía, así que todas las cuentas del dominio son administradoras. Agrega usuarios con su rol para limitar el acceso.</span></div>');
  if (e.usuario.rol === 'AUDITORIA') b.push('<div class="banner"><span>Tienes acceso de solo consulta.</span></div>');
  $('#banners').innerHTML = b.join('');
}

function irA(v) {
  S.vista = v; S.busqueda = '';
  cerrarLateral();
  $$('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.nav === v ? 'page' : 'false'));
  VISTAS.forEach(id => $('#v-' + id).classList.toggle('oculto', id !== v));
  window.scrollTo(0, 0);
  ({ hoy: pintarHoy, avisos: pintarAvisos, cartera: cargarCartera, historial: cargarHistorial, ajustes: cargarAjustes, datos: cargarDatos, config: cargarConfig })[v]();
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('button[data-nav]'); if (b) irA(b.dataset.nav); });

async function refrescarEstado() {
  const e = await api('getEstadoInicial');
  if (e.ok) { S.estado = e; pintarBanners(); }
}

function contadores() {
  const set = (id, n) => { const el = $('#' + id); el.textContent = n; el.classList.toggle('oculto', !(n > 0)); };
  set('cuenta-avisos', S.cola && S.cola.ok ? S.cola.stats.porEnviar : 0);
  set('cuenta-ajustes', S.ajustes && S.ajustes.ok ? S.ajustes.ajustes.filter(a => a.estado === 'PENDIENTE').length : 0);
  const a = S.datos && S.datos.ok ? S.datos.auditoria : null;
  set('cuenta-datos', a && a.cartera ? a.sinCorreo.length + a.sinStp.length + a.correoInvalido.length : 0);
}

function grupos() {   // cola agrupada con palabras de uso diario
  const it = S.cola && S.cola.ok ? S.cola.items : [];
  return {
    listos: it.filter(i => i.estado === 'LISTA'),
    revisar: it.filter(i => i.estado === 'REVISAR'),
    bloqueadas: it.filter(i => i.estado === 'BLOQUEADA'),
    luego: it.filter(i => i.estado === 'PROGRAMADA' || i.estado === 'ESPERA_VISPERA'),
    atendidas: it.filter(i => i.estado === 'COMPLETA' || i.estado === 'VENCE_HOY' || i.estado === 'VENCIDA')
  };
}
function estadoReporte(t) { const c = S.estado.cortes[t]; if (!c || !c.cargado) return 'falta'; return c.ok === false ? 'vencido' : 'ok'; }

async function cargarCola(silencioso) {
  const c = await api('getCola');
  S.cola = c;
  if (!c.ok && !silencioso) toast(c.error, 'error');
  contadores();
  if (S.vista === 'avisos') pintarAvisos();
  if (S.vista === 'hoy') pintarHoy();
}

/* ═══════════════════════ HOY ═══════════════════════════════════════════════ */
function textoHeroe() {
  const e = S.estado, t = e.tanda, v = t.ventana;
  const r1 = estadoReporte('rep1'), r9 = estadoReporte('rep9');
  if (!t.esHabil) return { h: 'Hoy es ' + t.motivoInhabil.toLowerCase() + '. No sale ningún aviso.', s: 'La siguiente tanda empieza el ' + dLarga(t.d0) + '.' };
  const rango = 'vencimientos del ' + dma(v.nominalDesde) + ' al ' + dma(v.nominalHasta);
  if (r1 === 'ok' && r9 === 'ok' && S.cola && S.cola.ok) {
    const g = grupos(), st = S.cola.stats, n = g.listos.length, aten = g.revisar.length + g.bloqueadas.length;
    if (n > 0) {
      const a1 = g.listos.filter(i => i.accion === 'PREVENTIVO').length, a2 = n - a1;
      const partes = [a1 ? pl(a1, 'primer aviso', 'primeros avisos') : '', a2 ? pl(a2, 'segundo aviso', 'segundos avisos') : ''].filter(Boolean).join(' y ');
      return { h: n === 1 ? 'Tienes 1 aviso listo para enviar.' : 'Tienes ' + n + ' avisos listos para enviar.', s: partes + ', por ' + montosTxt(g.listos) + '.' + (aten ? ' Otros ' + aten + ' necesitan tu revisión antes.' : '') };
    }
    if (aten > 0) return { h: aten === 1 ? 'Hay 1 aviso que necesita tu atención.' : 'Hay ' + aten + ' avisos que necesitan tu atención.', s: 'Completa lo que falta y podrás enviarlos.' };
    const prox = S.cola.items.map(i => i.programadaPara).filter(Boolean).sort()[0];
    return { h: 'Hoy no hay avisos por enviar.', s: prox ? 'El siguiente aviso sale el ' + dLarga(prox) + '.' : 'No hay cuotas pendientes de aviso con los reportes cargados.' };
  }
  if (r1 === 'falta' && r9 === 'falta') return { h: 'Hoy toca descargar el Rep1 y el Rep9.', s: 'Rep1 con ' + rango + '. Rep9 con corte de hoy. Súbelos aquí abajo y la plataforma calcula los avisos.' };
  if (r1 === 'vencido' || r9 === 'vencido') return { h: 'Los reportes ya no están al día.', s: 'Descarga unos nuevos: Rep1 con ' + rango + ' y Rep9 con corte de hoy.' };
  return { h: r1 === 'falta' ? 'Falta subir el Rep1.' : 'Falta subir el Rep9.', s: r1 === 'falta' ? 'Descárgalo con ' + rango + '.' : 'Descárgalo con corte de hoy.' };
}

function avisoHoyTxt(t) {
  if (!t.esHabil) return '';
  const a2 = t.linea.find(d => d.aviso2), a1 = t.linea.find(d => d.aviso1);
  const p = [];
  if (a2) p.push('el segundo aviso a quienes pagan el ' + dLarga(a2.fecha));
  if (a1) p.push('el primero a quienes pagan el ' + dLarga(a1.fecha));
  return p.length ? '<p class="regla-hoy">Hoy sale ' + p.join(' y ') + '.</p>' : '';
}

function reglaHTML(t) {
  const cel = t.linea;
  const ini = cel.findIndex(d => d.enRep1), fin = cel.length - 1 - cel.slice().reverse().findIndex(d => d.enRep1);
  let prevMes = -1;
  const celdas = cel.map(d => {
    const m = Number(d.fecha.slice(5, 7)) - 1, mes = m !== prevMes ? MES[m] : ''; prevMes = m;
    let marca = '';
    if (d.esHoy) marca = '<span class="marca-dia">Hoy</span>';
    else if (d.aviso1) marca = '<span class="marca-dia a1">1.er aviso</span>';
    else if (d.aviso2) marca = '<span class="marca-dia">2.º aviso</span>';
    let pie = '';
    if (!d.habil) pie = '<span class="etq" title="' + esc(d.motivo) + '">' + esc(d.motivo) + '</span>';
    else if (d.idx > 0) pie = '<span class="etq">día ' + d.idx + '</span>';
    else pie = '<span class="etq"></span>';
    return '<div class="dia ' + (d.habil ? '' : 'inhabil ') + (d.esHoy ? 'hoy' : '') + '">' + marca + '<span class="dow">' + DOW[d.dow] + '</span><span class="dnum">' + Number(d.fecha.slice(8)) + '</span><span class="mes">' + mes + '</span>' + pie + '</div>';
  }).join('');
  const barra = cel.map((d, i) => '<i class="' + (d.enRep1 ? 'on ' : '') + (i === ini ? 'ini ' : '') + (i === fin ? 'fin' : '') + '"></i>').join('');
  return '<div class="regla" role="img" aria-label="Próximos días hábiles">' + celdas + '</div><div class="regla-barra" aria-hidden="true">' + barra + '</div>' +
    avisoHoyTxt(t) +
    '<div class="regla-pie"><span><i></i>Vencimientos que cubre el Rep1 de esta tanda</span><span><i class="raya"></i>Fin de semana o inhábil: no cuenta</span>' +
    '<span>Un pago que cae en día inhábil se avisa y se cobra el siguiente día hábil.</span></div>';
}

function tarjetaReporte(tipo) {
  const e = S.estado, c = e.cortes[tipo], v = e.tanda.ventana, st = estadoReporte(tipo), esR1 = tipo === 'rep1';
  const chip = st === 'ok' ? '<span class="chip oscuro">' + ico('ok') + 'Al día</span>' : st === 'vencido' ? '<span class="chip rojo">Vencido</span>' : '<span class="chip">Falta</span>';
  let det = '';
  if (st === 'falta') det = esR1 ? 'Todavía no has subido el Rep1.' : 'Todavía no has subido el Rep9.';
  else {
    det = 'Cargado ' + cuandoTxt(c.fechaHora) + (c.usuario ? ' por ' + esc(c.usuario.split('@')[0]) : '') + ', ' + pl(c.filas, esR1 ? 'cuota' : 'línea', esR1 ? 'cuotas' : 'líneas') + '.';
    if (st === 'vencido') det += ' Tiene ' + pl(c.edad, 'día hábil', 'días hábiles') + ' y el máximo es ' + c.max + '.';
  }
  const filtro = st === 'ok' ? '' : '<div class="filtro">' + (esR1
    ? 'Al descargarlo, filtra Fecha Vencimiento del <b>' + dma(v.nominalDesde) + '</b> <button class="copiar" data-copiar="' + dma(v.nominalDesde) + '">copiar</button> al <b>' + dma(v.nominalHasta) + '</b> <button class="copiar" data-copiar="' + dma(v.nominalHasta) + '">copiar</button>'
    : 'Al descargarlo, usa <b>corte de hoy</b> con todas las líneas, en pesos y en dólares.') + '</div>';
  return '<div class="reporte"><div class="reporte-cab"><div><h4>' + (esR1 ? 'Rep1' : 'Rep9') + '</h4><div class="detalle" style="margin-top:0">' + (esR1 ? 'Próximos vencimientos' : 'Saldos e intereses') + '</div></div>' + chip + '</div><p class="detalle">' + det + '</p>' + filtro + '</div>';
}

function cargasHTML() {
  return S.cargasLista.map(c => {
    const nombre = esc(c.archivo), tipoTxt = c.tipo ? (c.tipo === 'rep1' ? 'Rep1' : 'Rep9') : 'Archivo';
    if (c.estado === 'leyendo' || c.estado === 'validando' || c.estado === 'guardando')
      return '<div class="carga"><div class="carga-cab"><span class="giro"></span>' + ({ leyendo: 'Leyendo ', validando: 'Revisando ', guardando: 'Guardando ' })[c.estado] + nombre + '…</div></div>';
    if (c.estado === 'error')
      return '<div class="carga error"><div class="carga-cab">' + ico('error') + 'No se pudo usar ' + nombre + '</div><ul><li>' + esc(c.error) + '</li>' + (c.detalles || []).map(d => '<li>' + esc(d) + '</li>').join('') + '</ul><div class="acciones"><button class="btn chico" data-cerrar-carga="' + c.id + '">Cerrar</button></div></div>';
    const v = c.val, warns = (v.avisos || []).filter(a => a.nivel === 'warn'), infos = (v.avisos || []).filter(a => a.nivel !== 'warn');
    const chips = c.tipo === 'rep1' ? '<div class="fechas-rep1">' + v.porFecha.map(f => '<span class="' + (f.fecha >= v.requerido.desde && f.fecha <= v.requerido.hasta ? 'dentro' : '') + '">' + dCorta(f.fecha) + ': ' + f.n + '</span>').join('') + '</div>' : '';
    return '<div class="carga revisar"><div class="carga-cab">' + ico('warn') + '<span>Revisa ' + nombre + ' antes de guardarlo</span></div>' +
      '<p style="margin-top:6px;font-size:14px">' + tipoTxt + ' con ' + pl(v.filas, c.tipo === 'rep1' ? 'cuota' : 'línea', c.tipo === 'rep1' ? 'cuotas' : 'líneas') + '. Los vencimientos que trae están marcados abajo; los que caen dentro del rango de esta tanda van resaltados.</p>' + chips +
      '<ul>' + warns.map(w => '<li>' + esc(w.texto) + '</li>').join('') + infos.map(w => '<li style="color:var(--gris-600)">' + esc(w.texto) + '</li>').join('') + '</ul>' +
      '<div class="acciones"><button class="btn principal" data-guardar-carga="' + c.id + '">Guardar de todos modos</button><button class="btn" data-cerrar-carga="' + c.id + '">Cambiar archivo</button></div></div>';
  }).join('');
}

function pintarHoy() {
  const raiz = $('#v-hoy'); if (!raiz || !S.estado) return;
  const e = S.estado, t = e.tanda, tx = textoHeroe();
  const r1 = estadoReporte('rep1'), r9 = estadoReporte('rep9'), reportesOk = r1 === 'ok' && r9 === 'ok';
  const g = grupos(), colaOk = S.cola && S.cola.ok && reportesOk;
  const aten = g.revisar.length + g.bloqueadas.length;
  const hecho1 = reportesOk, activo1 = !reportesOk;
  const paso2 = !colaOk ? 'espera' : aten > 0 ? 'activo' : 'hecho';
  const paso3 = !colaOk ? 'espera' : g.listos.length > 0 ? 'activo' : 'hecho';
  const chica = reportesOk && !S.cargasLista.length;
  const zona = can('cargar')
    ? '<div class="zona ' + (chica ? 'chica' : '') + '" data-zona tabindex="0" role="button">' + ico('subir') + '<strong>' + (chica ? '¿Descargaste uno nuevo? Suéltalo aquí' : 'Suelta aquí el Rep1 y el Rep9') + '</strong><span>' + (chica ? 'o haz clic para elegirlo' : 'Puedes soltar los dos juntos. La plataforma reconoce cuál es cuál y los guarda sola.') + '</span></div><input type="file" accept=".xlsx,.xls" multiple hidden data-archivo>'
    : '<p class="detalle">Tu rol no permite cargar reportes.</p>';

  let pasoRevisa, pasoEnvia;
  if (paso2 === 'espera') pasoRevisa = '<p>Aparecerá aquí lo que necesite tu atención.</p>';
  else if (aten > 0) pasoRevisa = '<div class="paso-linea"><div class="dato"><b>' + aten + '</b>' + (aten === 1 ? 'aviso necesita' : 'avisos necesitan') + ' tu atención<small>Les falta un dato o tienen una observación. Se resuelven en un clic.</small></div><button class="btn oscuro" data-ir="avisos">Ver cuáles son</button></div>';
  else pasoRevisa = '<p>No hay avisos con observaciones.</p>';

/* ─── Carga de reportes: se reconocen solos y se guardan sin preguntar ──── */
function norm(s) { return String(s === null || s === undefined ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
function detectarTipo(rows) {
  for (let i = 0; i < Math.min(10, rows.length); i++) {
    const c = (rows[i] || []).map(norm);
    if (c.some(x => x.indexOf('fecha vencimiento') >= 0)) return 'rep1';
    if (c.indexOf('linea de credito') >= 0 && c.some(x => x.indexOf('saldo total') >= 0)) return 'rep9';
  }
  return null;
}

function parseXlsx(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: true });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false });
        const iso = (y, m, d) => y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0') + 'T12:00:00';
        resolve(rows.map(row => row.map(cell => {
          if (cell instanceof Date) { const c = new Date(cell.getTime() + 12 * 3600 * 1000); return iso(c.getFullYear(), c.getMonth() + 1, c.getDate()); }
          if (typeof cell === 'string') {
            const m = cell.trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
            if (m) { let y = parseInt(m[3], 10); if (y < 100) y += 2000; return iso(y, parseInt(m[1], 10), parseInt(m[2], 10)); }   // el reporte trae mes/día/año
          }
          return cell;
        })));
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('No se pudo leer el archivo.'));
    reader.readAsArrayBuffer(file);
  });
}

async function procesarArchivos(files) {
  for (const f of files) await procesarUno(f);
  await terminarCargas();
}

async function procesarUno(file) {
  const item = { id: ++S.cargaSeq, archivo: file.name, estado: 'leyendo' };
  S.cargasLista.push(item); pintarHoy();
  try {
    if (!/\.(xlsx|xls)$/i.test(file.name)) throw new Error('Usa un archivo de Excel (.xlsx o .xls).');
    const rows = await parseXlsx(file);
    const tipo = detectarTipo(rows);
    if (!tipo) throw new Error('No reconozco este archivo. El Rep1 debe tener la columna "Fecha Vencimiento" y el Rep9 las columnas "Línea de crédito" y "*SALDO TOTAL".');
    item.tipo = tipo; item.estado = 'validando'; pintarHoy();
    const val = await api('validarReporte', tipo, rows, { archivo: file.name });
    if (!val.ok) { item.estado = 'error'; item.error = val.error; item.detalles = (val.mismatches || []).slice(0, 5); }
    else {
      item.val = val; item.rows = rows;
      if ((val.avisos || []).some(a => a.nivel === 'warn')) item.estado = 'revisar';
      else await guardarCarga(item);
    }
  } catch (err) { item.estado = 'error'; item.error = err.message || String(err); }
  pintarHoy();
}

async function guardarCarga(item) {
  item.estado = 'guardando'; pintarHoy();
  const meta = { archivo: item.archivo };
  if (item.tipo === 'rep1') { meta.rangoDesde = item.val.requerido.desde; meta.rangoHasta = item.val.requerido.hasta; }
  const r = await api('guardarReporte', item.tipo, item.rows, meta);
  if (!r.ok) { item.estado = 'error'; item.error = r.error; pintarHoy(); return; }
  S.cargasLista = S.cargasLista.filter(x => x.id !== item.id);
  toast((item.tipo === 'rep1' ? 'Rep1' : 'Rep9') + ' guardado: ' + pl(r.filas, item.tipo === 'rep1' ? 'cuota' : 'línea', item.tipo === 'rep1' ? 'cuotas' : 'líneas') + '.');
}

async function terminarCargas() {
  await refrescarEstado();
  S.excl.clear(); S.cartera = null;
  if (S.estado.cortes.rep1.cargado && S.estado.cortes.rep9.cargado) await cargarCola(true);
  api('getResumenInicio').then(r => { S.resumen = r; if (S.vista === 'hoy') pintarHoy(); });
  pintarHoy();
}

    : (d.capVencido ? 'Hay capital vencido, pero no se proyectan moratorios: ' + (i.sinTasa ? 'falta registrar la tasa del cliente.' : 'el vencimiento es el mismo día del corte.') : 'No hay capital vencido, así que no se proyectan moratorios.');

    f('Total a pagar', d.total, 'total') + '</tbody></table><p class="explica">' + esc(nota) + '</p>';

function confirmarEnvio(keys) {
  const items = keys.map(k => S.cola.items.find(i => i.key === k)).filter(Boolean);
  if (!items.length) return;
  const rev = items.filter(i => i.estado === 'REVISAR');
  const a1 = items.filter(i => i.accion === 'PREVENTIVO').length, a2 = items.filter(i => i.accion === 'VISPERA').length;
  const partes = [a1 ? pl(a1, 'primer aviso', 'primeros avisos') : '', a2 ? pl(a2, 'segundo aviso', 'segundos avisos') : ''].filter(Boolean).join(' y ');
  const prueba = S.estado.modoPrueba;
  const velo = abrirModal({
    titulo: items.length === 1 ? 'Enviar este aviso' : 'Enviar ' + items.length + ' avisos',
    cuerpo: '<p>' + partes + ', por <b class="num">' + esc(montosTxt(items)) + '</b>.</p>' +
      '<p style="margin-top:8px;color:var(--gris-600)">' + (prueba ? 'Estás en modo prueba: los correos llegan a un buzón interno, no a los clientes.' : 'Los correos saldrán a los clientes y a la copia fija configurada.') + '</p>' +
      (rev.length ? '<div class="banner" style="margin:14px 0 0">' + ico('warn') + '<span>' + (rev.length === 1 ? 'Este aviso tiene una observación: ' : rev.length + ' avisos tienen observaciones: ') + esc(motivos(rev[0]).join(' ')) + (rev.length > 1 ? ' Y otras similares.' : '') + ' Se enviarán así.</span></div>' : '') +
      '<ul class="resumen-lista">' + items.slice(0, 8).map(i => '<li><span>' + esc(i.cliente) + '</span><span class="num">' + dinero(i.total, i.moneda) + '</span></li>').join('') + (items.length > 8 ? '<li><span>y ' + (items.length - 8) + ' más</span><span></span></li>' : '') + '</ul>',
    pie: '<button class="btn" data-cerrar>Cancelar</button><button class="btn principal grande" data-ir>Enviar ' + (items.length === 1 ? 'aviso' : items.length + ' avisos') + '</button>'
  });
  $('[data-cerrar]', velo).addEventListener('click', cerrarModal);
  $('[data-ir]', velo).addEventListener('click', () => enviarLote(keys, rev.length > 0));
}

async function enviarLote(keys, confirmarRevision) {
  const TAM = 12, total = keys.length;
  const velo = abrirModal({ titulo: 'Enviando avisos', fijo: true, cuerpo: '<p id="env-txt">Preparando…</p><div class="progreso"><i id="env-barra" style="width:0%"></i></div>', pie: '' });
  const acum = { enviados: 0, errores: 0, omitidos: 0, resultados: [], pendientes: [] };
  let fallo = '';
  for (let i = 0; i < keys.length; i += TAM) {
    const bloque = keys.slice(i, i + TAM);
    $('#env-txt', velo).textContent = 'Enviando ' + Math.min(i + TAM, total) + ' de ' + total + '…';
    const r = await api('enviarAvisos', bloque, { confirmarRevision: confirmarRevision });
    if (!r.ok) { fallo = r.error; acum.pendientes = acum.pendientes.concat(keys.slice(i)); break; }
    acum.enviados += r.enviados; acum.errores += r.errores; acum.omitidos += r.omitidos;
    acum.resultados = acum.resultados.concat(r.resultados); acum.pendientes = acum.pendientes.concat(r.pendientes || []);
    if (r.pendientes && r.pendientes.length) { acum.pendientes = acum.pendientes.concat(keys.slice(i + TAM)); break; }
    $('#env-barra', velo).style.width = (Math.min(i + TAM, total) / total * 100) + '%';
  }
  cerrarLateral();
  if (S.estado.chatConfigurado && acum.enviados + acum.errores > 0) {
    const g = grupos(); api('resumenEnChat', acum, g.revisar.length + g.bloqueadas.length);
  }
  await cargarCola(true);
  api('getResumenInicio').then(r => { S.resumen = r; });
  const problemas = acum.resultados.filter(x => !x.ok);
  const v2 = abrirModal({
    titulo: acum.errores || fallo || acum.pendientes.length ? 'Se enviaron algunos avisos' : 'Avisos enviados',
    cuerpo: '<div class="conteos"><div><b class="num">' + acum.enviados + '</b><span>enviados</span></div>' + (acum.errores ? '<div><b class="num" style="color:var(--ladrillo)">' + acum.errores + '</b><span>con error</span></div>' : '') + (acum.omitidos ? '<div><b class="num">' + acum.omitidos + '</b><span>omitidos</span></div>' : '') + (acum.pendientes.length ? '<div><b class="num">' + acum.pendientes.length + '</b><span>sin enviar</span></div>' : '') + '</div>' +
      (fallo ? '<p style="margin-top:12px;color:var(--ladrillo)">' + esc(fallo) + '</p>' : '') +
      (acum.pendientes.length && !fallo ? '<p style="margin-top:12px">Se acabó el tiempo o la cuota diaria de Google. Vuelve a enviar: lo que ya salió no se repite.</p>' : '') +
      (problemas.length ? '<ul class="resumen-lista">' + problemas.map(x => '<li><span><b>' + esc(x.cliente || x.key) + '</b></span><span style="text-align:right">' + esc(x.error) + '</span></li>').join('') + '</ul>' : ''),
    pie: '<button class="btn" data-historial>Ver en el historial</button><button class="btn principal" data-cerrar>Listo</button>'
  });
  $('[data-cerrar]', v2).addEventListener('click', cerrarModal);
  $('[data-historial]', v2).addEventListener('click', () => { cerrarModal(); irA('historial'); });
}

function abrirReenvio(key) {
  const i = S.cola.items.find(x => x.key === key);

    titulo: 'Reenviar aviso',
    cuerpo: '<p>Se vuelve a mandar el aviso de <b>' + esc(i.cliente) + '</b> con el monto de hoy (' + dinero(i.total, i.moneda) + '). No cambia el calendario de avisos.</p><div class="campo" style="margin-top:14px"><label for="motivo-re">¿Por qué lo reenvías?</label><textarea id="motivo-re" placeholder="Por ejemplo: el cliente pidió el correo otra vez o cambió su dirección."></textarea></div>',

  if (!regs.length) h += '<div class="lista"><div class="vacio"><b>Sin movimientos</b>Aquí aparecerán los envíos.</div></div>';

    h += '<div class="fila hist"><span class="num" style="color:var(--gris-600)">' + horaDe(r.timestamp) + '</span><div class="quien"><b title="' + esc(r.cliente) + '">' + esc(r.cliente) + '</b><small>Línea ' + esc(r.linea) + '</small></div>' +

      '<div class="cuando">' + chip(r.status) + '<small>' + esc(r.status === 'ENVIADO' || r.status === 'ENVIADO_PRUEBA' ? (r.usuario || '').split('@')[0] : r.mensaje) + '</small></div>' +

  });
  if (abierto) h += '</div>';
  raiz.innerHTML = h;
  $$('[data-st]', raiz).forEach(x => x.addEventListener('click', () => { S.filtroHist.status = x.dataset.st; pintarHistorial(); }));

  $$('[data-reenv]', raiz).forEach(x => x.addEventListener('click', async () => {
    if (!S.cola || !S.cola.ok) await cargarCola(true);
    const item = S.cola && S.cola.ok ? S.cola.items.find(i => i.key === x.dataset.reenv) : null;

    abrirReenvio(item.key);
  }));
}

    ['BASE_MORATORIOS', 'Hasta qué fecha se proyectan', 'NOMINAL usa la fecha de vencimiento del Rep1; EFECTIVA usa el día hábil de pago.', 'sel:NOMINAL,EFECTIVA']] },
  { t: 'Correo', n: '', p: [
    ['REMITENTE_NOMBRE', 'Nombre que ve el cliente como remitente', '', 'txt'],
    ['FIRMA_NOMBRE', 'Nombre que firma el correo', '', 'txt'],
    ['REPLY_TO', 'Correo al que responde el cliente', 'Vacío usa el de notificaciones.', 'txt'],
    ['NOTIFICAR_A', 'Correo de notificaciones', '', 'txt'],
    ['CC_FIJO', 'Copia fija en todos los avisos', 'Varios correos separados por coma.', 'txt'],
    ['BCC_FIJO', 'Copia oculta fija', '', 'txt'],
    ['ASUNTO_RFC2047', 'Codificar el asunto como en la v1', 'Déjalo activo salvo que el asunto se vea mal en algún cliente de correo.', 'bool']] },
  { t: 'Envío automático y Chat', n: 'Un espacio de Chat recibe el recordatorio de descarga, el aviso de reportes faltantes y el resumen de cada envío.', p: [
    ['ENVIO_AUTOMATICO', 'Enviar solo los avisos listos', 'Si está apagado, los avisos se mandan únicamente desde esta pantalla.', 'bool'],
    ['HORA_ENVIO_AUTOMATICO', 'Hora del envío automático', 'De 0 a 23.', 'num'],
    ['HORA_RECORDATORIO', 'Hora del recordatorio para descargar reportes', 'De 0 a 23.', 'num'],
    ['HORA_ESCALACION', 'Hora del aviso si siguen sin cargarse', 'De 0 a 23.', 'num'],
    ['CHAT_MENCION', 'A quién mencionar en el Chat', 'all, o el ID de usuario (users/123…). Vacío no menciona.', 'txt']], chat: true },
  { t: 'Ajustes de saldo', n: '', p: [
    ['UMBRAL_AJUSTE_APROBACION', 'Monto desde el cual otro usuario debe aprobar', '', 'num'],
    ['APROBADORES', 'Quiénes pueden aprobar', 'Correos separados por coma. Vacío quiere decir que no se pide aprobación.', 'txt']] },
  { t: 'Modo prueba', n: 'Para ensayar sin molestar a los clientes: los correos llegan a un buzón interno y no cuentan como avisos reales.', p: [
    ['MODO_PRUEBA', 'Activar modo prueba', '', 'bool'],
    ['MODO_PRUEBA_DESTINO', 'Buzón que recibe los correos de prueba', 'Vacío usa la cuenta de quien envía.', 'txt']], prueba: true }
];

async function cargarConfig() {
  const raiz = $('#v-config');
  raiz.innerHTML = '<div class="titulo-pagina"><div><h2>Configuración</h2></div></div><div class="cargando"><span class="giro"></span>Cargando…</div>';
  S.config = await api('getConfigUI');
  pintarConfig();
}

function controlParam(clave, valor, tipo, dis) {
  const d = dis ? ' disabled' : '';
  if (tipo === 'bool') return '<label class="conmutador"><input type="checkbox" data-clave="' + esc(clave) + '" data-bool ' + (String(valor).toUpperCase() === 'TRUE' ? 'checked' : '') + d + '><span></span></label>';
  if (tipo.indexOf('sel:') === 0) return '<select data-clave="' + esc(clave) + '"' + d + '>' + tipo.slice(4).split(',').map(o => '<option ' + (o === valor ? 'selected' : '') + '>' + o + '</option>').join('') + '</select>';
  return '<input data-clave="' + esc(clave) + '" value="' + esc(valor) + '"' + (tipo === 'num' ? ' inputmode="decimal" style="max-width:140px"' : '') + d + '>';
}

function pintarConfig() {
  const raiz = $('#v-config'), c = S.config;
  if (!c || !c.ok) { raiz.innerHTML = '<div class="titulo-pagina"><div><h2>Configuración</h2></div></div><div class="vacio"><b>No se pudo leer</b>' + esc(c && c.error) + '</div>'; return; }
  const admin = c.puedeConfig, val = {}; c.params.forEach(p => val[p.clave] = p.valor);
  const usadas = new Set();
  let h = '<div class="titulo-pagina"><div><h2>Configuración</h2><p>' + (admin ? 'Los cambios se guardan al salir de cada campo y quedan registrados.' : 'Solo un administrador puede cambiar estos valores.') + '</p></div></div>';
  CONFIG_GRUPOS.forEach(gr => {
    h += '<div class="panel"><h3>' + gr.t + '</h3>' + (gr.n ? '<p class="nota">' + gr.n + '</p>' : '');
    if (gr.chat) {
      h += '<div class="ajuste-param"><label>Conexión con Chat<small>' + (c.chatConfigurado ? 'Conectado.' : 'Todavía no está conectado.') + ' El enlace (webhook) se guarda en las propiedades del script, no en la hoja ni en el código.</small></label><div class="control" style="gap:8px;flex-wrap:wrap">' +
        (admin ? '<input id="cfg-hook" type="password" placeholder="https://chat.googleapis.com/v1/spaces/…" autocomplete="off" style="max-width:280px"><button class="btn chico principal" id="cfg-guardar-hook">Guardar</button><button class="btn chico" id="cfg-probar">Enviar mensaje de prueba</button>' : '') + '</div></div>' +
        '<div class="ajuste-param"><label>Recordatorios programados<small>' + (c.triggers.length ? 'Activos: ' + esc(c.triggers.join(', ')) + '.' : 'No hay ninguno instalado.') + '</small></label><div class="control">' + (admin ? '<button class="btn chico" id="cfg-triggers">Instalar o reinstalar</button>' : '') + '</div></div>';
    }
    gr.p.forEach(p => { if (!(p[0] in val)) return; usadas.add(p[0]);
      h += '<div class="ajuste-param"><label for="">' + p[1] + (p[2] ? '<small>' + p[2] + '</small>' : '') + '</label><div class="control">' + controlParam(p[0], val[p[0]], p[3], !admin) + '</div></div>'; });
    if (gr.prueba && admin && String(val.MODO_PRUEBA).toUpperCase() === 'TRUE')
      h += '<div class="ajuste-param"><label>Fecha simulada<small>Para ensayar un día distinto de hoy. Solo funciona en modo prueba. Vacío usa la fecha real.</small></label><div class="control" style="gap:8px"><input type="date" id="cfg-fecha" value="' + esc(S.estado.fechaSimulada || '') + '" style="max-width:180px"><button class="btn chico" id="cfg-fecha-g">Aplicar</button></div></div>';
    h += '</div>';
  });
  h += '<div class="panel"><h3>Días inhábiles</h3><p class="nota">Sábados y domingos nunca cuentan. 2026 coincide con el calendario publicado por la CNBV; los años siguientes se calculan por regla y conviene validarlos cuando la CNBV publique el suyo.</p><div class="fechas-rep1">' +
    c.inhabiles.map(d => '<span class="dentro">' + dCorta(d.fecha) + ' ' + d.fecha.slice(0, 4) + ': ' + esc(d.descripcion) + '</span>').join('') + '</div>' +
    (admin ? '<div class="form-grid" style="margin-top:16px"><div class="campo"><label for="inh-f">Fecha</label><input id="inh-f" type="date"></div><div class="campo"><label for="inh-d">Descripción</label><input id="inh-d"></div><div class="campo"><label for="inh-e">Acción</label><select id="inh-e"><option value="ACTIVO">Agregar como inhábil</option><option value="QUITAR">Quitar de inhábiles</option></select></div></div><div class="acciones"><button class="btn" id="inh-g">Guardar fecha</button></div>' : '') + '</div>';
  const resto = c.params.filter(p => !usadas.has(p.clave));
  h += '<details class="panel"><summary style="cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:18px">Otros parámetros</summary><p class="nota" style="margin-top:10px">Datos bancarios que aparecen en los correos y parámetros heredados de la versión anterior.</p>' +
    resto.map(p => '<div class="ajuste-param"><label>' + esc(p.clave) + (p.descripcion ? '<small>' + esc(p.descripcion) + '</small>' : '') + '</label><div class="control"><input data-clave="' + esc(p.clave) + '" value="' + esc(p.valor) + '"' + (admin && !p.sensible ? '' : ' disabled') + '></div></div>').join('') + '</details>';
  raiz.innerHTML = h;
  if (admin) {
    const q = id => $(id, raiz);
    if (q('#cfg-guardar-hook')) {
      q('#cfg-guardar-hook').addEventListener('click', async () => { const r = await api('guardarWebhookChat', q('#cfg-hook').value); if (!r.ok) toast(r.error, 'error'); else { toast(r.configurado ? 'Chat conectado.' : 'Chat desconectado.'); S.estado.chatConfigurado = r.configurado; cargarConfig(); } });
      q('#cfg-probar').addEventListener('click', async () => { const r = await api('probarChat'); toast(r.ok ? 'Mensaje enviado al espacio.' : (r.error || 'No se pudo enviar.'), r.ok ? undefined : 'error'); });
      q('#cfg-triggers').addEventListener('click', async () => { const r = await api('instalarTriggersUI'); if (!r.ok) toast(r.error, 'error'); else { toast('Recordatorios instalados.'); cargarConfig(); } });
    }
    $$('[data-clave]', raiz).forEach(inp => inp.addEventListener('change', async () => {
      const valor = inp.dataset.bool !== undefined ? (inp.checked ? 'TRUE' : 'FALSE') : inp.value;
      const r = await api('setConfig', inp.dataset.clave, valor);
      if (!r.ok) { toast(r.error, 'error'); cargarConfig(); return; }
      toast('Guardado.'); await refrescarEstado(); if (inp.dataset.clave === 'MODO_PRUEBA') cargarConfig(); if (S.cola) cargarCola(true);
    }));
    if (q('#cfg-fecha-g')) q('#cfg-fecha-g').addEventListener('click', async () => { const r = await api('setFechaSimulada', q('#cfg-fecha').value); if (!r.ok) toast(r.error, 'error'); else { toast('Fecha simulada aplicada.'); await refrescarEstado(); if (S.cola) cargarCola(true); } });
    q('#inh-g').addEventListener('click', async () => { const r = await api('guardarInhabil', q('#inh-f').value, q('#inh-d').value, q('#inh-e').value); if (!r.ok) toast(r.error, 'error'); else { toast('Calendario actualizado.'); await refrescarEstado(); cargarConfig(); } });
  }
}

document.addEventListener('DOMContentLoaded', arrancar);
if (document.readyState !== 'loading') arrancar();
</script>
