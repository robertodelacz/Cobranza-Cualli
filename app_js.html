<script>
/* ═══════════════════════════════════════════════════════════════════
   COBRANZA PREVENTIVA · FRONTEND JS · MASTER UNIFICADO
   ═══════════════════════════════════════════════════════════════════ */

const state = {
  rep1: { rows: null, validation: null },
  rep9: { rows: null, validation: null },
  pendingTarget: null,
  avisos: [],
  stats: null,
  fechaReporte: null,
  warnings: [],
  filterTipo: 'all',
  filterSearch: '',
  selected: new Set(),
  currentPreviewLinea: null,
  bitacora: []
};

// ─── 1. INICIALIZACIÓN (BOOTSTRAP) ─────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  initDateDisplay();
  initNav();
  initDropzones();
  initModals();
  initDashboard();
  initBitacora();
  loadInitialState();
});

function initDateDisplay() {
  const today = new Date();
  const opts = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  const txt = today.toLocaleDateString('es-MX', opts);
  document.getElementById('dateDisplay').textContent = txt.charAt(0).toUpperCase() + txt.slice(1);
}

function loadInitialState() {
  google.script.run
    .withSuccessHandler(data => {
      if (!data.ok) { toast(`Error inicial: ${data.error}`, 'error'); return; }
      document.getElementById('userEmail').textContent = data.userEmail;
      renderCacheStatus('rep1', data.rep1Status);
      renderCacheStatus('rep9', data.rep9Status);
    })
    .withFailureHandler(err => toast(`No se pudo cargar el estado: ${err.message}`, 'error'))
    .getInitialState();
}

function renderCacheStatus(target, status) {
  const valEl = document.getElementById(target === 'rep1' ? 'lastRep1' : 'lastRep9');
  const metaEl = document.getElementById(target === 'rep1' ? 'lastRep1Meta' : 'lastRep9Meta');
  if (!status.loaded) {
    valEl.textContent = 'Sin cargar';
    metaEl.textContent = 'Pendiente de subir el reporte';
    return;
  }
  valEl.textContent = `${status.rowCount} registros`;
  const d = new Date(status.timestamp);
  const fecha = d.toLocaleString('es-MX', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  metaEl.textContent = `${fecha} · ${status.user}`;
}

// ─── 2. NAVEGACIÓN Y MENÚ ──────────────────────────────────────────
function initNav() {
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', e => {
      e.preventDefault();
      if (item.classList.contains('disabled')) return;
      const section = item.dataset.section;
      switchSection(section);
      if (section === 'envios') refreshBitacora();
    });
  });
}

function switchSection(section) {
  document.querySelectorAll('.nav-item').forEach(it => it.classList.remove('active'));
  document.querySelector(`.nav-item[data-section="${section}"]`).classList.add('active');
  document.querySelectorAll('.section-content').forEach(s => s.hidden = true);
  document.getElementById(`section-${section}`).hidden = false;
}

// ─── 3. CARGA DE ARCHIVOS (DROPZONES) ──────────────────────────────
function initDropzones() {
  ['rep1', 'rep9'].forEach(target => {
    const dz = document.getElementById(`dropzone-${target}`);
    const input = document.getElementById(`file-${target}`);
    const browseBtn = document.querySelector(`.btn-browse[data-target="${target}"]`);

    dz.addEventListener('click', e => {
      if (e.target.classList.contains('btn-browse')) return;
      input.click();
    });
    browseBtn.addEventListener('click', e => { e.stopPropagation(); input.click(); });

    input.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) handleFile(file, target);
      input.value = '';
    });

    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', e => { e.preventDefault(); dz.classList.remove('dragover'); });
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file, target);
    });
  });
}

async function handleFile(file, target) {
  const statusEl = document.getElementById(`status-${target}`);
  if (!/\.(xlsx|xls)$/i.test(file.name)) {
    showCardStatus(statusEl, 'error', 'Formato no válido. Usa .xlsx o .xls');
    return;
  }
  showCardStatus(statusEl, 'info', `<span class="spinner"></span> Procesando ${file.name}…`);
  try {
    const rows = await parseXlsx(file);
    state[target].rows = rows;

    google.script.run
      .withSuccessHandler(validation => {
        state[target].validation = validation;
        if (!validation.ok) {
          let msg = `<strong>${validation.error}</strong>`;
          if (validation.mismatches && validation.mismatches.length) {
            msg += '<ul>' + validation.mismatches.slice(0, 5).map(m => `<li>${escapeHtml(m)}</li>`).join('') + '</ul>';
          }
          showCardStatus(statusEl, 'error', msg);
          document.getElementById(`card-${target}`).classList.add('error');
          return;
        }
        showCardStatus(statusEl, 'success', `✓ <strong>${file.name}</strong> · ${validation.rowCount} registros · listo`);
        document.getElementById(`card-${target}`).classList.remove('error');
        document.getElementById(`dropzone-${target}`).classList.add('has-file');
        openPreviewModal(target, file.name);
      })
      .withFailureHandler(err => showCardStatus(statusEl, 'error', `Error de validación: ${escapeHtml(err.message)}`))
      [target === 'rep1' ? 'validateRep1' : 'validateRep9'](rows);

  } catch (err) {
    showCardStatus(statusEl, 'error', `No se pudo leer el archivo: ${escapeHtml(err.message)}`);
  }
}

function parseXlsx(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array', cellDates: true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
        
        const cleaned = rows.map(row => row.map(cell => {
          if (cell instanceof Date) return cell.toISOString();
          if (typeof cell === 'string') {
            const match = cell.trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
            if (match) {
              // REVERTIMOS: El primer dígito es el MES y el segundo es el DÍA (formato original exitoso)
              const mes = parseInt(match[1], 10) - 1; 
              const dia = parseInt(match[2], 10);     
              let anio = parseInt(match[3], 10);
              if (anio < 100) anio += 2000;
              // Guardamos temporalmente al mediodía
              return new Date(anio, mes, dia, 12, 0, 0).toISOString();
            }
          }
          return cell;
        }));
        resolve(cleaned);
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.readAsArrayBuffer(file);
  });
}

function showCardStatus(el, type, html) {
  const cls = type === 'error' ? 'status-error' : 'status-success';
  el.innerHTML = `<div class="${cls}">${html}</div>`;
}

// ─── 4. LÓGICA DEL DASHBOARD Y TABLA ───────────────────────────────
function initDashboard() {
  document.getElementById('btnRecalcular').addEventListener('click', recalcularAvisos);
  document.getElementById('btnHojaTrabajo').addEventListener('click', regenerarHojaTrabajo);
  document.getElementById('toggleModoPrueba').addEventListener('change', toggleModoPrueba);

  // Filtros
  document.querySelectorAll('#filterPills .filter-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('#filterPills .filter-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      state.filterTipo = pill.dataset.filter;
      renderTable();
    });
  });

  document.getElementById('filterSearch').addEventListener('input', e => {
    state.filterSearch = e.target.value.toLowerCase().trim();
    renderTable();
  });

  // Check all & Masivos
  document.getElementById('checkAll').addEventListener('change', e => {
    const lineas = getFilteredLineas();
    if (e.target.checked) lineas.forEach(l => state.selected.add(l));
    else lineas.forEach(l => state.selected.delete(l));
    renderTable();
    updateSelectionBar();
  });

  document.getElementById('btnSelectClear').addEventListener('click', () => {
    state.selected.clear();
    renderTable();
    updateSelectionBar();
  });
  document.getElementById('btnEnviarMasivo').addEventListener('click', abrirConfirmacionMasiva);
}

function recalcularAvisos() {
  const btn = document.getElementById('btnRecalcular');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner spinner-light"></span> Calculando…';

  google.script.run
    .withSuccessHandler(result => {
      btn.disabled = false;
      btn.innerHTML = original;
      if (!result.ok) { toast(`Error: ${result.error}`, 'error'); return; }

      state.avisos = result.avisos;
      state.stats = result.stats;
      state.fechaReporte = result.fechaReporte;
      state.warnings = result.warnings || [];
      state.selected.clear();

      try {
        renderFechaCalculo();
        renderKPIs();
        renderFilterCounts();
        renderTable();
        updateSelectionBar();

        document.getElementById('dashEmpty').hidden = true;
        document.getElementById('kpiGrid').hidden = false;
        document.getElementById('dashFilters').hidden = false;
        document.getElementById('tableWrap').hidden = false;

        toast(`✓ ${result.stats.elegibles} avisos calculados`, 'success');
      } catch (e) {
        toast(`Error visualizando tabla: ${e.message}`, 'error');
        console.error(e);
      }
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      btn.innerHTML = original;
      toast(`Error al calcular: ${err.message}`, 'error');
    })
    .calcularAvisos();
}

function regenerarHojaTrabajo() {
  const btn = document.getElementById('btnHojaTrabajo');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Generando…';
  google.script.run
    .withSuccessHandler(result => {
      btn.disabled = false; btn.innerHTML = original;
      if (!result.ok) { toast(`Error: ${result.error}`, 'error'); return; }
      toast(`✓ Hoja_Trabajo regenerada`, 'success');
    })
    .withFailureHandler(err => {
      btn.disabled = false; btn.innerHTML = original; toast(`Error: ${err.message}`, 'error');
    })
    .regenerarHojaTrabajo();
}

function toggleModoPrueba(e) {
  const activo = e.target.checked;
  const banner = document.getElementById('modoPruebaBanner');
  banner.hidden = !activo;
  google.script.run
    .withSuccessHandler(result => {
      if (!result.ok) { e.target.checked = !activo; banner.hidden = activo; return; }
      toast(activo ? '⚠ Modo prueba ACTIVADO' : '✓ Modo prueba DESACTIVADO', activo ? 'error' : 'success');
    })
    .setModoPrueba(activo);
}

// ─── 5. PINTADO DE INTERFAZ (RENDER) ───────────────────────────────
function renderFechaCalculo() {
  const d = new Date(state.fechaReporte);
  const opts = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  let txt = d.toLocaleDateString('es-MX', opts);
  document.getElementById('fechaCalculo').textContent = txt.charAt(0).toUpperCase() + txt.slice(1);
}

function renderKPIs() {
  const s = state.stats;
  document.getElementById('kpiTotal').textContent = formatMoney(s.sumaTotalMXN || 0); 
  document.getElementById('kpiTotalMeta').textContent = `${s.elegibles} avisos en periodo`;
  document.getElementById('kpiCapVenc').textContent = formatMoney(s.sumaCapVencido);
  const conCapVenc = state.avisos.filter(a => a.capVencido > 0).length;
  document.getElementById('kpiCapVencMeta').textContent = `${conCapVenc} cliente(s) con adeudos previos`;
  document.getElementById('kpiMor').textContent = formatMoney(s.sumaMoratorios);
  const totalWarn = s.sinRep9 + s.sinTasa + s.sinCorreo;
  document.getElementById('kpiWarn').textContent = totalWarn;
  document.getElementById('kpiWarnMeta').textContent = `${s.sinRep9} sin Rep9 · ${s.sinTasa} sin tasa · ${s.sinCorreo} sin correo`;
}

function renderFilterCounts() {
  const s = state.stats;
  const totalWarn = s.sinRep9 + s.sinTasa + s.sinCorreo;
  const counts = { '>5': 0, '5': 0, '<5': 0 };
  state.avisos.forEach(a => {
    if (a.dias > 5) counts['>5']++;
    else if (a.dias === 5) counts['5']++;
    else counts['<5']++;
  });

  document.querySelector('.filter-pill[data-filter="all"]').innerHTML = `Todos <span class="pill-count">${state.avisos.length}</span>`;
  document.querySelector('.filter-pill[data-filter=">5"]').innerHTML = `> 5 días <span class="pill-count">${counts['>5']}</span>`;
  document.querySelector('.filter-pill[data-filter="5"]').innerHTML = `5 días <span class="pill-count">${counts['5']}</span>`;
  document.querySelector('.filter-pill[data-filter="<5"]').innerHTML = `< 5 días <span class="pill-count">${counts['<5']}</span>`;
  document.querySelector('.filter-pill[data-filter="warn"]').innerHTML = `Solo warnings <span class="pill-count">${totalWarn}</span>`;
}

function badgeDias(dias) {
  if (dias > 5) return `<span class="aviso-badge aviso-green">${dias} días</span>`;
  if (dias === 5) return `<span class="aviso-badge aviso-yellow">5 días</span>`;
  return `<span class="aviso-badge aviso-red">${dias} días</span>`;
}

function isEnviable(a) {
  return !a.sinRep9 && !!a.cuentaSTP && !!a.correo && !a.sinCorreo;
}

function getFilteredAvisos() {
  let filtered = state.avisos;
  if (state.filterTipo === 'warn') filtered = filtered.filter(a => a.sinRep9 || a.sinTasa || a.sinCorreo);
  else if (state.filterTipo === '>5') filtered = filtered.filter(a => a.dias > 5);
  else if (state.filterTipo === '5') filtered = filtered.filter(a => a.dias === 5);
  else if (state.filterTipo === '<5') filtered = filtered.filter(a => a.dias < 5);
  
  if (state.filterSearch) {
    const q = state.filterSearch.toLowerCase().trim();
    filtered = filtered.filter(a => String(a.linea).toLowerCase().includes(q) || String(a.nombre).toLowerCase().includes(q));
  }
  return filtered;
}

function getFilteredLineas() { return getFilteredAvisos().map(a => String(a.linea)); }

function renderTable() {
  const tbody = document.getElementById('dashTbody');
  const empty = document.getElementById('tableEmpty');
  const filtered = getFilteredAvisos();

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    empty.hidden = false;
    actualizarCheckAll([]);
    return;
  }
  empty.hidden = true;

  tbody.innerHTML = filtered.map(a => {
    const hasWarn = a.sinRep9 || a.sinTasa || a.sinCorreo || !a.cuentaSTP;
    const rowClass = hasWarn ? 'row-warn' : '';
    const fechaTxt = formatFechaCorta(a.fechaVenc);
    const tipoBadge = badgeDias(a.dias); 
    const monedaBadge = a.moneda === 'USD' ? '<span class="moneda-badge moneda-usd">USD</span>' : '<span class="moneda-badge moneda-mxn">MXN</span>';
    const warnIcon = hasWarn ? '<span class="warn-icon">⚠</span>' : '';
    const enviable = isEnviable(a);
    const checked = state.selected.has(String(a.linea)) ? 'checked' : '';
    const checkbox = enviable
      ? `<input type="checkbox" class="row-check" data-linea="${escapeHtml(a.linea)}" ${checked}>`
      : `<input type="checkbox" disabled title="No enviable: falta STP, correo o tiene warnings">`;

    let acciones = `
      <button class="action-btn" data-act="detalle" data-linea="${escapeHtml(a.linea)}">Detalle</button>
      <button class="action-btn" data-act="correo" data-linea="${escapeHtml(a.linea)}">Vista correo</button>`;
    
    if (hasWarn) {
      const motivos = [];
      if (a.sinRep9) motivos.push('Sin Rep9');
      if (!a.cuentaSTP) motivos.push('Sin STP');
      if (a.sinCorreo) motivos.push('Sin correo');
      acciones += `<div style="margin-top:4px;"><span class="tag-warn">${motivos.join(', ')}</span></div>`;
    }

return `
      <tr class="${rowClass}" data-linea="${escapeHtml(a.linea)}">
        <td class="col-check">${checkbox}</td>
        <td>${tipoBadge}</td>
        <td>${fechaTxt}</td>
        <td>${escapeHtml(a.linea)}</td>
        <td class="cell-name">${warnIcon}${escapeHtml(truncate(a.nombre, 24))}</td>
        
        <td class="amount ${a.capital === 0 ? 'cell-zero' : ''}">${formatNumber(a.capital)}</td>
        <td class="amount ${a.capVencido === 0 ? 'cell-zero' : ''}">${formatNumber(a.capVencido)}</td>
        <td class="amount ${a.intereses === 0 ? 'cell-zero' : ''}">${formatNumber(a.intereses)}</td>
        <td class="amount ${a.intVencidos === 0 ? 'cell-zero' : ''}">${formatNumber(a.intVencidos)}</td>
        <td class="amount ${a.moratoriosAcum === 0 ? 'cell-zero' : ''}">${formatNumber(a.moratoriosAcum)}</td>
        <td class="amount ${a.moratoriosPeriodo === 0 ? 'cell-zero' : ''}">${formatNumber(a.moratoriosPeriodo)}</td>
        
        <td class="amount total">${formatNumber(a.total)}</td>
        <td>${monedaBadge}</td>
        <td>${acciones}</td>
      </tr>`;
      }).join('');

  tbody.querySelectorAll('.action-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.act === 'detalle') openDetailModal(btn.dataset.linea);
      else if (btn.dataset.act === 'correo') openEmailModal(btn.dataset.linea);
    });
  });

  tbody.querySelectorAll('.row-check').forEach(cb => {
    cb.addEventListener('change', () => {
      const linea = String(cb.dataset.linea);
      if (cb.checked) state.selected.add(linea); else state.selected.delete(linea);
      updateSelectionBar();
      actualizarCheckAll(getFilteredLineas());
    });
  });

  actualizarCheckAll(getFilteredLineas());
}

function actualizarCheckAll(lineas) {
  const cb = document.getElementById('checkAll');
  const enviables = lineas.filter(l => {
    const a = state.avisos.find(x => String(x.linea) === l);
    return a && isEnviable(a);
  });
  if (enviables.length === 0) { cb.checked = false; cb.indeterminate = false; return; }
  const sel = enviables.filter(l => state.selected.has(l)).length;
  cb.checked = sel === enviables.length;
  cb.indeterminate = sel > 0 && sel < enviables.length;
}

function updateSelectionBar() {
  const bar = document.getElementById('selectionBar');
  const count = state.selected.size;
  if (count === 0) { bar.hidden = true; return; }
  bar.hidden = false;
  const sumaTotal = Array.from(state.selected).reduce((s, linea) => {
    const a = state.avisos.find(x => String(x.linea) === linea);
    return s + (a ? a.total : 0);
  }, 0);
  document.getElementById('selectionCount').textContent = count;
  document.getElementById('selectionAmount').textContent = formatMoney(sumaTotal);
}

// ─── 6. MODALES ────────────────────────────────────────────────────
function initModals() {
  const setupModal = (id, closeIds) => {
    const modal = document.getElementById(id);
    closeIds.forEach(cId => document.getElementById(cId).addEventListener('click', () => modal.hidden = true));
    modal.addEventListener('click', e => { if (e.target.id === id) modal.hidden = true; });
  };
  setupModal('previewModal', ['modalClose', 'btnCancel']);
  setupModal('detailModal', ['detailClose', 'detailCloseBtn']);
  setupModal('emailModal', ['emailClose', 'emailCloseBtn']);
  setupModal('confirmModal', ['confirmClose', 'confirmCancelBtn']);
  setupModal('reportModal', ['reportClose', 'reportCloseBtn']);
  
  document.getElementById('btnConfirm').addEventListener('click', confirmSave);
  document.getElementById('btnEnviarIndividual').addEventListener('click', enviarIndividual);
  document.getElementById('btnConfirmMasivo').addEventListener('click', ejecutarEnvioMasivo);
}

function openPreviewModal(target, filename) {
  state.pendingTarget = target;
  const rows = state[target].rows;
  const dataRows = rows.slice(1).filter(r => r.some(c => c !== '' && c != null));
  document.getElementById('previewTitle').textContent = target === 'rep1' ? 'Vista previa · Rep1' : 'Vista previa · Rep9';
  document.getElementById('previewSummary').innerHTML = `<strong>Archivo:</strong> ${escapeHtml(filename)} · <strong>Registros:</strong> ${dataRows.length}`;
  
  const thead = '<thead><tr>' + rows[0].map(h => `<th>${escapeHtml(String(h))}</th>`).join('') + '</tr></thead>';
  const tbody = '<tbody>' + dataRows.slice(0, 8).map(r => '<tr>' + r.map(c => `<td>${escapeHtml(formatCell(c))}</td>`).join('') + '</tr>').join('') + '</tbody>';
  document.getElementById('previewTable').innerHTML = thead + tbody;
  document.getElementById('previewModal').hidden = false;
}

function confirmSave() {
  const target = state.pendingTarget;
  if (!target) return;
  const btn = document.getElementById('btnConfirm');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Guardando…';
  const fn = target === 'rep1' ? 'saveRep1ToCache' : 'saveRep9ToCache';

  google.script.run
    .withSuccessHandler(result => {
      btn.disabled = false; btn.textContent = 'Guardar al maestro';
      if (!result.ok) { toast(`Error: ${result.error}`, 'error'); return; }
      document.getElementById('previewModal').hidden = true;
      toast(`✓ Guardado con éxito`, 'success');
      renderCacheStatus(target, { loaded: true, rowCount: result.rowsWritten, timestamp: result.timestamp, user: result.user });
      document.getElementById(`card-${target}`).classList.add('success');
    })
    [fn](state[target].rows);
}

function openDetailModal(linea) {
  const a = state.avisos.find(x => String(x.linea) === String(linea));
  if (!a) return;
  document.getElementById('detailTitle').textContent = `Línea ${a.linea} · ${a.nombre}`;
  document.getElementById('detailBody').innerHTML = `
    <div class="detail-section">
      <h4>Identificación</h4>
      <div class="detail-grid">
        <div class="detail-row"><span class="label">Días al Vencimiento</span><span class="value">${badgeDias(a.dias)}</span></div>
        <div class="detail-row"><span class="label">Fecha</span><span class="value">${formatFechaLarga(a.fechaVenc)}</span></div>
      </div>
    </div>
    <div class="detail-row total-row">
      <span class="label">TOTAL DEL AVISO</span>
      <span class="value">${formatMoney(a.total)}</span>
    </div>`;
  document.getElementById('detailModal').hidden = false;
}

function openEmailModal(linea) {
  state.currentPreviewLinea = String(linea);
  const modal = document.getElementById('emailModal');
  const meta = document.getElementById('emailMeta');
  const frame = document.getElementById('emailPreviewFrame');
  const btnEnviar = document.getElementById('btnEnviarIndividual');

  meta.innerHTML = `<div class="email-meta-row"><span class="email-meta-label">Cargando…</span></div>`;
  frame.srcdoc = '<p style="padding:20px; color:#999;">Cargando preview…</p>';
  btnEnviar.disabled = true;
  modal.hidden = false;

  google.script.run
    .withSuccessHandler(result => {
      if (!result.ok) { meta.innerHTML = `⚠ ${escapeHtml(result.error)}`; frame.srcdoc = ''; return; }
      let metaHtml = `
        <div class="email-meta-row"><span>De: </span><span>${escapeHtml(result.from)}</span></div>
        <div class="email-meta-row"><span>Para: </span><span>${escapeHtml(result.destinatarios.join(', '))}</span></div>
        <div class="email-meta-row"><span>Asunto: </span><strong>${escapeHtml(result.asunto)}</strong></div>
      `;
      meta.innerHTML = metaHtml;
      frame.srcdoc = result.htmlBody;
      btnEnviar.disabled = false;
    })
    .previsualizarCorreo(linea);
}

function enviarIndividual() {
  const linea = state.currentPreviewLinea;
  if (!linea) return;
  const btn = document.getElementById('btnEnviarIndividual');
  const original = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Enviando…';

  google.script.run
    .withSuccessHandler(result => {
      btn.disabled = false; btn.innerHTML = original;
      if (!result.ok) { toast(`Error: ${result.error}`, 'error'); return; }
      document.getElementById('emailModal').hidden = true;
      toast(`✓ Aviso enviado`, 'success');
      recalcularAvisos();
      refreshBitacora();
    })
    .enviarAvisoIndividual(linea, true); 
}

function abrirConfirmacionMasiva() {
  const lineas = Array.from(state.selected);
  if (lineas.length === 0) { toast('No hay avisos seleccionados', 'error'); return; }

  const seleccionados = lineas.map(l => state.avisos.find(a => String(a.linea) === l)).filter(Boolean);
  const sumaTotal = seleccionados.reduce((s, a) => s + a.total, 0);

  const conteo = { '>5': 0, '5': 0, '<5': 0 };
  seleccionados.forEach(a => { 
    if (a.dias > 5) conteo['>5']++; else if (a.dias === 5) conteo['5']++; else conteo['<5']++;
  });

  document.getElementById('confirmBody').innerHTML = `
    <div class="confirm-summary">
      <div class="confirm-stat"><span class="label">Avisos a enviar</span><span class="value">${seleccionados.length}</span></div>
      <div class="confirm-stat"><span class="label">Distribución</span><span class="value">>5 días: ${conteo['>5']} · 5 días: ${conteo['5']} · <5 días: ${conteo['<5']}</span></div>
      <div class="confirm-stat total"><span class="label">Total a comunicar</span><span class="value">${formatMoney(sumaTotal)}</span></div>
    </div>`;
  document.getElementById('confirmModal').hidden = false;
}

function ejecutarEnvioMasivo() {
  const lineas = Array.from(state.selected);
  const btn = document.getElementById('btnConfirmMasivo');
  btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Enviando ${lineas.length}…`;

  google.script.run
    .withSuccessHandler(rep => {
      btn.disabled = false; btn.innerHTML = 'Sí, enviar todos';
      document.getElementById('confirmModal').hidden = true;
      document.getElementById('reportBody').innerHTML = `Enviados: ${rep.enviados} | Errores: ${rep.conError}`;
      document.getElementById('reportModal').hidden = false;
      state.selected.clear();
      recalcularAvisos();
    })
    .enviarAvisosMasivo(lineas);
}

// ─── 7. BITÁCORA DE ENVÍOS ─────────────────────────────────────────
function initBitacora() { document.getElementById('btnRefreshBitacora').addEventListener('click', refreshBitacora); }

function refreshBitacora() {
  google.script.run
    .withSuccessHandler(result => {
      if (!result.ok) return;
      state.bitacora = result.registros;
      renderBitacora();
    })
    .leerBitacora(50);
}

function renderBitacora() {
  const tbody = document.getElementById('bitacoraTbody');
  const empty = document.getElementById('bitacoraEmpty');
  document.getElementById('bitacoraCount').textContent = `${state.bitacora.length} registros`;
  
  if (state.bitacora.length === 0) { tbody.innerHTML = ''; empty.hidden = false; return; }
  empty.hidden = true;

  tbody.innerHTML = state.bitacora.map(r => {
    const tsTxt = new Date(r.timestamp).toLocaleString('es-MX', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    const statusCls = r.status === 'ENVIADO' ? 'status-enviado' : 'status-error';
    return `
      <tr>
        <td>${tsTxt}</td>
        <td>${badgeDias(r.tipoAviso)}</td> 
        <td>${escapeHtml(r.linea)}</td>
        <td class="cell-name">${escapeHtml(truncate(r.cliente, 30))}</td>
        <td class="amount total">${formatNumber(r.total)}</td>
        <td><span class="status-badge ${statusCls}">${r.status}</span></td>
        <td>
          <button class="btn btn-secondary btn-sm action-btn btn-vista-correo" data-linea="${escapeHtml(r.linea)}">Vista correo</button>
        </td>
      </tr>`;
  }).join('');

  tbody.querySelectorAll('.btn-vista-correo').forEach(btn => {
    btn.addEventListener('click', () => openEmailModal(btn.dataset.linea));
  });
}

// ─── 8. UTILIDADES Y TOAST ─────────────────────────────────────────
let toastTimer;
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.className = 'toast ' + type;
  document.getElementById('toastIcon').textContent = type === 'success' ? '✓' : '✕';
  document.getElementById('toastMsg').textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 4500);
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function truncate(str, max) { return str && str.length > max ? str.substring(0, max - 1) + '…' : str || ''; }
function formatCell(c) {
  if (c == null || c === '') return '';
  if (typeof c === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(c)) return new Date(c).toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
  if (typeof c === 'number') return c.toLocaleString('es-MX', { maximumFractionDigits: 2 });
  return String(c);
}
function formatNumber(n) { return (n === null || n === undefined || n === '' || n === 0) ? '—' : Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function formatMoney(n) { return (n === null || n === undefined) ? '—' : '$' + (Number(n) || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function formatFechaCorta(iso) { return !iso || isNaN(new Date(iso)) ? '—' : new Date(iso).toLocaleDateString('es-MX', { day: '2-digit', month: 'short' }); }
function formatFechaLarga(iso) {
  if (!iso || isNaN(new Date(iso))) return '—';
  let txt = new Date(iso).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  return txt.charAt(0).toUpperCase() + txt.slice(1);
}
