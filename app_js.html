<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   COBRANZA PREVENTIVA v2 · Front
   ═══════════════════════════════════════════════════════════════════════════ */

const S = {
  estado: null, cola: null, vista: 'hoy', filtro: 'enviar', busqueda: '',
  sel: new Set(), abiertas: new Set(), subida: { rep1: null, rep9: null },
  bitacora: null, ajustes: null, catalogos: null, catLista: 'sinTasa', config: null,
  filtroBit: { status: '', texto: '' }, cargandoCola: false
};

const DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const DOW_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

const ETIQUETA = {
  LISTA: 'Lista para enviar', REVISAR: 'Revisar antes de enviar', BLOQUEADA: 'Bloqueada', PROGRAMADA: 'Programada',
  ESPERA_VISPERA: 'Espera el aviso 2', COMPLETA: 'Completa', VENCE_HOY: 'Vence hoy', VENCIDA: 'Vencida'
};
const ORDEN_ESTADOS = ['LISTA', 'REVISAR', 'BLOQUEADA', 'PROGRAMADA', 'ESPERA_VISPERA', 'COMPLETA', 'VENCE_HOY', 'VENCIDA'];

/* ─── Utilidades ───────────────────────────────────────────────────────── */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const pl = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);
const can = p => !!(S.estado && S.estado.permisos && S.estado.permisos.indexOf(p) >= 0);

function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(resolve => {
    google.script.run
      .withSuccessHandler(r => resolve(r))
      .withFailureHandler(e => resolve({ ok: false, error: (e && e.message) || String(e) }))[fn].apply(null, args);
  });
}

function pk(k) { const p = k.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
function dCorta(k) { const d = pk(k); return DOW[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MES[d.getUTCMonth()]; }
function dLarga(k) { const d = pk(k); return DOW_L[d.getUTCDay()] + ' ' + d.getUTCDate() + ' de ' + MES_L[d.getUTCMonth()]; }
function dLargaAnio(k) { return dLarga(k) + ' de ' + k.slice(0, 4); }
function dma(k) { return k ? k.slice(8, 10) + '/' + k.slice(5, 7) + '/' + k.slice(0, 4) : ''; }
function rangoTxt(a, b) {
  const da = pk(a), db = pk(b);
  if (da.getUTCMonth() === db.getUTCMonth()) return 'del ' + DOW[da.getUTCDay()] + ' ' + da.getUTCDate() + ' al ' + DOW[db.getUTCDay()] + ' ' + db.getUTCDate() + ' de ' + MES_L[db.getUTCMonth()];
  return 'del ' + dCorta(a) + ' al ' + dCorta(b);
}
function dinero(n, mon) {
  const v = Number(n) || 0;
  const p = Math.abs(v).toFixed(2).split('.');
  return (v < 0 ? '-' : '') + (mon === 'USD' ? 'US$' : '$') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + p[1];
}
function hora(ts) { const m = String(ts || '').match(/^(\d{4})-(\d{2})-(\d{2})\D+(\d{2}):(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] + ' ' + m[4] + ':' + m[5] : String(ts || ''); }

function toast(msg, tipo) {
  const el = document.createElement('div');
  el.className = 'toast' + (tipo === 'error' ? ' error' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), tipo === 'error' ? 7000 : 4000);
}

function copiar(texto) {
  const ok = () => toast('Copiado: ' + texto);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok, () => copiarViejo(texto, ok));
  else copiarViejo(texto, ok);
}
function copiarViejo(texto, ok) {
  const t = document.createElement('textarea'); t.value = texto; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); ok(); } catch (e) { toast('No se pudo copiar. Selecciona y copia a mano: ' + texto, 'error'); }
  t.remove();
}

/* ─── Modales ──────────────────────────────────────────────────────────── */
function abrirModal(o) {
  cerrarModal();
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = '<div class="modal ' + (o.ancho ? 'ancho' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(o.titulo) + '">' +
    '<div class="modal-cab"><h2>' + esc(o.titulo) + '</h2><button class="cerrar" aria-label="Cerrar">×</button></div>' +
    '<div class="modal-cuerpo">' + o.cuerpo + '</div><div class="modal-pie">' + (o.pie || '') + '</div></div>';
  velo.addEventListener('mousedown', e => { if (e.target === velo && !o.fijo) cerrarModal(); });
  $('.cerrar', velo).addEventListener('click', cerrarModal);
  $('#modal-root').appendChild(velo);
  const foco = $('input, textarea, select, .btn.principal', velo);
  if (foco) foco.focus();
  return velo;
}
function cerrarModal() { $('#modal-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });

/* ─── Arranque y navegación ────────────────────────────────────────────── */
async function arrancar() {
  $('#v-hoy').innerHTML = '<div class="cargando"><span class="giro"></span>Cargando…</div>';
  const e = await api('getEstadoInicial');
  if (!e.ok) { $('#v-hoy').innerHTML = '<div class="vacio"><b>No se pudo abrir la plataforma</b>' + esc(e.error) + '</div>'; return; }
  S.estado = e;
  $('#yo-correo').textContent = e.usuario.email;
  $('#yo-rol').textContent = 'Rol: ' + e.usuario.rol.toLowerCase();
  $('#version').textContent = 'Versión ' + e.version;
  pintarBanners();
  irA('hoy');
  if (e.inicializado && e.cortes.rep1.cargado && e.cortes.rep9.cargado) cargarCola(true);
}

function pintarBanners() {
  const e = S.estado, b = [];
  if (!e.inicializado) b.push('<div class="banner error"><svg width="18" height="18"><use href="#g-error"/></svg><span>Falta preparar el Maestro. En Apps Script ejecuta <b>inicializarV2</b> una vez y recarga esta página.</span></div>');
  if (e.modoPrueba) b.push('<div class="banner prueba"><span>Modo prueba: los correos llegan a un buzón interno y no consumen avisos reales.' + (e.fechaSimulada ? ' Fecha simulada: ' + dLargaAnio(e.fechaSimulada) + '.' : '') + '</span></div>');
  if (e.usuario.rol === 'SIN_ACCESO') b.push('<div class="banner error"><span>Tu cuenta (' + esc(e.usuario.email) + ') no está en la hoja Usuarios. Pide acceso al administrador.</span></div>');
  else if (e.usuario.abierto) b.push('<div class="banner aviso"><span>La hoja Usuarios está vacía, así que todas las cuentas del dominio tienen rol de administrador. Agrega usuarios con su rol para limitar el acceso.</span></div>');
  if (e.usuario.rol === 'AUDITORIA') b.push('<div class="banner aviso"><span>Tienes acceso de solo lectura.</span></div>');
  $('#banners').innerHTML = b.join('');
}

function irA(v) {
  S.vista = v;
  $$('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.nav === v ? 'page' : 'false'));
  ['hoy', 'cola', 'bitacora', 'ajustes', 'catalogos', 'config'].forEach(id => $('#v-' + id).classList.toggle('oculto', id !== v));
  window.scrollTo(0, 0);
  if (v === 'hoy') pintarHoy();
  if (v === 'cola') pintarCola();
  if (v === 'bitacora') cargarBitacora();
  if (v === 'ajustes') cargarAjustes();
  if (v === 'catalogos') cargarCatalogos();
  if (v === 'config') cargarConfig();
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('button[data-nav]'); if (b) irA(b.dataset.nav); });

async function refrescarEstado() {
  const e = await api('getEstadoInicial');
  if (e.ok) { S.estado = e; pintarBanners(); }
}

function contadores() {
  const set = (id, n, mostrar) => { const el = $('#' + id); el.textContent = n; el.classList.toggle('oculto', !mostrar); };
  const c = S.cola && S.cola.ok ? S.cola.stats.porEnviar : 0;
  set('cuenta-cola', c, c > 0);
  const pend = S.ajustes ? S.ajustes.ajustes.filter(a => a.estado === 'PENDIENTE').length : 0;
  set('cuenta-ajustes', pend, pend > 0);
  const cat = S.catalogos ? S.catalogos.auditoria.sinCorreo.length + S.catalogos.auditoria.sinStp.length + S.catalogos.auditoria.correoInvalido.length : 0;
  set('cuenta-catalogos', cat, cat > 0);
}

/* ═══════════════════════ HOY ═══════════════════════════════════════════════ */
function pintarHoy() {
  const e = S.estado; if (!e) return;
  const t = e.tanda, v = t.ventana;
  let titulo, sub;
  if (!t.esHabil) {
    titulo = 'Hoy es ' + t.motivoInhabil.toLowerCase() + ': no sale ningún aviso.';
    sub = 'La siguiente tanda empieza el ' + dLarga(t.d0) + '.';
  } else if (t.inicioTanda) {
    titulo = 'Hoy toca descargar el Rep1 con vencimientos ' + rangoTxt(v.nominalDesde, v.nominalHasta) + '.';
    const d0 = v.dias[0];
    sub = 'Hoy salen avisos 1 para los pagos del ' + dLarga(d0.aviso1Pago) + ' y avisos 2 para los del ' + dLarga(d0.aviso2Pago) + '. Quien entre tarde a la ventana también recibe su aviso 1.';
  } else {
    titulo = 'Hoy no inicia una tanda nueva.';
    sub = 'Se sigue trabajando con el Rep1 de la tanda en curso' + (t.sinAncla ? '' : '; la siguiente empieza en la fecha que marca el calendario de tandas') + '.';
  }
  const cola = S.cola && S.cola.ok ? resumenColaHTML() : '';
  $('#v-hoy').innerHTML =
    '<header class="cabecera"><p class="fecha">' + dLargaAnio(t.hoy) + '</p><h1>' + esc(titulo) + '</h1><p class="sub">' + esc(sub) + '</p>' +
    (t.esHabil && t.inicioTanda ? '<div class="acciones"><button class="btn" data-copiar="' + dma(v.nominalDesde) + '">Copiar fecha inicial ' + dma(v.nominalDesde) + '</button><button class="btn" data-copiar="' + dma(v.nominalHasta) + '">Copiar fecha final ' + dma(v.nominalHasta) + '</button></div>' : '') +
    '</header>' +
    reglaHTML(t) +
    '<div class="cargas">' + cargaHTML('rep1') + cargaHTML('rep9') + '</div>' + cola;
  enlazarHoy();
  contadores();
}

function reglaHTML(t) {
  const cel = t.linea;
  const ini = cel.findIndex(d => d.enRep1), fin = cel.length - 1 - cel.slice().reverse().findIndex(d => d.enRep1);
  let prevMes = -1;
  const celdas = cel.map(d => {
    const m = Number(d.fecha.slice(5, 7)) - 1;
    const mes = (m !== prevMes) ? MES[m] : '';
    prevMes = m;
    let extra = '';
    if (d.aviso1) extra += '<span class="bandera a1">Aviso 1 hoy</span>';
    if (d.aviso2) extra += '<span class="bandera a2">Aviso 2 hoy</span>';
    let pie = '';
    if (d.esHoy) pie = '<span class="hoy-etq">Hoy</span>';
    else if (!d.habil) pie = '<span class="etq-inhabil">' + esc(d.motivo) + '</span>';
    else if (d.idx > 0) pie = '<span class="cuenta-dia" title="Día hábil ' + d.idx + ' contando desde hoy">' + d.idx + '</span>';
    return '<div class="dia ' + (d.habil ? '' : 'inhabil ') + (d.esHoy ? 'hoy' : '') + '">' + extra +
      '<span class="dow">' + DOW[d.dow] + '</span><span class="dnum">' + Number(d.fecha.slice(8)) + '</span><span class="mes">' + mes + '</span>' + pie + '</div>';
  }).join('');
  const barra = cel.map((d, i) => '<i class="' + (d.enRep1 ? 'on ' : '') + (i === ini ? 'ini ' : '') + (i === fin ? 'fin' : '') + '"></i>').join('');
  const v = t.ventana;
  return '<div class="regla-marco"><div class="regla" role="img" aria-label="Línea de tiempo de días hábiles">' + celdas + '</div>' +
    '<div class="regla-barra" aria-hidden="true">' + barra + '</div>' +
    '<div class="regla-leyenda"><span><b>Rep1:</b> vencimientos ' + rangoTxt(v.nominalDesde, v.nominalHasta) + '</span>' +
    '<span>El número cuenta días hábiles hasta el pago.</span>' +
    '<span>Un vencimiento en día inhábil se paga y se avisa el siguiente día hábil.</span></div></div>';
}

function vigenciaHTML(c) {
  if (!c || !c.cargado) return '<span class="vigencia vacio">Sin cargar</span>';
  if (c.ok) return '<span class="vigencia ok">' + (c.edad === 0 ? 'De hoy' : 'De hace ' + pl(c.edad, 'día hábil', 'días hábiles') + ', aún vigente') + '</span>';
  return '<span class="vigencia vencido">Vencido: tiene ' + pl(c.edad, 'día hábil', 'días hábiles') + ' (máximo ' + c.max + ')</span>';
}

function cargaHTML(tipo) {
  const e = S.estado, t = e.tanda, v = t.ventana, c = e.cortes[tipo], sub = S.subida[tipo];
  const esR1 = tipo === 'rep1';
  const guia = esR1
    ? '<div class="filtro-reporte">En el reporte, filtra <b>Fecha Vencimiento</b> del <b>' + dma(v.nominalDesde) + '</b> al <b>' + dma(v.nominalHasta) + '</b>.</div>'
    : '<div class="filtro-reporte">Descárgalo <b>con corte de hoy</b> y con todas las líneas, en pesos y en dólares.</div>';
  const corte = c && c.cargado
    ? '<dl class="corte"><dt>Vigencia</dt><dd>' + vigenciaHTML(c) + '</dd><dt>Cargado</dt><dd class="num">' + hora(c.fechaHora) + ' por ' + esc(c.usuario) + '</dd><dt>Filas</dt><dd class="num">' + c.filas + '</dd>' +
      (c.rango ? '<dt>Rango declarado</dt><dd>' + esc(c.rango) + '</dd>' : '') + (c.archivo ? '<dt>Archivo</dt><dd>' + esc(c.archivo) + '</dd>' : '') + '</dl>'
    : '<dl class="corte"><dt>Vigencia</dt><dd>' + vigenciaHTML(null) + '</dd></dl>';
  const deshab = !can('cargar');
  const zona = '<div class="zona" data-zona="' + tipo + '" tabindex="0" role="button" ' + (deshab ? 'aria-disabled="true"' : '') + '><strong>' +
    (c && c.cargado ? 'Cargar un ' + (esR1 ? 'Rep1' : 'Rep9') + ' nuevo' : 'Arrastra el ' + (esR1 ? 'Rep1' : 'Rep9') + ' aquí') + '</strong>o haz clic para elegir el archivo (.xlsx o .xls)</div>' +
    '<input type="file" accept=".xlsx,.xls" hidden data-archivo="' + tipo + '">';
  return '<div class="carga"><h2>' + (esR1 ? 'Rep1: vencimientos' : 'Rep9: saldos') + '</h2>' +
    '<p class="que">' + (esR1 ? 'Las cuotas que vencen en la ventana de la tanda.' : 'Saldos, intereses y moratorios de toda la cartera.') + '</p>' +
    guia + corte + (deshab ? '' : zona) + validacionHTML(tipo, sub) + '</div>';
}

function notasHTML(avisos) {
  if (!avisos || !avisos.length) return '';
  return '<ul class="notas">' + avisos.map(a => '<li><svg><use href="#g-' + (a.nivel === 'warn' ? 'warn' : 'info') + '"/></svg><span>' + esc(a.texto) + '</span></li>').join('') + '</ul>';
}

function validacionHTML(tipo, sub) {
  if (!sub) return '';
  if (sub.estado === 'procesando') return '<div class="validacion"><span class="giro"></span>Leyendo ' + esc(sub.archivo) + '…</div>';
  if (sub.estado === 'guardando') return '<div class="validacion"><span class="giro"></span>Guardando…</div>';
  const v = sub.val;
  if (sub.estado === 'error' || !v || !v.ok) {
    return '<div class="validacion"><h3>No se pudo usar ' + esc(sub.archivo) + '</h3><ul class="notas"><li><svg><use href="#g-error"/></svg><span>' + esc((v && v.error) || sub.error) + '</span></li>' +
      ((v && v.mismatches) || []).slice(0, 6).map(m => '<li><svg></svg><span>' + esc(m) + '</span></li>').join('') + '</ul></div>';
  }
  const esR1 = tipo === 'rep1';
  let cuerpo = '<p><b class="num">' + v.filas + '</b> ' + (esR1 ? 'cuotas' : 'líneas') + ' leídas. Control: <span class="num">' + dinero(v.control) + '</span> ' + (esR1 ? 'de importe' : 'de saldo total') + '.</p>';
  if (esR1) {
    cuerpo += '<div class="fechas-rep1">' + v.porFecha.map(f => '<span class="' + (f.fecha >= v.requerido.desde && f.fecha <= v.requerido.hasta ? 'dentro' : '') + (f.habil ? '' : ' finde') + '">' + dCorta(f.fecha) + ': ' + f.n + '</span>').join('') + '</div>';
  }
  const texto = esR1
    ? 'Descargué el Rep1 con vencimientos del ' + dma(v.requerido.desde) + ' al ' + dma(v.requerido.hasta) + '.'
    : 'Este Rep9 tiene corte de hoy.';
  return '<div class="validacion"><h3>Revisión de ' + esc(sub.archivo) + '</h3>' + cuerpo + notasHTML(v.avisos) +
    '<label class="confirma"><input type="checkbox" data-confirma="' + tipo + '"' + (sub.confirmado ? ' checked' : '') + '><span>' + esc(texto) + '</span></label>' +
    '<div class="acciones" style="margin-top:0"><button class="btn principal" data-guardar="' + tipo + '"' + (sub.confirmado ? '' : ' disabled') + '>Guardar ' + (esR1 ? 'Rep1' : 'Rep9') + '</button>' +
    '<button class="btn texto" data-descartar="' + tipo + '">Descartar</button></div></div>';
}

function enlazarHoy() {
  const raiz = $('#v-hoy');
  $$('[data-copiar]', raiz).forEach(b => b.addEventListener('click', () => copiar(b.dataset.copiar)));
  $$('[data-zona]', raiz).forEach(z => {
    const tipo = z.dataset.zona, input = $('[data-archivo="' + tipo + '"]', raiz);
    z.addEventListener('click', () => input.click());
    z.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('arrastre'); });
    z.addEventListener('dragleave', () => z.classList.remove('arrastre'));
    z.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('arrastre'); if (e.dataTransfer.files[0]) recibirArchivo(tipo, e.dataTransfer.files[0]); });
    input.addEventListener('change', () => { if (input.files[0]) recibirArchivo(tipo, input.files[0]); input.value = ''; });
  });
  $$('[data-confirma]', raiz).forEach(c => c.addEventListener('change', () => { S.subida[c.dataset.confirma].confirmado = c.checked; $('[data-guardar="' + c.dataset.confirma + '"]', raiz).disabled = !c.checked; }));
  $$('[data-guardar]', raiz).forEach(b => b.addEventListener('click', () => guardarSubida(b.dataset.guardar)));
  $$('[data-descartar]', raiz).forEach(b => b.addEventListener('click', () => { S.subida[b.dataset.descartar] = null; pintarHoy(); }));
  const ir = $('[data-ir-cola]', raiz); if (ir) ir.addEventListener('click', () => irA('cola'));
}

function parseXlsx(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
        const iso = (y, m, d) => y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0') + 'T12:00:00';
        resolve(rows.map(row => row.map(cell => {
          if (cell instanceof Date) { const c = new Date(cell.getTime() + 12 * 3600 * 1000); return iso(c.getFullYear(), c.getMonth() + 1, c.getDate()); }
          if (typeof cell === 'string') {
            const m = cell.trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
            if (m) {   // el reporte trae mes/día/año: el primer número es el MES
              let y = parseInt(m[3], 10); if (y < 100) y += 2000;
              return iso(y, parseInt(m[1], 10), parseInt(m[2], 10));
            }
          }
          return cell;
        })));
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('No se pudo leer el archivo.'));
    reader.readAsArrayBuffer(file);
  });
}

async function recibirArchivo(tipo, file) {
  if (!/\.(xlsx|xls)$/i.test(file.name)) { S.subida[tipo] = { estado: 'error', archivo: file.name, error: 'Formato no válido. Usa un archivo .xlsx o .xls.' }; pintarHoy(); return; }
  S.subida[tipo] = { estado: 'procesando', archivo: file.name }; pintarHoy();
  try {
    const rows = await parseXlsx(file);
    const val = await api('validarReporte', tipo, rows, { archivo: file.name });
    S.subida[tipo] = { estado: val.ok ? 'validado' : 'error', archivo: file.name, rows: rows, val: val, confirmado: false, error: val.error };
  } catch (err) { S.subida[tipo] = { estado: 'error', archivo: file.name, error: err.message }; }
  pintarHoy();
}

async function guardarSubida(tipo) {
  const sub = S.subida[tipo]; if (!sub || !sub.confirmado) return;
  const v = sub.val, meta = { archivo: sub.archivo };
  if (tipo === 'rep1') { meta.rangoDesde = v.requerido.desde; meta.rangoHasta = v.requerido.hasta; }
  sub.estado = 'guardando'; pintarHoy();
  const r = await api('guardarReporte', tipo, sub.rows, meta);
  if (!r.ok) { S.subida[tipo] = { estado: 'error', archivo: sub.archivo, error: r.error }; pintarHoy(); return; }
  S.subida[tipo] = null;
  toast((tipo === 'rep1' ? 'Rep1' : 'Rep9') + ' guardado: ' + r.filas + ' filas.');
  await refrescarEstado();
  S.sel.clear();
  if (S.estado.cortes.rep1.cargado && S.estado.cortes.rep9.cargado) await cargarCola(true); else pintarHoy();
}

/* ─── Resumen de la cola (en Hoy) ──────────────────────────────────────── */
function barraEstados(stats) {
  const total = stats.total || 1;
  const seg = ORDEN_ESTADOS.filter(k => stats.porEstado[k]).map(k => '<span class="e-' + k + '" style="width:' + (stats.porEstado[k] / total * 100) + '%" title="' + ETIQUETA[k] + ': ' + stats.porEstado[k] + '"></span>').join('');
  const ley = ORDEN_ESTADOS.filter(k => stats.porEstado[k]).map(k => '<div><i class="sw e-' + k + '"></i>' + ETIQUETA[k] + ' <b>' + stats.porEstado[k] + '</b></div>').join('');
  return '<div class="apilada" role="img" aria-label="Distribución de la cola por estado">' + seg + '</div><div class="leyenda">' + ley + '</div>';
}

function resumenColaHTML() {
  const c = S.cola, st = c.stats;
  const frescos = c.frescura.rep1.ok && c.frescura.rep9.ok;
  const lectura = st.porEnviar
    ? pl(st.porEnviar, 'aviso por enviar', 'avisos por enviar') + ' hoy: ' + st.aviso1 + ' de aviso 1 y ' + st.aviso2 + ' de aviso 2.' + (st.sumaMXN ? ' ' + dinero(st.sumaMXN) + ' MXN' : '') + (st.sumaUSD ? ' y ' + dinero(st.sumaUSD, 'USD') : '') + ' en total.'
    : 'Hoy no hay avisos por enviar con los reportes cargados.';
  const aviso = frescos ? '' : '<p class="lectura" style="color:var(--ladrillo);margin-top:8px"><b>Hay un reporte vencido:</b> las cuotas por enviar quedan bloqueadas hasta cargar uno nuevo.</p>';
  return '<div class="cola-resumen"><h2>La cola de hoy</h2><p class="lectura">' + esc(lectura) + '</p>' + aviso + barraEstados(st) +
    '<div class="acciones"><button class="btn principal" data-ir-cola>Revisar la cola</button></div></div>';
}

async function cargarCola(silencioso) {
  S.cargandoCola = true;
  const c = await api('getCola');
  S.cargandoCola = false;
  S.cola = c;
  if (!c.ok && !silencioso) toast(c.error, 'error');
  const llaves = new Set(c.ok ? c.items.map(i => i.key) : []);
  S.sel.forEach(k => { if (!llaves.has(k)) S.sel.delete(k); });
  contadores();
  if (S.vista === 'hoy') pintarHoy();
  if (S.vista === 'cola') pintarCola();
}

/* ═══════════════════════ COLA ══════════════════════════════════════════════ */
const FILTROS = [
  ['enviar', 'Por enviar', i => !!i.accion], ['LISTA', 'Listas', i => i.estado === 'LISTA'],
  ['REVISAR', 'Por revisar', i => i.estado === 'REVISAR'], ['BLOQUEADA', 'Bloqueadas', i => i.estado === 'BLOQUEADA'],
  ['proximas', 'Próximas', i => i.estado === 'PROGRAMADA' || i.estado === 'ESPERA_VISPERA'], ['hechas', 'Completas', i => i.estado === 'COMPLETA'],
  ['fuera', 'Vencen hoy o vencidas', i => i.estado === 'VENCE_HOY' || i.estado === 'VENCIDA'], ['todas', 'Todas', () => true]
];

function visibles() {
  const f = FILTROS.find(x => x[0] === S.filtro) || FILTROS[0];
  const q = S.busqueda.trim().toLowerCase();
  return S.cola.items.filter(f[2]).filter(i => !q || (i.linea + ' ' + i.cliente).toLowerCase().indexOf(q) >= 0);
}

function pintarCola() {
  const raiz = $('#v-cola');
  if (!S.cola) {
    raiz.innerHTML = '<header class="cabecera"><h2>Cola de envío</h2></header><div class="cargando"><span class="giro"></span>Calculando la cola…</div>';
    if (!S.cargandoCola && S.estado && S.estado.inicializado) cargarCola(true);
    return;
  }
  if (!S.cola.ok) {
    raiz.innerHTML = '<header class="cabecera"><h2>Cola de envío</h2></header><div class="tabla-marco"><div class="vacio"><b>Todavía no hay cola</b>' + esc(S.cola.error) + '<div class="acciones" style="justify-content:center"><button class="btn principal" data-ir-hoy>Ir a Hoy y cargar los reportes</button></div></div></div>';
    $('[data-ir-hoy]', raiz).addEventListener('click', () => irA('hoy'));
    return;
  }
  const c = S.cola, items = visibles();
  const cuentas = {}; FILTROS.forEach(f => cuentas[f[0]] = c.items.filter(f[2]).length);
  const pills = FILTROS.filter(f => f[0] === 'todas' || cuentas[f[0]] > 0 || f[0] === S.filtro).map(f => '<button aria-pressed="' + (S.filtro === f[0]) + '" data-filtro="' + f[0] + '">' + f[1] + '<b>' + cuentas[f[0]] + '</b></button>').join('');
  const r1 = c.frescura.rep1.corte, r9 = c.frescura.rep9.corte;
  const listasVis = items.filter(i => i.estado === 'LISTA'), todasSel = listasVis.length > 0 && listasVis.every(i => S.sel.has(i.key));
  raiz.innerHTML =
    '<header class="cabecera"><p class="fecha">' + dLargaAnio(c.hoy) + '</p><h2>Cola de envío</h2>' +
    '<p class="sub">Rep1 cargado el ' + hora(r1.fechaHora) + ' y Rep9 el ' + hora(r9.fechaHora) + '. Toca una fila para ver cómo se calculó el monto.</p></header>' +
    '<div class="herramientas"><div class="filtros">' + pills + '</div><input class="buscar" type="search" placeholder="Buscar por línea o cliente" value="' + esc(S.busqueda) + '" aria-label="Buscar"></div>' +
    '<div class="tabla-marco"><table><thead><tr><th><input type="checkbox" id="chk-todas" ' + (todasSel ? 'checked ' : '') + (listasVis.length ? '' : 'disabled ') + 'aria-label="Seleccionar las listas visibles"></th><th>Estado</th><th>Cliente</th><th>Pago</th><th class="der">Hábiles</th><th>Aviso</th><th class="der">Total</th><th>Notas</th><th></th></tr></thead><tbody id="cuerpo-cola">' +
    (items.length ? items.map(filaHTML).join('') : '<tr><td colspan="9"><div class="vacio"><b>Nada en este filtro</b>Cambia de filtro o borra la búsqueda.</div></td></tr>') +
    '</tbody></table></div><div id="barra-envio-slot"></div>';
  enlazarCola(items);
  pintarBarraEnvio();
}

function filaHTML(i) {
  const sel = S.sel.has(i.key), abierta = S.abiertas.has(i.key);
  const elegible = !!i.accion && i.estado !== 'BLOQUEADA';
  const aviso = i.accion === 'PREVENTIVO' ? '<span class="chip aviso1">Aviso 1</span>' : i.accion === 'VISPERA' ? '<span class="chip aviso2">Aviso 2</span>'
    : i.programadaPara ? '<span class="chip">' + (i.estado === 'ESPERA_VISPERA' ? 'Aviso 2 el ' : 'Aviso 1 el ') + dCorta(i.programadaPara) + '</span>' : '';
  const notas = i.bloqueos.map(b => '<span class="chip bloq" title="' + esc(b.texto) + '">' + esc(textoCorto(b.codigo)) + '</span>')
    .concat(i.alertas.filter(a => a.nivel === 'warn').map(a => '<span class="chip warn" title="' + esc(a.texto) + '">' + esc(textoCorto(a.codigo)) + '</span>'))
    .concat(i.alertas.filter(a => a.nivel !== 'warn' && ['CON_AJUSTES', 'MONTO_CAMBIO'].indexOf(a.codigo) >= 0).map(a => '<span class="chip" title="' + esc(a.texto) + '">' + esc(textoCorto(a.codigo)) + '</span>')).join('');
  let h = '<tr class="fila" data-key="' + esc(i.key) + '"><td><input type="checkbox" data-sel ' + (sel ? 'checked' : '') + (elegible && can('enviar') ? '' : ' disabled') + ' aria-label="Seleccionar"></td>' +
    '<td><span class="estado"><svg><use href="#g-' + i.estado + '"/></svg>' + ETIQUETA[i.estado] + '</span></td>' +
    '<td class="cliente"><b title="' + esc(i.cliente) + '">' + esc(i.cliente) + '</b><small>Línea ' + esc(i.linea) + (i.multiCuota ? ' · varias cuotas' : '') + '</small></td>' +
    '<td class="pago num">' + dCorta(i.fechaPago) + (i.fechaPago !== i.fechaNominal ? '<small>vence ' + dCorta(i.fechaNominal) + '</small>' : '') + '</td>' +
    '<td class="der num">' + i.diasHabiles + '</td><td>' + aviso + '</td>' +
    '<td class="der monto num">' + dinero(i.total, i.moneda) + '<small>' + i.moneda + '</small></td><td>' + notas + '</td>' +
    '<td style="white-space:nowrap"><button class="btn chico" data-ver>Correo</button></td></tr>';
  if (abierta) h += detalleHTML(i);
  return h;
}

function textoCorto(c) {
  return ({ SIN_CORREO: 'Sin correo', SIN_STP: 'Sin cuenta STP', REP1_VENCIDO: 'Rep1 vencido', REP9_VENCIDO: 'Rep9 vencido', MONEDA_DISTINTA: 'Moneda distinta',
    AJUSTE_PENDIENTE: 'Ajuste por aprobar', SIN_REP9: 'Sin Rep9', SIN_TASA: 'Sin tasa', TASA_DUPLICADA: 'Tasa repetida', CONTACTO_DUPLICADO: 'Correo repetido',
    IMPORTE_NO_CUADRA: 'Importe no cuadra', CON_AJUSTES: 'Con ajustes', MONTO_CAMBIO: 'Monto cambió', VENCIDO_EN_PRIMERA: 'Vencido en otra cuota' })[c] || c;
}

function detalleHTML(i) {
  const d = i.desglose, m = i.moneda;
  const fila = (t, v, cls) => v || cls === 'sub' ? '<tr class="' + (cls || '') + '"><td>' + t + '</td><td>' + dinero(v, m) + '</td></tr>' : '';
  const tasa = i.tasaMoratoria ? (i.tasaMoratoria * 100).toFixed(2).replace(/\.?0+$/, '') + '% anual' : 'sin tasa';
  const nota = d.moratoriosProy
    ? 'Moratorios proyectados = capital vencido × tasa moratoria (' + tasa + ', el doble de la del contrato) ÷ 360 × ' + i.diasProy + ' ' + (i.diasProy === 1 ? 'día' : 'días') + ', desde el corte del Rep9 hasta el vencimiento.'
    : (d.capVencido ? 'Hay capital vencido pero no se proyectan moratorios: ' + (i.sinTasa ? 'falta la tasa en el catálogo.' : 'el vencimiento es el mismo día del corte.') : 'No hay capital vencido, así que no se proyectan moratorios.');
  const hist = [];
  if (i.previo) hist.push('Aviso 1 enviado el ' + dCorta(i.previo.fechaKey) + ' por ' + dinero(i.previo.total, m) + '.');
  if (i.vispera) hist.push('Aviso 2 enviado el ' + dCorta(i.vispera.fechaKey) + '.');
  if (i.reenvios) hist.push(pl(i.reenvios, 'reenvío', 'reenvíos') + '.');
  if (i.nota) hist.push(i.nota);
  const lineas = i.bloqueos.map(b => '<li><svg><use href="#g-error"/></svg><span>' + esc(b.texto) + '</span></li>')
    .concat(i.alertas.map(a => '<li><svg><use href="#g-' + (a.nivel === 'warn' ? 'warn' : 'info') + '"/></svg><span>' + esc(a.texto) + '</span></li>'))
    .concat(hist.map(t => '<li><svg><use href="#g-info"/></svg><span>' + esc(t) + '</span></li>')).join('');
  const aj = i.ajustes.map(a => '<li><svg><use href="#g-info"/></svg><span>Ajuste ' + esc(a.tipo.toLowerCase().replace('_', ' ')) + ' de ' + dinero(a.monto, m) + ': ' + esc(a.motivo) + ' (' + esc(a.usuario) + ').</span></li>').join('');
  return '<tr class="detalle"><td colspan="9"><div class="detalle-grid"><div><h3>Cómo se calculó</h3><table class="desglose"><tbody>' +
    fila('Capital', d.capital, 'menor') + fila('Intereses', d.intereses, 'menor') + fila('Otros', d.otros, 'menor') + fila('IVA', d.iva, 'menor') + fila('Cuota del Rep1', d.cuota, 'sub') +
    fila('Capital vencido', d.capVencido) + fila('Intereses vencidos con IVA', d.intVencidos) + fila('Moratorios acumulados con IVA', d.moratoriosAcum) +
    fila('Moratorios proyectados', d.moratoriosProy) + fila('Ajustes de saldo', d.ajustes) + fila('Total a pagar', d.total, 'sub') +
    '</tbody></table><p class="nota-calculo">' + esc(nota) + '</p></div><div><h3>Qué hay que saber</h3>' +
    (lineas || aj ? '<ul class="notas">' + lineas + aj + '</ul>' : '<p>Sin observaciones.</p>') +
    '<div class="acciones">' + (can('ajustar') ? '<button class="btn chico" data-ajustar>Ajustar saldo</button>' : '') +
    (can('enviar') && i.diasHabiles >= 0 && !i.bloqueos.length ? '<button class="btn chico" data-reenviar>Reenviar aviso</button>' : '') +
    (can('enviar') && i.accion && i.estado !== 'BLOQUEADA' ? '<button class="btn chico principal" data-enviar-uno>Enviar ahora</button>' : '') + '</div></div></div></td></tr>';
}

function enlazarCola() {
  const raiz = $('#v-cola');
  $$('[data-filtro]', raiz).forEach(b => b.addEventListener('click', () => { S.filtro = b.dataset.filtro; pintarCola(); }));
  const buscar = $('.buscar', raiz);
  buscar.addEventListener('input', () => {
    S.busqueda = buscar.value; const pos = buscar.selectionStart;
    pintarCola(); const nb = $('.buscar', $('#v-cola')); nb.focus(); nb.setSelectionRange(pos, pos);
  });
  $('#chk-todas').addEventListener('change', e => {
    visibles().filter(i => i.estado === 'LISTA').forEach(i => e.target.checked ? S.sel.add(i.key) : S.sel.delete(i.key));
    pintarCola();
  });
  $('#cuerpo-cola').addEventListener('click', e => {
    const tr = e.target.closest('tr.fila'); if (!tr) { const d = e.target.closest('tr.detalle'); if (d) accionDetalle(e, d.previousElementSibling.dataset.key); return; }
    const key = tr.dataset.key;
    if (e.target.matches('[data-sel]')) { e.target.checked ? S.sel.add(key) : S.sel.delete(key); pintarBarraEnvio(); return; }
    if (e.target.closest('[data-ver]')) { abrirVistaPrevia(key); return; }
    S.abiertas.has(key) ? S.abiertas.delete(key) : S.abiertas.add(key); pintarCola();
  });
}

function accionDetalle(e, key) {
  if (e.target.closest('[data-ajustar]')) abrirAjuste(key);
  else if (e.target.closest('[data-reenviar]')) abrirReenvio(key);
  else if (e.target.closest('[data-enviar-uno]')) confirmarEnvio([key]);
}

function pintarBarraEnvio() {
  const slot = $('#barra-envio-slot'); if (!slot) return;
  const sel = S.cola.items.filter(i => S.sel.has(i.key));
  if (!sel.length) { slot.innerHTML = ''; return; }
  const sum = mon => sel.filter(i => i.moneda === mon).reduce((s, i) => s + i.total, 0);
  const rev = sel.filter(i => i.estado === 'REVISAR').length;
  slot.innerHTML = '<div class="barra-envio"><span class="resumen">' + pl(sel.length, 'aviso seleccionado', 'avisos seleccionados') +
    '<small class="num">' + (sum('MXN') ? dinero(sum('MXN')) + ' MXN' : '') + (sum('USD') ? ' ' + dinero(sum('USD'), 'USD') : '') + (rev ? ' · ' + pl(rev, 'con alertas', 'con alertas') : '') + '</small></span>' +
    '<button class="btn texto" style="color:#fff" data-limpiar>Quitar selección</button><button class="btn principal" data-enviar-sel>Enviar ' + sel.length + '</button></div>';
  $('[data-limpiar]', slot).addEventListener('click', () => { S.sel.clear(); pintarCola(); });
  $('[data-enviar-sel]', slot).addEventListener('click', () => confirmarEnvio(sel.map(i => i.key)));
}

/* ─── Vista previa, envío y reenvío ────────────────────────────────────── */
async function abrirVistaPrevia(key) {
  const velo = abrirModal({ titulo: 'Vista previa del correo', ancho: true, cuerpo: '<div class="cargando"><span class="giro"></span>Armando el correo…</div>', pie: '<button class="btn" data-cerrar>Cerrar</button>' });
  $('[data-cerrar]', velo).addEventListener('click', cerrarModal);
  const p = await api('previsualizarAviso', key);
  if (!p.ok) { $('.modal-cuerpo', velo).innerHTML = '<p>' + esc(p.error) + '</p>'; return; }
  const it = p.item, puedeEnviar = can('enviar') && it.accion && it.estado !== 'BLOQUEADA';
  $('.modal-cuerpo', velo).innerHTML = '<dl class="meta-correo"><dt>Asunto</dt><dd>' + esc(p.asunto) + '</dd><dt>Para</dt><dd>' + esc(p.para.join(', ') || '—') + '</dd>' +
    (p.cc ? '<dt>Con copia</dt><dd>' + esc(p.cc) + '</dd>' : '') + '<dt>Responder a</dt><dd>' + esc(p.responderA) + '</dd>' +
    (p.pruebaDestino ? '<dt>Modo prueba</dt><dd>Llegará a ' + esc(p.pruebaDestino) + ', no al cliente.</dd>' : '') + '</dl><iframe class="marco-correo" sandbox title="Correo"></iframe>';
  $('.marco-correo', velo).srcdoc = p.html;
  $('.modal-pie', velo).innerHTML = '<button class="btn" data-cerrar>Cerrar</button>' + (puedeEnviar ? '<button class="btn principal" data-enviar>Enviar este aviso</button>' : '');
  $('[data-cerrar]', velo).addEventListener('click', cerrarModal);
  const be = $('[data-enviar]', velo); if (be) be.addEventListener('click', () => confirmarEnvio([key]));
}

function confirmarEnvio(keys) {
  const items = keys.map(k => S.cola.items.find(i => i.key === k)).filter(Boolean);
  const rev = items.filter(i => i.estado === 'REVISAR');
  const a1 = items.filter(i => i.accion === 'PREVENTIVO').length, a2 = items.filter(i => i.accion === 'VISPERA').length;
  const sum = mon => items.filter(i => i.moneda === mon).reduce((s, i) => s + i.total, 0);
  const prueba = S.estado.modoPrueba;
  const velo = abrirModal({
    titulo: 'Enviar ' + pl(items.length, 'aviso', 'avisos'),
    cuerpo: '<p>' + (a1 ? pl(a1, 'aviso 1', 'avisos 1') : '') + (a1 && a2 ? ' y ' : '') + (a2 ? pl(a2, 'aviso 2', 'avisos 2') : '') + ' por <b class="num">' + (sum('MXN') ? dinero(sum('MXN')) + ' MXN' : '') + (sum('USD') ? ' ' + dinero(sum('USD'), 'USD') : '') + '</b>.</p>' +
      (prueba ? '<p style="margin-top:8px"><b>Modo prueba:</b> los correos llegan a un buzón interno, no a los clientes.</p>' : '<p style="margin-top:8px">Los correos saldrán a los clientes y a la copia fija configurada.</p>') +
      '<ul class="lista-res">' + items.slice(0, 6).map(i => '<li>' + esc(i.cliente) + ' <span class="num">' + dinero(i.total, i.moneda) + '</span>' + (i.estado === 'REVISAR' ? ' <span class="chip warn">con alertas</span>' : '') + '</li>').join('') + (items.length > 6 ? '<li>y ' + (items.length - 6) + ' más…</li>' : '') + '</ul>' +
      (rev.length ? '<label class="confirma"><input type="checkbox" id="ok-revision"><span>Revisé las alertas de ' + pl(rev.length, 'cuota', 'cuotas') + ' y quiero enviarlas.</span></label>' : ''),
    pie: '<button class="btn" data-cerrar>Cancelar</button><button class="btn principal" data-ir' + (rev.length ? ' disabled' : '') + '>Enviar ' + items.length + '</button>'
  });
  $('[data-cerrar]', velo).addEventListener('click', cerrarModal);
  const ir = $('[data-ir]', velo);
  const chk = $('#ok-revision', velo); if (chk) chk.addEventListener('change', () => { ir.disabled = !chk.checked; });
  ir.addEventListener('click', () => enviarLote(keys, !!chk && chk.checked));
}

async function enviarLote(keys, confirmarRevision) {
  const TAM = 12, total = keys.length;
  const velo = abrirModal({ titulo: 'Enviando avisos', fijo: true, cuerpo: '<p id="env-txt">Preparando…</p><div class="progreso"><i id="env-barra" style="width:0%"></i></div>', pie: '' });
  const acum = { enviados: 0, errores: 0, omitidos: 0, resultados: [], pendientes: [] };
  let hechos = 0, fallo = '';
  for (let i = 0; i < keys.length; i += TAM) {
    const bloque = keys.slice(i, i + TAM);
    $('#env-txt', velo).textContent = 'Enviando ' + Math.min(i + TAM, total) + ' de ' + total + '…';
    const r = await api('enviarAvisos', bloque, { confirmarRevision: confirmarRevision });
    if (!r.ok) { fallo = r.error; acum.pendientes = acum.pendientes.concat(keys.slice(i)); break; }
    acum.enviados += r.enviados; acum.errores += r.errores; acum.omitidos += r.omitidos;
    acum.resultados = acum.resultados.concat(r.resultados); acum.pendientes = acum.pendientes.concat(r.pendientes || []);
    if (r.pendientes && r.pendientes.length) { acum.pendientes = acum.pendientes.concat(keys.slice(i + TAM)); break; }
    hechos = Math.min(i + TAM, total);
    $('#env-barra', velo).style.width = (hechos / total * 100) + '%';
  }
  S.sel.clear();
  if (S.estado.chatConfigurado && acum.enviados + acum.errores > 0) {
    const bloq = S.cola.items.filter(i => i.estado === 'BLOQUEADA' || i.estado === 'REVISAR').length;
    api('resumenEnChat', acum, bloq);
  }
  await cargarCola(true);
  mostrarResultadoEnvio(acum, fallo);
}

function mostrarResultadoEnvio(r, fallo) {
  const problemas = r.resultados.filter(x => !x.ok);
  const velo = abrirModal({
    titulo: 'Resultado del envío',
    cuerpo: '<div class="conteos"><div><b class="num">' + r.enviados + '</b><span>enviados</span></div>' + (r.errores ? '<div><b class="num" style="color:var(--ladrillo)">' + r.errores + '</b><span>con error</span></div>' : '') +
      (r.omitidos ? '<div><b class="num">' + r.omitidos + '</b><span>omitidos</span></div>' : '') + (r.pendientes.length ? '<div><b class="num">' + r.pendientes.length + '</b><span>sin enviar</span></div>' : '') + '</div>' +
      (fallo ? '<p style="margin-top:12px;color:var(--ladrillo)">' + esc(fallo) + '</p>' : '') +
      (r.pendientes.length && !fallo ? '<p style="margin-top:12px">Se agotó el tiempo o la cuota diaria de Google. Vuelve a enviar: lo ya enviado no se repite.</p>' : '') +

    (regs.length ? regs.map(r => '<tr><td class="num">' + hora(r.timestamp) + '</td><td class="cliente"><b title="' + esc(r.cliente) + '">' + esc(r.cliente) + '</b><small>Línea ' + esc(r.linea) + '</small></td>' +
      '<td style="white-space:nowrap">' + esc(({ PREVENTIVO: 'Aviso 1', VISPERA: 'Aviso 2', REENVIO: 'Reenvío', 'T-5': 'Aviso 1', 'T-1': 'Aviso 2', 'T+0': 'Aviso 2' })[r.tipo] || r.tipo) + '</td>' +
      '<td class="num">' + (r.pagoEfectivo ? dCorta(r.pagoEfectivo) : (r.fechaVenc ? dCorta(r.fechaVenc) : '')) + '</td><td class="der monto num">' + dinero(r.total, r.moneda) + '</td><td>' + chipStatus(r.status) + '</td>' +
      '<td>' + esc(r.usuario) + '<small style="display:block;color:var(--gris-500)">' + esc(r.origen) + '</small></td><td style="max-width:280px">' + esc(r.mensaje) + '</td>' +
      '<td>' + (r.status === 'ENVIADO' && can('enviar') ? '<button class="btn chico" data-reenv="' + esc(r.linea + '|' + r.fechaVenc) + '">Reenviar</button>' : '') + '</td></tr>').join('')

    $$('[data-clave]', raiz).forEach(inp => inp.addEventListener('change', async () => {
      const r = await api('setConfig', inp.dataset.clave, inp.value);
      if (!r.ok) { toast(r.error, 'error'); cargarConfig(); return; }
      toast(inp.dataset.clave + ' actualizado.'); await refrescarEstado(); if (S.cola) cargarCola(true);
    }));
    q('#inh-g').addEventListener('click', async () => { const r = await api('guardarInhabil', q('#inh-f').value, q('#inh-d').value, q('#inh-e').value); if (!r.ok) toast(r.error, 'error'); else { toast('Calendario actualizado.'); await refrescarEstado(); cargarConfig(); } });
  }
}

document.addEventListener('DOMContentLoaded', arrancar);
if (document.readyState !== 'loading') arrancar();
</script>
