<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap');

/* ─── Tokens ─────────────────────────────────────────────────────────────
   Paleta institucional de Cualli: amarillo y grises, nada más. El rojo ladrillo
   se reserva para lo que no se puede enviar o salió mal. El amarillo marca
   dónde está "hoy" y cuál es la acción principal de cada pantalla. */
:root {
  --amarillo: #FDB913;
  --amarillo-fuerte: #E5A300;
  --amarillo-suave: #FFF3CF;
  --amarillo-tinta: #6B4A00;
  --grafito: #262626;
  --gris: #515151;
  --gris-600: #6B6B6B;
  --gris-400: #A0A0A0;
  --gris-300: #C8C8C8;
  --gris-200: #E2E2E2;
  --gris-100: #EEEEEE;
  --fondo: #F3F3F3;
  --blanco: #FFFFFF;
  --ladrillo: #B3261E;
  --ladrillo-suave: #FBEAE8;
  --f-display: 'Poppins', 'IBM Plex Sans', sans-serif;
  --f-texto: 'IBM Plex Sans', 'Segoe UI', sans-serif;
  --r: 12px;
  --r-chico: 8px;
  --ancho: 1120px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--fondo); color: var(--grafito);
  font-family: var(--f-texto); font-size: 15px; line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; margin: 0; letter-spacing: -0.01em; color: var(--grafito); }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--grafito); outline-offset: 2px; border-radius: 4px; }
.oculto { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.der { text-align: right; }
.visualmente-oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ─── Barra superior ───────────────────────────────────────────────────── */
.barra { position: sticky; top: 0; z-index: 30; background: var(--blanco); border-bottom: 1px solid var(--gris-200); }
.barra-in { max-width: var(--ancho); margin: 0 auto; padding: 0 20px; height: 62px; display: flex; align-items: center; gap: 28px; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--grafito); flex: none; }
.marca-sello { width: 32px; height: 32px; border-radius: 9px; background: var(--amarillo); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 17px; color: var(--grafito); }
.marca-nombre { font-family: var(--f-display); font-weight: 600; font-size: 15px; line-height: 1.1; }
.nav { display: flex; align-items: stretch; gap: 2px; height: 100%; overflow-x: auto; scrollbar-width: none; flex: 1; }
.nav::-webkit-scrollbar { display: none; }
.nav button { position: relative; background: none; border: 0; padding: 0 12px; font-size: 14px; font-weight: 500; color: var(--gris-600); white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.nav button:hover { color: var(--grafito); }
.nav button[aria-current="page"] { color: var(--grafito); font-weight: 600; }
.nav button[aria-current="page"]::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; background: var(--amarillo); border-radius: 3px 3px 0 0; }
.cuenta { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--amarillo); color: var(--grafito); font-size: 12px; font-weight: 600; display: inline-grid; place-items: center; }
.cuenta.rojo { background: var(--ladrillo); color: #fff; }
.yo { flex: none; text-align: right; font-size: 12px; line-height: 1.3; color: var(--gris-600); }
.yo strong { display: block; color: var(--grafito); font-weight: 500; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 900px) { .yo { display: none; } .barra-in { gap: 14px; } .marca-nombre { display: none; } }

/* ─── Contenedores ─────────────────────────────────────────────────────── */
.pagina { max-width: var(--ancho); margin: 0 auto; padding: 28px 20px 96px; }
.seccion { animation: entra .18s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.titulo-pagina { margin-bottom: 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.titulo-pagina h2 { font-size: 26px; }
.titulo-pagina p { color: var(--gris-600); margin-top: 4px; max-width: 62ch; }
.banners { max-width: var(--ancho); margin: 0 auto; padding: 0 20px; }
.banner { margin-top: 12px; padding: 10px 14px; border-radius: var(--r-chico); font-size: 14px; display: flex; gap: 10px; align-items: flex-start; background: var(--amarillo-suave); color: var(--amarillo-tinta); }
.banner.error { background: var(--ladrillo-suave); color: var(--ladrillo); }
.banner.prueba { background: var(--grafito); color: #fff; }
.banner svg { flex: none; margin-top: 2px; }
.banner button { margin-left: auto; flex: none; }

/* ─── Botones y campos ─────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: var(--r-chico); border: 1px solid var(--gris-300); background: var(--blanco); font-weight: 500; font-size: 14px; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--gris-100); border-color: var(--gris-400); }
.btn.principal { background: var(--amarillo); border-color: var(--amarillo); color: var(--grafito); font-weight: 600; }
.btn.principal:hover { background: var(--amarillo-fuerte); border-color: var(--amarillo-fuerte); }
.btn.oscuro { background: var(--grafito); border-color: var(--grafito); color: #fff; }
.btn.oscuro:hover { background: #000; }
.btn.peligro { background: var(--ladrillo); border-color: var(--ladrillo); color: #fff; }
.btn.texto { border-color: transparent; background: none; padding: 0 8px; color: var(--gris); text-decoration: underline; text-underline-offset: 3px; }
.btn.texto:hover { background: none; color: var(--grafito); }
.btn.chico { min-height: 32px; padding: 0 12px; font-size: 13px; }
.btn.grande { min-height: 48px; padding: 0 24px; font-size: 16px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; pointer-events: none; }
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo label { font-size: 13px; font-weight: 500; color: var(--gris); }
.campo small { color: var(--gris-600); font-size: 12px; }
input[type="text"], input[type="search"], input[type="date"], input[type="password"], input:not([type]), select, textarea {
  width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--gris-300); border-radius: var(--r-chico); background: var(--blanco);
}
textarea { min-height: 84px; resize: vertical; }
input:disabled { background: var(--gris-100); color: var(--gris-600); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.conmutador { position: relative; width: 44px; height: 26px; flex: none; }
.conmutador input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.conmutador span { position: absolute; inset: 0; border-radius: 99px; background: var(--gris-300); transition: background .15s; }
.conmutador span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.conmutador input:checked + span { background: var(--amarillo); }
.conmutador input:checked + span::after { transform: translateX(18px); }
.conmutador input:focus-visible + span { outline: 3px solid var(--grafito); outline-offset: 2px; }

/* ─── Chips ─────────────────────────────────────────────────────────────── */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; background: var(--gris-100); color: var(--gris); white-space: nowrap; }
.chip svg { width: 13px; height: 13px; }
.chip.amarillo { background: var(--amarillo); color: var(--grafito); font-weight: 600; }
.chip.suave { background: var(--amarillo-suave); color: var(--amarillo-tinta); }
.chip.oscuro { background: var(--grafito); color: #fff; }
.chip.rojo { background: var(--ladrillo-suave); color: var(--ladrillo); }

/* ═══ HOY ════════════════════════════════════════════════════════════════ */
.heroe { background: var(--amarillo); }
.heroe-in { max-width: var(--ancho); margin: 0 auto; padding: 34px 20px 0; }
.heroe .fecha { font-size: 14px; font-weight: 500; color: var(--grafito); opacity: .8; }
.heroe h1 { font-size: clamp(26px, 3.6vw, 40px); line-height: 1.12; margin-top: 6px; max-width: 24ch; font-weight: 700; }
.heroe .sub { margin-top: 12px; font-size: 16px; max-width: 64ch; color: var(--grafito); }

.regla { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin-top: 28px; }
.dia { position: relative; padding: 26px 4px 12px; text-align: center; border-left: 1px solid rgba(38,38,38,.16); min-width: 0; }
.dia:first-child { border-left: 0; }
.dia .dow { display: block; font-size: 12px; font-weight: 500; opacity: .75; }
.dia .dnum { display: block; font-family: var(--f-display); font-weight: 600; font-size: 22px; line-height: 1.15; }
.dia .mes { display: block; font-size: 11px; opacity: .7; height: 14px; }
.dia.inhabil { background: repeating-linear-gradient(135deg, rgba(38,38,38,.10) 0 4px, transparent 4px 9px); }
.dia.inhabil .dnum { opacity: .45; }
.dia.hoy { background: var(--grafito); color: var(--amarillo); border-radius: 10px 10px 0 0; }
.dia.hoy .dow, .dia.hoy .mes { opacity: .9; }
.dia .marca-dia { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 99px; white-space: nowrap; background: var(--grafito); color: #fff; }
.dia.hoy .marca-dia { background: var(--amarillo); color: var(--grafito); }
.dia .marca-dia.a1 { background: #fff; color: var(--grafito); }
.dia .etq { display: block; font-size: 10.5px; opacity: .65; line-height: 1.2; height: 13px; overflow: hidden; }
.regla-barra { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); height: 8px; background: rgba(38,38,38,.12); }
.regla-barra i { display: block; }
.regla-barra i.on { background: var(--grafito); }
.regla-barra i.ini { border-radius: 8px 0 0 8px; } .regla-barra i.fin { border-radius: 0 8px 8px 0; }
.regla-pie { display: flex; gap: 22px; flex-wrap: wrap; padding: 12px 0 18px; font-size: 13px; }
.regla-pie span { display: inline-flex; align-items: center; gap: 8px; }
.regla-pie i { display: inline-block; width: 22px; height: 8px; border-radius: 8px; background: var(--grafito); }
.regla-pie i.raya { background: repeating-linear-gradient(135deg, rgba(38,38,38,.35) 0 3px, transparent 3px 6px); height: 12px; width: 18px; border-radius: 2px; }
@media (max-width: 720px) { .regla { overflow-x: auto; grid-auto-columns: 62px; } .regla-barra { overflow: hidden; } .dia .dnum { font-size: 19px; } }

.pasos { list-style: none; margin: 0; padding: 0; position: relative; }
.paso { display: grid; grid-template-columns: 44px 1fr; gap: 0 18px; padding-bottom: 26px; position: relative; }
.paso:not(:last-child)::before { content: ''; position: absolute; left: 21px; top: 44px; bottom: 4px; width: 2px; background: var(--gris-200); }
.paso-num { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 600; font-size: 18px; background: var(--blanco); border: 2px solid var(--gris-300); color: var(--gris-600); }
.paso.activo .paso-num { background: var(--amarillo); border-color: var(--amarillo); color: var(--grafito); }
.paso.hecho .paso-num { background: var(--grafito); border-color: var(--grafito); color: #fff; }
.paso.espera { opacity: .6; }
.paso-cab { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; min-height: 44px; }
.paso-cab h3 { font-size: 19px; }
.paso-cab p { color: var(--gris-600); font-size: 14px; margin-top: 2px; }
.paso-cuerpo { margin-top: 14px; }

.zona { border: 2px dashed var(--gris-300); border-radius: var(--r); background: var(--blanco); padding: 26px 20px; text-align: center; transition: background .12s, border-color .12s; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.zona:hover, .zona.arrastre { background: var(--amarillo-suave); border-color: var(--amarillo); }
.zona svg { width: 30px; height: 30px; margin-bottom: 6px; }
.zona strong { font-family: var(--f-display); font-weight: 600; font-size: 17px; }
.zona span { color: var(--gris-600); font-size: 14px; }
.zona.chica { padding: 14px; flex-direction: row; justify-content: center; gap: 10px; }
.zona.chica svg { width: 20px; height: 20px; margin: 0; }
.zona.chica strong { font-size: 14px; font-family: var(--f-texto); font-weight: 500; }

.reportes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
@media (max-width: 760px) { .reportes { grid-template-columns: 1fr; } }
.reporte { background: var(--blanco); border: 1px solid var(--gris-200); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.reporte-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.reporte h4 { font-size: 16px; }
.reporte .detalle { color: var(--gris-600); font-size: 14px; }
.filtro { background: var(--amarillo-suave); color: var(--amarillo-tinta); border-radius: var(--r-chico); padding: 10px 12px; font-size: 13.5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filtro b { color: var(--grafito); }
.copiar { border: 1px solid var(--amarillo); background: #fff; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 500; }
.copiar:hover { background: var(--amarillo); }

.cargas { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.carga { background: var(--blanco); border: 1px solid var(--gris-200); border-left: 4px solid var(--gris-300); border-radius: var(--r-chico); padding: 12px 14px; }
.carga.ok { border-left-color: var(--grafito); }
.carga.revisar { border-left-color: var(--amarillo); background: var(--amarillo-suave); }
.carga.error { border-left-color: var(--ladrillo); background: var(--ladrillo-suave); }
.carga-cab { display: flex; align-items: center; gap: 10px; font-weight: 500; flex-wrap: wrap; }
.carga-cab .giro { flex: none; }
.carga ul { margin: 8px 0 0; padding-left: 20px; font-size: 14px; }
.carga li + li { margin-top: 3px; }
.carga .acciones { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
.fechas-rep1 { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.fechas-rep1 span { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--gris-100); color: var(--gris); }
.fechas-rep1 span.dentro { background: var(--blanco); border: 1px solid var(--gris-300); color: var(--grafito); font-weight: 500; }

.paso-linea { background: var(--blanco); border: 1px solid var(--gris-200); border-radius: var(--r); padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.paso-linea .dato { font-size: 15px; }
.paso-linea .dato b { font-family: var(--f-display); font-size: 20px; margin-right: 4px; }
.paso-linea .dato small { display: block; color: var(--gris-600); font-size: 13px; margin-top: 2px; }

.resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-top: 8px; border-top: 1px solid var(--gris-200); }
.resumen > div { padding: 18px 20px 4px 0; }
.resumen > div + div { padding-left: 20px; border-left: 1px solid var(--gris-200); }
.resumen b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 600; line-height: 1.2; }
.resumen span { color: var(--gris-600); font-size: 13px; }
@media (max-width: 640px) { .resumen > div, .resumen > div + div { border-left: 0; padding: 14px 0 0; } }

/* ═══ AVISOS ═════════════════════════════════════════════════════════════ */
.grupo { margin-top: 28px; }
.grupo-cab { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.grupo-cab svg { width: 24px; height: 24px; flex: none; }
.grupo-cab h3 { font-size: 19px; }
.grupo-cab .cuantos { color: var(--gris-600); font-size: 14px; }
.grupo-cab .espacio { flex: 1; }
.grupo-nota { color: var(--gris-600); font-size: 14px; margin: -2px 0 10px; max-width: 70ch; }
.lista { background: var(--blanco); border: 1px solid var(--gris-200); border-radius: var(--r); overflow: hidden; }
.fila { display: grid; grid-template-columns: 28px minmax(0, 2.2fr) minmax(0, 1.4fr) minmax(0, 1.1fr) 28px; gap: 12px; align-items: center; padding: 13px 16px; border-top: 1px solid var(--gris-100); background: var(--blanco); width: 100%; text-align: left; border-left: 0; border-right: 0; border-bottom: 0; }
.lista > .fila:first-child, .lista > div:first-child > .fila { border-top: 0; }
button.fila:hover { background: #FAFAFA; }
.fila .quien b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila .quien small { color: var(--gris-600); font-size: 13px; }
.fila .cuando { font-size: 14px; }
.fila .cuando small { display: block; color: var(--gris-600); font-size: 12.5px; }
.fila .monto { text-align: right; font-weight: 600; }
.fila .monto small { display: block; font-weight: 400; color: var(--gris-600); font-size: 12px; }
.fila .flecha { color: var(--gris-400); justify-self: end; }
.fila .elige { display: grid; place-items: center; }
.tilde { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--gris-300); background: #fff; margin: 0; cursor: pointer; display: grid; place-items: center; }
.tilde:checked { background: var(--amarillo); border-color: var(--amarillo); }
.tilde:checked::after { content: ''; width: 5px; height: 10px; border: solid var(--grafito); border-width: 0 2.4px 2.4px 0; transform: translateY(-1px) rotate(45deg); }
.fila.atencion { grid-template-columns: minmax(0, 1.5fr) minmax(0, 2fr) 330px; cursor: default; }
.fila.atencion .motivo { font-size: 14px; color: var(--gris); }
.fila.atencion .motivo b { color: var(--grafito); font-weight: 500; }
.fila.atencion .botones { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.fila.simple { grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) minmax(0, 1fr) 28px; }
@media (max-width: 760px) {
  .fila, .fila.simple { grid-template-columns: 28px minmax(0, 1fr) auto; row-gap: 2px; }
  .fila .cuando { grid-column: 2; grid-row: 2; }
  .fila .monto { grid-column: 3; grid-row: 1 / span 2; align-self: center; }
  .fila .flecha { display: none; }
  .fila.simple { grid-template-columns: minmax(0, 1fr) auto; }
  .fila.simple .cuando { grid-column: 1; grid-row: 2; }
  .fila.simple .monto { grid-column: 2; }
  .fila.atencion { grid-template-columns: 1fr; }
  .fila.atencion .botones { justify-content: flex-start; }
}
.plegable { margin-top: 28px; }
.plegable summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 4px 0; }
.plegable summary::-webkit-details-marker { display: none; }
.plegable summary h3 { font-size: 19px; }
.plegable summary .mas { margin-left: auto; color: var(--gris-600); font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.plegable[open] summary .mas svg { transform: rotate(180deg); }
.plegable .lista { margin-top: 8px; }

.barra-envio { position: sticky; bottom: 16px; z-index: 20; margin-top: 22px; background: var(--grafito); color: #fff; border-radius: 14px; padding: 12px 14px 12px 22px; display: flex; align-items: center; gap: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.22); }
.barra-envio .resumen-envio { flex: 1; min-width: 0; font-weight: 600; }
.barra-envio .resumen-envio small { display: block; font-weight: 400; opacity: .75; font-size: 13px; }
.barra-envio .btn.texto { color: #fff; }
@media (max-width: 640px) { .barra-envio { flex-wrap: wrap; } .barra-envio .btn.principal { width: 100%; } }

.herramientas { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.herramientas .buscar { flex: 1; min-width: 220px; max-width: 360px; }
.pildoras { display: flex; flex-wrap: wrap; gap: 6px; }
.pildoras button { border: 1px solid var(--gris-300); background: #fff; border-radius: 99px; padding: 5px 14px; font-size: 13.5px; display: inline-flex; gap: 7px; align-items: center; }
.pildoras button b { font-weight: 600; color: var(--gris-600); }
.pildoras button[aria-pressed="true"] { background: var(--grafito); border-color: var(--grafito); color: #fff; }
