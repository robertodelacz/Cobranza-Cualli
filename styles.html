<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Poppins:wght@500;600&display=swap');

/* ─── Tokens ─────────────────────────────────────────────────────────────
   Paleta institucional Cualli: amarillo y grises. El rojo ladrillo se reserva
   para lo que está bloqueado o falló. Cada estado también se distingue por su
   forma (glifo), no sólo por el color. */
:root {
  --amarillo: #FDB913;
  --amarillo-suave: #FFF3D4;
  --amarillo-tinta: #7A4F00;
  --grafito: #2E2E2E;
  --gris-700: #3F3F3F;
  --gris-600: #515151;
  --gris-500: #6B6B6B;
  --gris-400: #9A9A9A;
  --gris-300: #C8C8C8;
  --gris-200: #E5E5E5;
  --gris-100: #F2F2F2;
  --blanco: #FFFFFF;
  --ladrillo: #B3261E;
  --ladrillo-suave: #FBE9E7;

  --f-display: 'Poppins', system-ui, sans-serif;
  --f-texto: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;

  --riel: 220px;
  --pad: clamp(16px, 3vw, 40px);
  --r-chico: 6px;
  --r-medio: 10px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--f-texto); font-size: 14px; line-height: 1.5; color: var(--grafito);
  background: var(--gris-100); -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.oculto { display: none !important; }
:focus-visible { outline: 3px solid var(--amarillo); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ─── Estructura ─────────────────────────────────────────────────────── */
#app { display: grid; grid-template-columns: var(--riel) minmax(0, 1fr); min-height: 100vh; }

.riel {
  background: var(--grafito); color: var(--gris-200); position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; padding: 22px 0 18px;
}
.marca { display: flex; align-items: center; gap: 12px; padding: 0 20px 26px; }
.marca-sello {
  width: 38px; height: 38px; border-radius: 9px; background: var(--amarillo); color: var(--grafito);
  font: 600 20px/38px var(--f-display); text-align: center;
}
.marca-nombre { font: 600 14px/1.15 var(--f-display); color: var(--blanco); }
.marca-nombre small { display: block; font: 400 12px var(--f-texto); color: var(--gris-400); margin-top: 3px; }

.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
.nav button {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left;
  background: none; border: 0; color: var(--gris-300); padding: 10px 12px 10px 14px; border-radius: 8px;
  cursor: pointer; border-left: 3px solid transparent; transition: background .15s;
}
.nav button:hover { background: rgba(255,255,255,.06); }
.nav button[aria-current="page"] { background: rgba(253,185,19,.12); color: var(--blanco); border-left-color: var(--amarillo); font-weight: 500; }
.nav .cuenta {
  min-width: 22px; padding: 1px 7px; border-radius: 99px; background: var(--amarillo); color: var(--grafito);
  font-size: 12px; font-weight: 600; text-align: center;
}
.nav .cuenta.rojo { background: var(--ladrillo); color: var(--blanco); }
.riel-pie { margin-top: auto; padding: 14px 20px 0; border-top: 1px solid rgba(255,255,255,.1); font-size: 12px; color: var(--gris-400); }
.riel-pie strong { display: block; color: var(--gris-200); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

main { min-width: 0; padding: 0 0 80px; }
.seccion { padding: 0 var(--pad); }
.seccion > * + * { margin-top: 28px; }

/* ─── Avisos de contexto ─────────────────────────────────────────────── */
.banner {
  padding: 10px var(--pad); font-size: 13px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  border-bottom: 1px solid rgba(0,0,0,.08);
}
.banner.prueba { background: repeating-linear-gradient(135deg, var(--amarillo) 0 14px, #F2AC00 14px 28px); color: var(--grafito); font-weight: 500; }
.banner.aviso { background: var(--amarillo-suave); color: var(--amarillo-tinta); }
.banner.error { background: var(--ladrillo-suave); color: var(--ladrillo); }
.banner button { margin-left: auto; }

/* ─── Encabezado de cada sección ─────────────────────────────────────── */
.cabecera { padding-top: 34px; }
.cabecera .fecha { color: var(--gris-500); font-size: 13px; margin-bottom: 8px; }
.cabecera h1 { font: 600 clamp(24px, 3.2vw, 34px)/1.18 var(--f-display); max-width: 30em; letter-spacing: -.01em; }
.cabecera h2 { font: 600 24px/1.2 var(--f-display); }
.cabecera .sub { margin-top: 10px; color: var(--gris-600); max-width: 46em; }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

/* ─── Botones ────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--r-chico);
  border: 1px solid var(--gris-300); background: var(--blanco); padding: 8px 14px; cursor: pointer; font-weight: 500;
  transition: border-color .15s, background .15s;
}
.btn:hover:not(:disabled) { border-color: var(--gris-600); }
.btn.principal { background: var(--amarillo); border-color: var(--amarillo); color: var(--grafito); font-weight: 600; }
.btn.principal:hover:not(:disabled) { background: #F2AC00; border-color: #F2AC00; }
.btn.oscuro { background: var(--grafito); border-color: var(--grafito); color: var(--blanco); }
.btn.peligro { border-color: var(--ladrillo); color: var(--ladrillo); }
.btn.chico { padding: 4px 10px; font-size: 13px; }
.btn.texto { border-color: transparent; background: none; padding: 4px 8px; color: var(--gris-600); text-decoration: underline; text-underline-offset: 3px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ─── La regla de días hábiles ───────────────────────────────────────── */
.regla-marco { background: var(--blanco); border-block: 1px solid var(--gris-200); margin-inline: calc(var(--pad) * -1); padding: 22px var(--pad) 18px; overflow-x: auto; }
.regla { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(74px, 1fr); min-width: max-content; }
.dia { position: relative; padding-top: 30px; min-height: 142px; border-left: 1px solid var(--gris-200); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.dia:last-child { border-right: 1px solid var(--gris-200); }
.dia .dow { font-size: 12px; color: var(--gris-500); }
.dia .dnum { font: 600 26px/1.1 var(--f-display); }
.dia .mes { font-size: 11px; color: var(--gris-500); height: 14px; }
.dia .cuenta-dia {
  margin-top: 8px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--amarillo); color: var(--grafito); font: 600 13px var(--f-display);
}
.dia .etq-inhabil { margin-top: 8px; font-size: 11px; color: var(--gris-500); text-align: center; line-height: 1.2; padding-inline: 4px; }
.dia.inhabil {
  background: repeating-linear-gradient(135deg, transparent 0 7px, rgba(0,0,0,.055) 7px 8px);
  color: var(--gris-500);
}
.dia.inhabil .dnum { color: var(--gris-400); }
.dia.hoy { background: var(--grafito); color: var(--blanco); border-left-color: var(--grafito); }
.dia.hoy .dow, .dia.hoy .mes { color: var(--gris-300); }
.dia.hoy .hoy-etq { margin-top: 8px; font-size: 12px; font-weight: 600; color: var(--amarillo); }
.dia .bandera {
  position: absolute; top: 4px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 4px 4px 4px 0;
}
.bandera.a1 { background: var(--amarillo); color: var(--grafito); }
.bandera.a2 { background: var(--grafito); color: var(--blanco); outline: 1px solid var(--blanco); }
.regla-barra { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(74px, 1fr); min-width: max-content; margin-top: 10px; }
.regla-barra i { height: 8px; display: block; }
.regla-barra i.on { background: var(--amarillo); }
.regla-barra i.on.ini { border-radius: 99px 0 0 99px; }
.regla-barra i.on.fin { border-radius: 0 99px 99px 0; }
.regla-leyenda { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--gris-600); font-size: 13px; }
.regla-leyenda b { color: var(--grafito); font-weight: 600; }

/* ─── Cargas ─────────────────────────────────────────────────────────── */
.cargas { display: grid; grid-template-columns: 1fr 1fr; gap: 0; background: var(--blanco); border: 1px solid var(--gris-200); border-radius: var(--r-medio); }
.carga { padding: 22px 24px 24px; min-width: 0; }
.carga + .carga { border-left: 1px solid var(--gris-200); }
.carga h2 { font: 600 17px/1.3 var(--f-display); }
.carga .que { color: var(--gris-600); margin-top: 4px; font-size: 13px; }
.filtro-reporte { margin-top: 14px; padding: 10px 12px; background: var(--amarillo-suave); border-radius: var(--r-chico); font-size: 13px; color: var(--amarillo-tinta); }
.filtro-reporte b { font-weight: 600; }
.zona {
  margin-top: 16px; border: 2px dashed var(--gris-300); border-radius: var(--r-medio); padding: 22px 16px; text-align: center;
  color: var(--gris-600); cursor: pointer; transition: border-color .15s, background .15s;
}
.zona:hover, .zona.arrastre { border-color: var(--amarillo); background: var(--amarillo-suave); }
.zona strong { display: block; color: var(--grafito); font-weight: 600; margin-bottom: 2px; }
.corte { margin-top: 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.corte dt { color: var(--gris-500); } .corte dd { margin: 0; }
.vigencia { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.vigencia.ok { background: var(--amarillo-suave); color: var(--amarillo-tinta); }
.vigencia.vencido { background: var(--ladrillo-suave); color: var(--ladrillo); }
.vigencia.vacio { background: var(--gris-100); color: var(--gris-500); }
.validacion { margin-top: 16px; border-top: 1px solid var(--gris-200); padding-top: 14px; }
.validacion h3 { font: 600 14px var(--f-display); margin-bottom: 8px; }
.notas { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.notas li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 13px; }
.notas svg { width: 16px; height: 16px; margin-top: 2px; }
.fechas-rep1 { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.fechas-rep1 span { padding: 2px 9px; border-radius: 99px; background: var(--gris-100); font-size: 12px; }
.fechas-rep1 span.dentro { background: var(--amarillo-suave); color: var(--amarillo-tinta); }
.fechas-rep1 span.finde { background: repeating-linear-gradient(135deg, var(--gris-100) 0 5px, var(--gris-200) 5px 6px); }
.confirma { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0; font-size: 13px; }

/* ─── Barra de la cola ───────────────────────────────────────────────── */
.cola-resumen { background: var(--blanco); border: 1px solid var(--gris-200); border-radius: var(--r-medio); padding: 22px 24px; }
.cola-resumen h2 { font: 600 17px var(--f-display); }
.cola-resumen .lectura { margin-top: 4px; color: var(--gris-600); }
.apilada { display: flex; height: 22px; margin-top: 16px; border-radius: 5px; overflow: hidden; background: var(--gris-100); }
.apilada span { display: block; min-width: 4px; }
.leyenda { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 12px; font-size: 13px; }
.leyenda div { display: flex; align-items: center; gap: 7px; }
.leyenda b { font-variant-numeric: tabular-nums; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.e-LISTA { background: var(--amarillo); }
.e-REVISAR { background: repeating-linear-gradient(135deg, var(--amarillo) 0 4px, var(--amarillo-suave) 4px 8px); outline: 1px solid var(--amarillo); outline-offset: -1px; }
.e-BLOQUEADA { background: var(--ladrillo); }
.e-PROGRAMADA { background: var(--blanco); outline: 1.5px solid var(--gris-400); outline-offset: -1.5px; }
.e-ESPERA_VISPERA { background: linear-gradient(90deg, var(--gris-500) 50%, var(--gris-200) 50%); }
.e-COMPLETA { background: var(--grafito); }
.e-VENCE_HOY, .e-VENCIDA { background: var(--gris-200); }

/* ─── Cola: barra de herramientas y tabla ────────────────────────────── */
.herramientas { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.filtros { display: flex; flex-wrap: wrap; gap: 6px; }
.filtros button {
  border: 1px solid var(--gris-300); background: var(--blanco); border-radius: 99px; padding: 5px 13px; cursor: pointer; font-size: 13px;
}
.filtros button[aria-pressed="true"] { background: var(--grafito); border-color: var(--grafito); color: var(--blanco); }
.filtros button b { margin-left: 6px; font-variant-numeric: tabular-nums; }
.buscar { margin-left: auto; min-width: 220px; padding: 7px 12px; border: 1px solid var(--gris-300); border-radius: var(--r-chico); background: var(--blanco); }

.tabla-marco { background: var(--blanco); border: 1px solid var(--gris-200); border-radius: var(--r-medio); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--gris-500); padding: 10px 14px; border-bottom: 1px solid var(--gris-200); white-space: nowrap; background: var(--blanco); }
td { padding: 12px 14px; border-bottom: 1px solid var(--gris-200); vertical-align: middle; }
tbody tr.fila { cursor: pointer; }
tbody tr.fila:hover td { background: #FBFBFA; }
tbody tr:last-child td { border-bottom: 0; }
td.der, th.der { text-align: right; }
.cliente b { font-weight: 600; display: block; max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cliente small { color: var(--gris-500); }
td.num, .pago { white-space: nowrap; }
.pago small { display: block; color: var(--gris-500); font-size: 12px; }
.monto { font-weight: 600; white-space: nowrap; }
.monto small { font-weight: 400; color: var(--gris-500); margin-left: 4px; }
.estado { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 13px; }
.estado svg { width: 18px; height: 18px; flex: none; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--gris-100); color: var(--gris-600); margin: 1px 4px 1px 0; white-space: nowrap; }
.chip.warn { background: var(--amarillo-suave); color: var(--amarillo-tinta); }
.chip.bloq { background: var(--ladrillo-suave); color: var(--ladrillo); }
.chip.aviso1 { background: var(--amarillo); color: var(--grafito); font-weight: 600; }
.chip.aviso2 { background: var(--grafito); color: var(--blanco); font-weight: 600; }
tr.detalle td { background: #FAFAF9; padding: 0; }
.detalle-grid { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(260px, 1.2fr); gap: 28px; padding: 18px 22px 22px 58px; }
.desglose { width: 100%; font-size: 13px; }
.desglose td { padding: 5px 0; border: 0; }
.desglose td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.desglose tr.sub td { border-top: 1px solid var(--gris-300); padding-top: 8px; font-weight: 600; }
.desglose tr.menor td { color: var(--gris-500); }
.detalle h3 { font: 600 14px var(--f-display); margin-bottom: 8px; }
.nota-calculo { margin-top: 10px; color: var(--gris-600); font-size: 12.5px; }
.vacio { padding: 48px 20px; text-align: center; color: var(--gris-500); }
.vacio b { display: block; color: var(--grafito); font: 600 16px var(--f-display); margin-bottom: 6px; }

.barra-envio {
  position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  background: var(--grafito); color: var(--blanco); padding: 12px var(--pad); margin-inline: calc(var(--pad) * -1);
}
.barra-envio .resumen { font-weight: 500; }
.barra-envio .resumen small { color: var(--gris-300); margin-left: 8px; font-weight: 400; }
.barra-envio .btn { margin-left: auto; }
.progreso { height: 6px; background: var(--gris-200); border-radius: 3px; overflow: hidden; margin: 12px 0; }
.progreso i { display: block; height: 100%; background: var(--amarillo); transition: width .2s; }

/* ─── Formularios y modales ──────────────────────────────────────────── */
.campo { display: grid; gap: 4px; }
.campo label { font-size: 13px; font-weight: 500; }
.campo small { color: var(--gris-500); }
.campo input, .campo select, .campo textarea { padding: 8px 10px; border: 1px solid var(--gris-300); border-radius: var(--r-chico); background: var(--blanco); width: 100%; }
.campo textarea { min-height: 70px; resize: vertical; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.panel { background: var(--blanco); border: 1px solid var(--gris-200); border-radius: var(--r-medio); padding: 22px 24px; }
.panel h2 { font: 600 17px var(--f-display); margin-bottom: 4px; }
.panel .nota { color: var(--gris-600); margin-bottom: 14px; }

.velo { position: fixed; inset: 0; background: rgba(31,31,31,.55); display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal { background: var(--blanco); border-radius: 14px; width: min(560px, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
.modal.ancho { width: min(860px, 100%); }
.modal-cab { padding: 20px 24px 6px; display: flex; justify-content: space-between; gap: 16px; }
.modal-cab h2 { font: 600 18px/1.3 var(--f-display); }
.modal-cuerpo { padding: 8px 24px 8px; }
.modal-pie { padding: 14px 24px 20px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.cerrar { background: none; border: 0; font-size: 24px; line-height: 1; cursor: pointer; color: var(--gris-500); }
.meta-correo { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; margin-bottom: 12px; }
.meta-correo dt { color: var(--gris-500); } .meta-correo dd { margin: 0; overflow-wrap: anywhere; }
.marco-correo { width: 100%; height: 56vh; border: 1px solid var(--gris-200); border-radius: 8px; }
.lista-res { list-style: none; padding: 0; margin: 10px 0 0; max-height: 220px; overflow: auto; font-size: 13px; display: grid; gap: 6px; }

.toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 80; }
.toast { background: var(--grafito); color: var(--blanco); padding: 11px 16px; border-radius: 8px; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,.25); border-left: 4px solid var(--amarillo); }
.toast.error { border-left-color: var(--ladrillo); }

.ficha-lista { list-style: none; padding: 0; margin: 0; }
.ficha-lista li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--gris-200); }
.ficha-lista li:last-child { border-bottom: 0; }
.ficha-lista .grow { flex: 1; min-width: 0; }
.ficha-lista small { color: var(--gris-500); display: block; }
.conteos { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.conteos div { min-width: 120px; }
.conteos b { display: block; font: 600 26px/1.1 var(--f-display); }
.conteos span { color: var(--gris-600); font-size: 13px; }
.params td { padding: 8px 10px; font-size: 13px; }
.params input { padding: 5px 8px; border: 1px solid var(--gris-300); border-radius: 5px; width: 100%; min-width: 120px; }
.params code { font-size: 12px; background: var(--gris-100); padding: 1px 6px; border-radius: 4px; }

.cargando { padding: 80px 0; text-align: center; color: var(--gris-500); }
.giro { width: 22px; height: 22px; border: 3px solid var(--gris-200); border-top-color: var(--amarillo); border-radius: 50%; display: inline-block; animation: gira .8s linear infinite; vertical-align: -5px; margin-right: 8px; }
@keyframes gira { to { transform: rotate(360deg); } }

/* ─── Pantallas angostas ─────────────────────────────────────────────── */
@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; }
  .riel { position: static; height: auto; flex-direction: row; align-items: center; padding: 10px 12px; gap: 10px; overflow-x: auto; }
  .marca { padding: 0 8px 0 0; } .marca-nombre { display: none; }
  .nav { flex-direction: row; padding: 0; } .nav button { border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; }
  .nav button[aria-current="page"] { border-bottom-color: var(--amarillo); }
  .riel-pie { display: none; }
  .cargas { grid-template-columns: 1fr; } .carga + .carga { border-left: 0; border-top: 1px solid var(--gris-200); }
  .detalle-grid { grid-template-columns: 1fr; padding-left: 22px; }
  .buscar { margin-left: 0; width: 100%; }
}
</style>
