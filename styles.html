<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap');

/* ═══════════════════════════════════════════════════════════════════════════
   COBRANZA CUALLI · Sistema de diseño
   Paleta institucional: amarillo #FDB913 y grises. El rojo ladrillo solo para
   lo que no se puede enviar o salió mal. Poppins para títulos y cifras grandes,
   IBM Plex Sans para la interfaz. Elemento propio: "la cinta" (recibo de
   sumadora) que muestra cómo se construye cada monto.
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  --amarillo: #FDB913;
  --amarillo-fuerte: #E5A300;
  --amarillo-suave: #FFF0C2;
  --amarillo-tenue: #FFF9E6;
  --amarillo-tinta: #6B4A00;
  --g900: #1F1F1F;
  --g800: #2A2A2A;
  --g700: #3A3A3A;
  --g600: #515151;
  --g500: #6B6B6B;
  --g400: #9A9A9A;
  --g300: #C8C8C8;
  --g200: #E3E3E3;
  --g100: #F1F1F1;
  --g50: #F8F8F8;
  --fondo: #EFEFEF;
  --papel: #FFFFFF;
  --ladrillo: #B3261E;
  --ladrillo-suave: #FBEAE8;
  --f-titulo: 'Poppins', 'IBM Plex Sans', 'Segoe UI', sans-serif;
  --f-texto: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --lado: 256px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: auto; }
body {
  margin: 0; background: var(--fondo); color: var(--g800);
  font-family: var(--f-texto); font-size: 15px; line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3, h4 { font-family: var(--f-titulo); font-weight: 600; margin: 0; letter-spacing: -0.01em; color: var(--g900); }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { flex: none; }
.oculto { display: none !important; }
:focus-visible { outline: 3px solid var(--amarillo-fuerte); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--amarillo); color: var(--g900); }
.num { font-variant-numeric: tabular-nums; }
.der { text-align: right; }

/* ─── Estructura: barra lateral + área de trabajo ───────────────────────── */
.app { display: grid; grid-template-columns: var(--lado) minmax(0, 1fr); min-height: 100vh; }
.lado {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
  background: var(--g800); color: #fff; border-top: 4px solid var(--amarillo); overflow-y: auto;
}
.lado-marca { display: flex; align-items: center; gap: 12px; padding: 22px 18px 14px; }
.logo-tile {
  width: 62px; height: 46px; flex: none; background: #fff; border-radius: 10px;
  display: grid; place-items: center; padding: 6px 7px; overflow: hidden;
}
.logo-tile img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.logo-tile .logo-c { font: 700 24px/1 var(--f-titulo); color: var(--g800); }
.lado-marca b { display: block; font: 600 17px/1.1 var(--f-titulo); letter-spacing: -0.01em; }
.lado-marca small { display: block; margin-top: 3px; font-size: 12.5px; color: var(--g400); }

.nav { padding: 6px 12px 12px; }
.nav-grupo { margin-top: 16px; }
.nav-etq { padding: 0 12px 6px; font-size: 12.5px; color: var(--g400); }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; margin: 1px 0;
  background: none; border: 0; border-radius: 8px; color: #D9D9D9; font-weight: 500; font-size: 14.5px; text-align: left;
}
.nav-item svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
.nav-item:hover { background: #343434; color: #fff; }
.nav-item[aria-current="page"] { background: #3B3B3B; color: #fff; box-shadow: inset 3px 0 0 var(--amarillo); }
.nav-item[aria-current="page"] svg { color: var(--amarillo); opacity: 1; }
.cuenta {
  margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: 11px; text-align: center;
  background: var(--amarillo); color: var(--g900); font-size: 12px; font-weight: 700; line-height: 20px;
}
.cuenta.rojo { background: var(--ladrillo); color: #fff; }

.lado-pie { margin-top: auto; padding: 16px 16px 18px; border-top: 1px solid #3B3B3B; display: flex; gap: 11px; align-items: center; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--amarillo); color: var(--g900); display: grid; place-items: center; font: 600 14px var(--f-titulo); flex: none; }
.yo { min-width: 0; }
.yo b { display: block; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.yo span { display: block; font-size: 12.5px; color: var(--g400); }

.cuerpo-app { min-width: 0; display: flex; flex-direction: column; }
.ctx {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  height: 62px; padding: 0 32px; background: var(--papel); border-bottom: 1px solid var(--g200);
}
.ctx-fecha b { display: block; font: 600 15px/1.2 var(--f-titulo); }
.ctx-fecha span { font-size: 13px; color: var(--g500); }
.ctx-reportes { display: flex; gap: 8px; }
.ctx-rep {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 9px; background: var(--g50);
  border: 1px solid var(--g200); border-radius: 999px; font-size: 13px; color: var(--g700);
}
.ctx-rep:hover { border-color: var(--g300); background: #fff; }
.ctx-rep b { font-weight: 600; }
.ctx-rep span { color: var(--g500); }
.ctx-rep svg { width: 18px; height: 18px; }

.banners { display: flex; flex-direction: column; gap: 8px; padding: 14px 32px 0; }
.banners:empty { display: none; }
.banner {
  display: flex; gap: 10px; align-items: center; padding: 11px 14px; background: var(--amarillo-suave);
  border: 1px solid #F1D68A; border-radius: 10px; font-size: 14px; color: var(--amarillo-tinta);
}
.banner.error { background: var(--ladrillo-suave); border-color: #F0C2BD; color: #7A1914; }
.banner.prueba { background: var(--g800); border-color: var(--g800); color: #fff; }
.banner svg { width: 20px; height: 20px; }
.banner .btn { margin-left: auto; }

.contenido { padding: 28px 32px 90px; width: 100%; max-width: 1380px; }
.seccion { animation: entra .18s ease-out; }
@keyframes entra { from { opacity: 0; } to { opacity: 1; } }
.titulo-pag { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }
.titulo-pag h2 { font-size: 28px; line-height: 1.15; }
.titulo-pag .lead { margin-top: 6px; max-width: 70ch; color: var(--g600); font-size: 15px; }
.acciones-pag { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ─── Paneles y números clave ───────────────────────────────────────────── */
.panel { background: var(--papel); border: 1px solid var(--g200); border-radius: 12px; }
.panel + .panel, .panel + .kpis, .kpis + .panel, .kpis + .cargas, .cargas + .panel, .panel + .cargas { margin-top: 18px; }
.panel-cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 15px 20px; border-bottom: 1px solid var(--g200); }
.panel-cab h3 { font-size: 16px; }
.panel-cab p { font-size: 13.5px; color: var(--g500); margin-top: 2px; }
.panel-cuerpo { padding: 20px; }
.panel-cuerpo > p + p { margin-top: 8px; }
.nota { font-size: 13.5px; color: var(--g500); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { background: var(--papel); border: 1px solid var(--g200); border-radius: 12px; padding: 16px 18px 15px; }
.kpi .t { font-size: 13.5px; color: var(--g600); }
.kpi .v { margin-top: 6px; font: 600 26px/1.1 var(--f-titulo); letter-spacing: -0.02em; color: var(--g900); }
.kpi .m { margin-top: 5px; font-size: 13px; color: var(--g500); }
.kpi.dest { background: var(--amarillo); border-color: var(--amarillo); }
.kpi.dest .t, .kpi.dest .m { color: var(--g800); }
.kpi .v.rojo { color: var(--ladrillo); }

/* ─── Hoy: parte del día y calendario de la tanda ───────────────────────── */
.brief { padding: 26px 28px 24px; }
.brief h1 { font-size: 31px; line-height: 1.15; max-width: 22ch; letter-spacing: -0.02em; }
.brief .sub { margin-top: 10px; max-width: 62ch; font-size: 16px; color: var(--g600); }
.brief-acc { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.recorrido { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
.rec { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 999px; background: var(--g50); border: 1px solid var(--g200); font-size: 13.5px; color: var(--g600); }
.rec svg { width: 20px; height: 20px; }
.rec.hecho { color: var(--g800); background: #fff; }
.rec.activo { border-color: var(--amarillo); background: var(--amarillo-tenue); color: var(--g900); font-weight: 500; }
.calendario { margin-top: 26px; padding-top: 24px; border-top: 1px solid var(--g200); }
.calendario h3 { font-size: 15px; margin-bottom: 14px; }
.regla { display: grid; grid-template-columns: repeat(var(--n, 12), minmax(0, 1fr)); gap: 6px; padding-top: 12px; }
.dia { position: relative; padding: 15px 4px 9px; text-align: center; border: 1px solid var(--g200); border-radius: 9px; background: #fff; min-width: 0; }
.dia .dow { display: block; font-size: 12.5px; color: var(--g500); }
.dia .dnum { display: block; font: 600 22px/1.15 var(--f-titulo); color: var(--g900); }
.dia .mes { display: block; font-size: 12px; color: var(--g500); min-height: 17px; }
.dia .etq { display: block; font-size: 11.5px; color: var(--g500); min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dia.cubre { background: var(--amarillo-tenue); border-color: #F3DB92; }
.dia.inhabil { background: repeating-linear-gradient(135deg, #F7F7F7 0 6px, #EBEBEB 6px 12px); color: var(--g400); }
.dia.inhabil .dnum { color: var(--g400); }
.dia.hoy { background: var(--g800); border-color: var(--g800); }
.dia.hoy .dow, .dia.hoy .mes, .dia.hoy .etq { color: #CFCFCF; }
.dia.hoy .dnum { color: var(--amarillo); }
.marca-dia {
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%); padding: 1px 8px; border-radius: 10px;
  background: var(--g800); color: #fff; font-size: 11.5px; font-weight: 600; white-space: nowrap;
}
.marca-dia.a1 { background: var(--amarillo); color: var(--g900); }
.dia.hoy .marca-dia { background: var(--amarillo); color: var(--g900); }
.leyenda { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; color: var(--g600); }
.leyenda span { display: inline-flex; align-items: center; gap: 7px; }
.leyenda i { width: 16px; height: 12px; border-radius: 3px; border: 1px solid #F3DB92; background: var(--amarillo-tenue); }
.leyenda i.raya { border-color: var(--g300); background: repeating-linear-gradient(135deg, #F7F7F7 0 3px, #E2E2E2 3px 6px); }
.leyenda i.h { border-color: var(--g800); background: var(--g800); }
.dos-col { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; align-items: start; }
.dos-col > .panel { margin-top: 0 !important; }

/* ─── Carga de reportes: una tarjeta por reporte ────────────────────────── */
.cargas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.carga-card { display: flex; flex-direction: column; background: var(--papel); border: 1px solid var(--g200); border-radius: 12px; overflow: hidden; }
.cc-cab { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--g200); }
.cc-sello { width: 46px; height: 46px; border-radius: 10px; background: var(--g800); color: var(--amarillo); display: grid; place-items: center; font: 600 14px var(--f-titulo); flex: none; }
.cc-cab h3 { font-size: 16px; }
.cc-cab p { font-size: 13.5px; color: var(--g500); margin-top: 1px; }
.cc-cab .chip { margin-left: auto; }
.cc-cuerpo { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.zona {
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 26px 18px;
  border: 2px dashed var(--g300); border-radius: 10px; background: var(--g50); transition: border-color .15s, background .15s;
}
.zona:hover, .zona.arrastre { border-color: var(--amarillo-fuerte); background: var(--amarillo-tenue); }
.zona svg { width: 30px; height: 30px; margin-bottom: 4px; }
.zona strong { font: 600 15px var(--f-titulo); color: var(--g900); }
.zona span { font-size: 13.5px; color: var(--g500); }
.zona.chica { flex-direction: row; justify-content: center; gap: 10px; padding: 12px 16px; }
.zona.chica svg { width: 20px; height: 20px; margin: 0; }
.filtro-ayuda { padding: 11px 14px; background: var(--amarillo-tenue); border: 1px solid #F3DB92; border-radius: 9px; font-size: 14px; line-height: 1.9; color: #4C3500; }
.filtro-ayuda b { color: var(--g900); }
.copiar { margin-left: 4px; padding: 1px 9px; background: #fff; border: 1px solid #E0BE5B; border-radius: 6px; color: var(--amarillo-tinta); font-size: 12.5px; font-weight: 500; }
.copiar:hover { background: var(--amarillo-suave); }
.cc-datos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.cc-datos div b { display: block; font: 600 17px/1.2 var(--f-titulo); color: var(--g900); }
.cc-datos div span { font-size: 13px; color: var(--g500); }
.cc-acciones { display: flex; gap: 10px; flex-wrap: wrap; }
.carga-proceso { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--g50); border-radius: 10px; font-weight: 500; }
.carga-aviso { padding: 14px 16px; border-radius: 10px; background: var(--amarillo-suave); border: 1px solid #F1D68A; color: var(--amarillo-tinta); }
.carga-aviso.error { background: var(--ladrillo-suave); border-color: #F0C2BD; color: #7A1914; }
.carga-aviso b { display: flex; align-items: center; gap: 8px; color: inherit; }
.carga-aviso ul { margin: 8px 0 0; padding-left: 20px; font-size: 14px; }
.carga-aviso .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.fechas-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fechas-chips span { padding: 2px 10px; border-radius: 999px; font-size: 12.5px; background: var(--g100); color: var(--g600); }
.fechas-chips span.dentro { background: var(--amarillo-suave); color: var(--g900); font-weight: 500; }

/* ─── Tablas ────────────────────────────────────────────────────────────── */
.herramientas { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.pildoras { display: flex; gap: 6px; flex-wrap: wrap; }
.pildoras button { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; background: #fff; border: 1px solid var(--g300); border-radius: 999px; font-size: 13.5px; color: var(--g700); }
.pildoras button b { font-weight: 600; font-size: 12.5px; padding: 0 6px; border-radius: 9px; background: var(--g100); }
.pildoras button:hover { border-color: var(--g500); }
.pildoras button[aria-pressed="true"] { background: var(--g800); border-color: var(--g800); color: #fff; }
.pildoras button[aria-pressed="true"] b { background: var(--amarillo); color: var(--g900); }
.buscar { width: 300px; max-width: 100%; padding: 8px 12px; background: #fff; border: 1px solid var(--g300); border-radius: 8px; font-size: 14px; }
.buscar:focus { outline: 3px solid var(--amarillo-fuerte); outline-offset: 0; border-color: var(--amarillo-fuerte); }

.tabla-wrap { overflow: auto; background: var(--papel); border: 1px solid var(--g200); border-radius: 12px; }
.tabla { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
.tabla th {
  position: sticky; top: 0; z-index: 3; padding: 10px 14px; background: var(--g100); color: var(--g600); border-bottom: 1px solid var(--g200);
  font-weight: 600; font-size: 12.5px; text-align: left; white-space: nowrap;
}
.tabla th.der, .tabla td.der { text-align: right; }
.tabla td { padding: 11px 14px; border-bottom: 1px solid var(--g100); vertical-align: middle; }
.tabla tbody tr:last-child td { border-bottom: 0; }
.tabla tbody tr.clic { cursor: pointer; }
.tabla tbody tr.clic:hover td { background: var(--g50); }
.tabla tr.grupo-fila td { background: var(--g50); font-weight: 600; font-size: 13px; color: var(--g600); padding: 8px 14px; }
.quien { min-width: 0; }
.quien b { display: block; font-weight: 500; color: var(--g900); max-width: 34ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quien small { display: block; font-size: 12.5px; color: var(--g500); }
.cuando small { display: block; font-size: 12.5px; color: var(--g500); }
.monto { font-weight: 600; white-space: nowrap; }
.motivo { font-size: 13.5px; color: var(--g600); max-width: 56ch; }
.motivo b { color: var(--g900); font-weight: 500; }
.celda-acc { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: nowrap; white-space: nowrap; }
.tilde { appearance: none; width: 20px; height: 20px; margin: 0; border: 1.6px solid var(--g400); border-radius: 6px; background: #fff; display: grid; place-content: center; cursor: pointer; }
.tilde:checked { background: var(--amarillo); border-color: var(--amarillo-fuerte); }
.tilde:checked::after { content: ""; width: 10px; height: 5px; border: solid var(--g900); border-width: 0 0 2.4px 2.4px; transform: rotate(-45deg) translate(1px, -1px); }
.tilde:disabled { opacity: .45; cursor: default; }
.col-tilde { width: 44px; padding-right: 0 !important; }

.plegable { margin-top: 18px; background: var(--papel); border: 1px solid var(--g200); border-radius: 12px; overflow: hidden; }
.plegable summary { display: flex; align-items: center; gap: 10px; padding: 14px 20px; list-style: none; cursor: pointer; font: 600 15px var(--f-titulo); }
.plegable summary::-webkit-details-marker { display: none; }
.plegable summary .cuantos { font: 400 14px var(--f-texto); color: var(--g500); }
.plegable summary .mas { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font: 400 13.5px var(--f-texto); color: var(--g500); }
.plegable[open] summary .mas svg { transform: rotate(180deg); }
.plegable .tabla-wrap { border: 0; border-top: 1px solid var(--g200); border-radius: 0; }

.grupo { margin-top: 26px; }
.grupo-cab { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.grupo-cab svg { width: 22px; height: 22px; }
.grupo-cab h3 { font-size: 17px; }
.grupo-cab .cuantos { font-size: 14px; color: var(--g500); }
.grupo-cab .espacio { flex: 1; }
.grupo-nota { margin: 0 0 12px 32px; font-size: 14px; color: var(--g500); max-width: 70ch; }

.barra-envio {
  position: sticky; bottom: 18px; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 22px;
  padding: 12px 14px 12px 22px; background: var(--g800); color: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
}
.barra-envio .resumen-envio { font-weight: 500; }
.barra-envio .resumen-envio small { display: block; font-size: 13px; color: var(--g300); font-weight: 400; }

/* ─── Hoja de trabajo (réplica de la hoja de cálculo) ───────────────────── */
.hoja-wrap { max-height: calc(100vh - 290px); min-height: 320px; }
.tabla.hoja { font-size: 13.5px; width: max-content; min-width: 100%; }
.tabla.hoja th { background: var(--g600); color: #fff; border-right: 1px solid #6a6a6a; border-bottom: 0; text-align: center; padding: 9px 12px; vertical-align: bottom; }
.tabla.hoja th.calc { background: var(--amarillo); color: var(--g900); border-right-color: #E3A60C; }
.tabla.hoja thead tr.letras th { top: 0; background: var(--g100); color: var(--g500); font-weight: 500; font-size: 11.5px; padding: 3px 4px; border-right: 1px solid var(--g200); border-bottom: 1px solid var(--g200); }
.tabla.hoja thead tr.titulos th { top: 25px; }
.tabla.hoja td { border-right: 1px solid var(--g100); white-space: nowrap; padding: 8px 12px; }
.tabla.hoja td.rn { background: var(--g100); color: var(--g500); font-size: 12px; text-align: center; width: 44px; min-width: 44px; padding: 8px 4px; }
.tabla.hoja td.total { background: var(--amarillo-tenue); font-weight: 600; }
.tabla.hoja td.cero { color: var(--g300); }
.tabla.hoja tbody tr.clic:hover td { background: var(--amarillo-tenue); }
